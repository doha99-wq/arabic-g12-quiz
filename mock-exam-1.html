:root{
  --bg:#f6f7f9;--card:#fff;--soft:#f0f2f5;--text:#16181d;--muted:#5f6672;--border:#dde1e7;
  --accent:#0f6e6e;--accent-soft:#e3f2f1;--ok:#1b7f3b;--ok-soft:#e5f5ea;--bad:#b42318;--bad-soft:#fdecea;
  --radius:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111418;--card:#1a1e24;--soft:#22272f;--text:#eef0f3;--muted:#a3abb7;--border:#323945;
  --accent:#5cc8c0;--accent-soft:#17312f;--ok:#5fd38a;--ok-soft:#163222;--bad:#ff8a80;--bad-soft:#3a1a18;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"QuizNaskh","Noto Naskh Arabic","Geeza Pro","Segoe UI","Tahoma",sans-serif;font-size:16px;line-height:1.75}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px}
header h1{font-size:1.3rem;line-height:1.5;margin:6px 0 2px}
header p{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}
input,select{width:100%;font:inherit;font-size:16px;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text)}
.field+.field{margin-top:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{font:inherit;font-size:.95rem;padding:9px 16px;min-height:44px;min-width:44px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#0b1416}}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 4px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:6px 4px;text-align:center}
.stat b{display:block;font-size:1.15rem;line-height:1.4}
.stat span{font-size:.75rem;color:var(--muted)}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meta{font-size:.82rem;color:var(--muted)}
.qhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.qhead h2{font-size:1.05rem;margin:0}
.chip{display:inline-block;font-size:.78rem;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 10px}
.qtext{font-size:1.08rem;font-weight:600;margin:10px 0 4px}
.quote{background:var(--soft);border-radius:12px;padding:12px;margin-top:10px;text-align:center}
.quote .ref{font-size:.8rem;color:var(--muted)}
.poem{display:flex;flex-wrap:wrap;justify-content:center;column-gap:28px;font-family:"QuizAmiri","Amiri",serif;font-size:1.28rem;line-height:2}
.prose{font-family:"QuizAmiri","Amiri",serif;font-size:1.15rem;line-height:2;text-align:right}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:right;font:inherit;font-size:1rem;line-height:1.7;padding:12px 14px;margin-top:8px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent)}}
.opt{touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
.opt .k{flex:0 0 auto;min-width:1.6em;height:1.6em;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;margin-top:.1em}
.opt:disabled{cursor:default}
.opt.correct{background:var(--ok-soft);border:2px solid var(--ok);font-weight:600}
.opt.wrong{background:var(--bad-soft);border:2px solid var(--bad)}
.opt.dim{opacity:.55}
.fb{margin-top:12px;padding:12px;border-radius:12px;font-size:.95rem}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.fb .t{font-weight:700}.fb.ok .t{color:var(--ok)}.fb.bad .t{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:8px}
th,td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:right}
th{color:var(--muted);font-weight:600}
.notice{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:.92rem;margin-top:12px}
.warnbox{background:var(--bad-soft);border-radius:12px;padding:10px 12px;font-size:.92rem;margin-top:12px}
.wrongitem{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.93rem}
.wrongitem .a{color:var(--ok)}
h3{font-size:1.02rem;margin:0 0 4px}
.final{font-size:1.15rem;font-weight:700}
footer{margin-top:18px;font-size:.8rem;color:var(--muted);text-align:center}
@media (min-width:700px){.wrap{padding:22px 20px 50px}header h1{font-size:1.55rem}.stat b{font-size:1.3rem}}
textarea{width:100%;font:inherit;font-size:16px;line-height:1.8;min-height:150px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);resize:vertical}
textarea.long{min-height:320px}
.topbar{position:sticky;top:0;z-index:6;background:var(--bg);padding:8px 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 12px;min-height:44px;display:inline-flex;align-items:center;direction:ltr}
.timer.paused{color:var(--muted)}.timer.low{color:var(--bad);border-color:var(--bad)}
.grow{flex:1 1 auto}
.tbanner{background:var(--bad-soft);border-radius:12px;padding:10px 12px;font-size:.92rem;margin-top:8px;font-weight:600}
.tbanner.info{background:var(--accent-soft)}
.opt.sel{border:2px solid var(--accent);background:var(--accent-soft);font-weight:600}
.rowq{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:8px}
.rowq.ok{border-color:var(--ok);background:var(--ok-soft)}.rowq.bad{border-color:var(--bad);background:var(--bad-soft)}
.rowq .t{font-weight:600;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .btn{flex:1 1 0;padding:8px 6px}
.seg .btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.seg .btn.on{color:#0b1416}}
details{margin-top:10px;border:1px solid var(--border);border-radius:12px;background:var(--soft)}
summary{min-height:44px;display:flex;align-items:center;padding:8px 12px;cursor:pointer;font-weight:600;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
details .pbody{padding:4px 12px 12px}
.verse{display:flex;flex-wrap:wrap;justify-content:space-between;column-gap:18px;font-family:"QuizAmiri","Amiri",serif;font-size:1.18rem;line-height:2;border-bottom:1px dashed var(--border);padding:2px 0}
.verse .n{font-family:inherit;font-size:.8rem;color:var(--muted);margin-left:6px}
.verse span{display:block}
.verse .h2{margin-right:auto}
.prose p{margin:0 0 10px}
.model{background:var(--ok-soft);border-radius:12px;padding:12px;margin-top:10px}
.model .t{font-weight:700;color:var(--ok)}
.rubric{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.92rem}
.rubric ul{margin:4px 0 0;padding-right:20px}
.mine{white-space:pre-wrap;background:var(--card);border:1px dashed var(--border);border-radius:12px;padding:10px 12px;margin-top:8px;min-height:44px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;padding:8px 12px 12px}
.grid .btn{padding:4px;font-size:.85rem}
.grid .btn.done{background:var(--accent-soft);border-color:var(--accent)}
.grid .btn.cur{outline:3px solid var(--accent)}
.big{font-size:1.6rem;font-weight:800;color:var(--accent)}
.src{font-size:.82rem;color:var(--muted);margin-top:8px;word-break:break-word}
.src a{color:var(--accent);display:inline-flex;align-items:center;min-height:44px;min-width:44px}
.weak{border-right:4px solid var(--bad);border-radius:10px;background:var(--card);padding:8px 12px;margin-top:8px;font-size:.93rem}
td.num,th.num{text-align:center}
</style>

<script>
"use strict";
const DATA = {"texts":[{"id":"t1","type":"poem","label":"النص الشعري","title":"اللغة العربية تنعى حظها (الأبيات 1–10)","author":"حافظ إبراهيم (1872–1932م)","cite":"حافظ إبراهيم، قصيدة «اللغة العربية تنعى حظها» (مطلعها: رجعتُ لنفسي فاتهمتُ حصاتي)، ديوان حافظ إبراهيم. النص منقول حرفيًّا من «ويكي مصدر»؛ الأبيات العشرة الأولى من 23 بيتًا.","url":"https://ar.wikisource.org/wiki/رجعت_لنفسي_فاتهمت_حصاتي","verses":[["رَجَعْتُ لنفْسِي فاتَّهمتُ حَصاتِي","وناديْتُ قَوْمِي فاحْتَسَبْتُ حياتِي"],["رَمَوني بعُقمٍ في الشَّبابِ وليتَني","عَقِمتُ فلم أجزَعْ لقَولِ عِداتي"],["وَلَدتُ ولمَّا لم أجِدْ لعرائسي","رِجالاً وأَكفاءً وَأَدْتُ بناتِي"],["وسِعتُ كِتابَ اللهِ لَفظاً وغايةً","وما ضِقْتُ عن آيٍ به وعِظاتِ"],["فكيف أضِيقُ اليومَ عن وَصفِ آلةٍ","وتَنْسِيقِ أسماءٍ لمُخْترَعاتِ"],["أنا البحر في أحشائه الدر كامن","فهل ساءلوا الغواص عن صدفاتي"],["فيا وَيحَكُم أبلى وتَبلى مَحاسِني","ومنْكمْ وإنْ عَزَّ الدّواءُ أساتِي"],["فلا تَكِلُوني للزّمانِ فإنّني","أخافُ عليكم أن تَحينَ وَفاتي"],["أرى لرِجالِ الغَربِ عِزّاً ومَنعَةً","وكم عَزَّ أقوامٌ بعِزِّ لُغاتِ"],["أتَوْا أهلَهُم بالمُعجِزاتِ تَفَنُّناً","فيا ليتَكُمْ تأتونَ بالكلِمَاتِ"]],"gloss":"حَصاتي: عقلي ورأيي. عِداتي: أعدائي. وأدتُ: دفنتُ حيّةً. ويحكم: كلمة ترحّم وتوجّع. أساتي: أطبّائي (مفردها: آسٍ). تَكِلوني: تتركوني. مَنَعة: قوّة وعزّة. (المعاني من وضع معدّ الاختبار للتيسير)"},{"id":"t2","type":"prose","label":"النص المقالي","title":"الرحمة (مقتطفات)","author":"مصطفى لطفي المنفلوطي (1876–1924م)","cite":"مصطفى لطفي المنفلوطي، مقالة «الرحمة»، كتاب «النظرات» (الجزء الأول، صدر 1910م). النص منقول حرفيًّا من نسخة مؤسسة هنداوي (ملكية عامة)، والحذف مشار إليه بـ […].","url":"https://www.hindawi.org/books/94061468/10/","paras":["سأكون في هذه المرة شاعرًا بلا قافيةٍ ولا بحرٍ؛ لأني أريد أن أخاطب القلب وجهًا لوجهٍ، ولا سبيل إلى ذلك إلا سبيل الشعر.","إنَّ البذور تُلْقَى في الأرض فلا تنبت إلا إذا حرث الحارث تربتها وجعل عاليها سافلها، وكذلك القلب لا تبلغ منه العظة إلا إذا داخلته وتخللت أجزاءه وبلغت سويداءه، ولا محراث للقلب غير الشعر.","أيها الرجل السعيد كن رحيمًا، أشعِرْ قلبك الرحمة، ليكن قلبُك الرحمةَ بعينها.","ستقول: إني غير سعيد؛ لأن بين جنبي قلبًا يلم به من الهم ما يُلمُّ بغيره من القلوب، أجل فليكن ذلك كذلك، ولكن أطعم الجائع واكس العاري وعزِّ المحزونَ وفرِّج كربة المكروب يكن لك من هذا المجتمع البائس خير عزاءٍ يعزيك عن همومك وأحزانك، ولا تعجب أن يأتيك النور من سواد الحَلَكِ، فالبدر لا يطلع إلا إذا شق رداء الليل، والفجر لا يدرُج إلا من مهد الظلام، لقد بَليتِ اللذاتُ كلها ورثت حبالها وأصبحت أثقل على النفس من الحديث المعاد، ولم يبق ما يعزي الإنسان عنها إلا لذة واحدة، هي لذة الإحسان.","[…]","ليتك تبكي كلما وقع نظرك على محزونٍ أو مفئودٍ فتبتسم سرورًا ببكائك، واغتباطًا بدموعك؛ لأن الدموع التي تنحدر على خديك في مثل هذا الموقف إنما هي سطورٌ من نورٍ تُسجِّل لك في تلك الصحيفة البيضاء أنك إنسان.","إنَّ السماء تبكي بدموع الغمام، ويخفق قلبها بلمعان البرق، وتصرخ بهدير الرعد، وإنَّ الأرض تئن بحفيف الريح، وتضج بأمواج البحر، وما بكاء السماء ولا أنين الأرض إلا رحمة بالإنسان، ونحن أبناء الطبيعة فَلنُجارِها في بكائها وحنينها.","إنَّ اليد التي تصون الدموع أفضل من اليد التي تريق الدماء، والتي تشرح الصدور أشرف من التي تبقر البطون، فالمحسن أفضل من القائد، وأشرف من المجاهد، وكم بين من يحيي الميت ومن يميت الحي!","إنَّ الرحمة كلمة صغيرة، ولكن بين لفظها ومعناها من الفرق مثل ما بين الشمس في منظرها والشمس في حقيقتها.","إذا وجد الحكيم بين جوانح الإنسان ضالته من القلب الرحيم وجد المجتمع ضالته من السعادة والهناء.","لو تراحم الناس لما كان بينهم جائعٌ ولا عارٍ، ولا مغبونٌ ولا مهضومٌ، ولأقفرت الجفون من المدامع، واطمأنت الجنوب في المضاجع، ولَمَحَتِ الرحمة الشقاء من المجتمع كما يمحو لسان الصبح مداد الظلام.","[…]","أيها السعداء، أحسنوا إلى البائسين والفقراء، وامسحوا دموع الأشقياء، وارحموا من في الأرض يرحمكم من في السماء."],"gloss":"سويداء القلب: حبّته وأعمقُ ما فيه. الحَلَك: شدّة السواد. مفئود: موجَع الفؤاد. يدرُج: يمضي ويخرج. (المعاني من وضع معدّ الاختبار للتيسير)"},{"id":"t3","type":"prose","label":"النص السردي","title":"البنفسجة الطموحة (مقتطفات)","author":"جبران خليل جبران (1883–1931م)","cite":"جبران خليل جبران، «البنفسجة الطموحة»، من كتاب «العواصف» (صدر 1920م). النص منقول حرفيًّا من نسخة مؤسسة هنداوي (ملكية عامة)، والحذف مشار إليه بـ […].","url":"https://www.hindawi.org/books/85258647/29/","paras":["كانت في حديقة منفردة بنفسجة جميلة الثنايا، طيبة العرف تعيش مقتنعةً بين أترابها وتتمايل فرحًا بين قامات الأعشاب.","ففي صباح، وقد تكللت بقطر الندى، رفعت رأسها، ونظرت حواليها فرأت وردةً تتطاول نحو العلاء بقامة هيفاء، ورأس يتسامى متشامخًا كأنه شعلة من النار فوق مَسْرَجَةٍ من الزمرد.","ففتحت البنفسجة ثغرها الأزرق، وقالت متنهدة «ما أقل حظي بين الرياحين، وما أوضع مقامي بين الأزهار: فقد ابتدعتني الطبيعة صغيرة حقيرة، أعيش ملتصقةً بأديم الأرض، ولا أستطيع أن أرفع قامتي نحو ازْرِقَاقْ السماء، أو أحول وجهي نحو الشمس مثلما تفعل الورود».","وسمعت الوردة ما قالته جارتها البنفسجة؛ فاهتزت ضاحكةً ثم قالت: «ما أغباكِ بين الأزهار، فأنت في نعمة تجهلين قيمتها، فقد وهبتك الطبيعة من الطيب، والظرف، والجمال ما لم تهبه لكثير من الرياحين، فَخَلِّ عنك هذه الميول العوجاء، والأماني الشريرة، وكوني قنوعةً بما قُسِمَ لك، واعلمي أن من خفض جناحه يُرفع قدره، وأن من طلب المزيد وقع في النقصان».","فأجابت البنفسجة قائلة: أنت تعزيني أيتها الوردة؛ لأنك حاصلة على ما أتمناه، وتغمرين حقارتي بالحكم؛ لأنك عظيمة، وما أمر مواعظ السعداء في قلوب التعساء، وما أقسى القوي إذا وقف خطيبًا بين الضعفاء».","وسمعت الطبيعة ما دار بين الوردة، والبنفسجة، فاهتزت مستغربةً، ثم رفعت صوتها قائلةً: ماذا جرى لك يا ابنتي البنفسجة؟ فقد عرفتك لطيفة بتواضعك، عذبة بصغرك، شريفة بمسكنتك، فهل استهوتك المطامع القبيحة، أم سلبت عقلك العظمة الفارغة؟».","[…]","فقالت الطبيعة: «أنت لا تدرين ما تطلبين، ولا تعلمين ما وراء العظمة الظاهرة من البلايا الخفية، فإذا رفعت قامتك، وأبدلت صورتك، وجعلتك وردة تندمين حين لا ينفع الندم».","فقالت البنفسجة: «حوِّلي كياني البنفسجي إلى وردة مديدة القامة، مرفوعة الرأس، ومهما يحل بي بعد ذلك يكن صنع رغائبي ومطامعي».","فقالت الطبيعة: «لقد أجبت طلبك أيتها البنفسجة الجاهلة المتمردة، ولكن إذا داهمتك المصائب، والمصاعب فلتكن شكواك من نفسك».","ومدت الطبيعة أصابعها الخفية السحرية، ولمست عروق البنفسجة؛ فتحولت بلحظة إلى وردة زاهية متعالية فوق الأزهار والرياحين.","ولما جاء عصر ذلك النهار تلبد الفضاء بغيوم سوداء مبطنة بالإعصار، ثم هاجت سواكن الوجود؛ فأبرقت، وأرعدت، وأخذت تحارب تلك الحدائق، والبساتين بجيش عَرَمْرَمْ من الأمطار والأهواء؛ فكسرت الأغصان، ولوت الأنصاب، واقتلعت الأزهار المتشامخة، ولم تبق إلا على الرياحين الصغيرة التي تلتصق بالأرض، أو تختبئ بين الصخور.","[…]","ونظرت إذ ذاك مليكة طائفة البنفسج، فرأت على مقربة منها الوردة التي كانت بالأمس بنفسجة، وقد اقتلعتها العاصفة، وبعثرت أوراقها الأرياح، وألقتها على الأعشاب المبللة؛ فبانت كقتيل أرداه العدو بسهم.","[…]","ثم لوت عنقها، وبصوت يكاد أن يكون لهاثًا قالت: «أنا أموت الآن، أموت وفي نفسي ما لم تُكِنُهُ نفس بَنفسجة من قبلي، أموت وأنا عالمة بما وراء المحيط المحدود الذي ولدت فيه، وهذا هو القصد من الحياة، هذا هو الجوهر الكائن وراء عرضيات الأيام والليالي».","وأطبقت الوردة أوراقها، وارتعشت قليلًا، ثم ماتت، وعلى وجهها ابتسامة علوية، ابتسامة مَن حققت الحياةُ أمانيه، ابتسامة النصر، والتغلب، ابتسامة الله."],"gloss":"العَرْف: الرائحة الطيبة. أترابها: نظيراتها في السنّ. هيفاء: ضامرة رشيقة. المَسْرَجة: موضع السراج. أديم الأرض: وجهها. عَرَمْرَم: كثير شديد. (المعاني من وضع معدّ الاختبار للتيسير)"}],"items":[{"id":"q1","sec":"s1","no":"السؤال 1","kind":"match","max":2,"topic":"أفعال المقاربة والرجاء والشروع","pages":"ص 56–60","prompt":"صِلْ كلَّ جملة بنوع الفعل الناسخ فيها (لكل اختيار صحيح نصف درجة):","cats":["مقاربة","رجاء","شروع"],"rows":[["أوشكَ الليلُ أنْ ينقضيَ.",0],["عسى الغائبُ أنْ يعودَ قريبًا.",1],["شرَعَ الطلابُ يراجعون دروسَهم.",2],["حرى المجتهدُ أنْ يتفوّقَ.",1]],"explain":"أفعال المقاربة: كاد، كرب، أوشك. أفعال الرجاء: عسى، حرى، اخلولق. أفعال الشروع: أخذ، بدأ، شرع، جعل، طفق… وخبر أفعال الشروع لا يقترن بـ(أنْ)، ويجب اقترانه بها بعد (حرى) و(اخلولق)."},{"id":"q2","sec":"s1","no":"السؤال 2","kind":"mcq","max":2,"topic":"أحوال المبتدأ والخبر","pages":"ص 95–99","prompt":"في أيّ الجمل الآتية تقدّم الخبرُ وجوبًا لأنّ المبتدأ نكرةٌ والخبرَ شبهُ جملة؟","options":["للنجاحِ أسبابٌ.","الأسبابُ للنجاحِ واضحةٌ.","في البيتِ صاحبُه.","العلمُ نورٌ."],"answer":0,"explain":"(للنجاح أسبابٌ): المبتدأ (أسبابٌ) نكرة والخبر شبه جملة (للنجاح) فوجب تقديمه. أمّا (في البيت صاحبُه) فتقدّم الخبر وجوبًا لسبب آخر: اتصال المبتدأ بضمير يعود على الخبر."},{"id":"q3","sec":"s1","no":"السؤال 3","kind":"tf","max":2,"topic":"أدوات الشرط غير الجازمة (وحذف الخبر بعد لولا)","pages":"ص 186–189، 97","prompt":"ضع (صح) أو (خطأ) أمام كل عبارة (لكل عبارة نصف درجة):","rows":[["«لولا» حرفُ امتناعٍ لوجود.",true],["«كلّما» ظرفٌ للزمان المستقبل، ولا تفيد التكرار.",false],["في جملة «لولا العلمُ لسادَ الجهلُ» خبرُ المبتدأ محذوف.",true],["«إذا» من أدوات الشرط الجازمة.",false]],"explain":"لولا: حرف امتناع لوجود، والاسم بعدها مبتدأ خبره محذوف (لولا العلمُ موجودٌ). كلّما: ظرف للزمان الماضي يفيد التكرار، وتحتاج إلى فعل وجواب ماضيين. إذا: ظرف لما يستقبل من الزمان متضمّن معنى الشرط، وهي غير جازمة."},{"id":"q4","sec":"s1","no":"السؤال 4","kind":"mcq","max":2,"topic":"المصدر المؤول (الإعراب)","pages":"ص 126–127","prompt":"«يسرُّني أنْ تتفوّقَ في دراستك». اختر الإعراب الصحيح للمصدر المؤول:","options":["(أنْ تتفوّقَ) مصدر مؤول في محل رفع فاعل، تقديره: تفوّقُك.","(أنْ تتفوّقَ) مصدر مؤول في محل نصب مفعول به، تقديره: تفوّقَك.","(أنْ تتفوّقَ) مصدر مؤول في محل رفع مبتدأ مؤخر.","(أنْ تتفوّقَ) مصدر مؤول في محل جر بحرف الجر."],"answer":0,"explain":"نحوّل المصدر المؤول إلى صريح: «يسرّني تفوّقُك»، فهو فاعل للفعل (يسرّ)، والياء في (يسرّني) مفعول به مقدّم."},{"id":"q5","sec":"s1","no":"السؤال 5","kind":"mcq","max":2,"topic":"أدوات الشرط الجازمة (اقتران الجواب بالفاء)","pages":"ص 159–162","prompt":"في أيّ الجمل الآتية وجب اقتران جواب الشرط بالفاء؟","options":["مَنْ يجتهدْ فهو ناجحٌ.","إنْ تدرسْ تنجحْ.","متى تُخلصْ في عملك يحترمْك الناسُ.","أينما تذهبْ تجدْ أصدقاءَ."],"answer":0,"explain":"يجب اقتران جواب الشرط بالفاء إذا كان جملة اسمية (فهو ناجحٌ)، أو جملة فعلية فعلها طلبي أو جامد، أو مسبوقًا بـ(قد) أو (لن) أو (ما)… وفي بقية الخيارات الجواب فعل مضارع مجزوم لا يحتاج إلى الفاء."},{"id":"q6","sec":"s1","no":"السؤال 6","kind":"mcq","max":2,"topic":"المصدر الميمي","pages":"ص 226–228","prompt":"أيّ الكلمات الآتية مصدرٌ ميميّ مصوغ من فعل غير ثلاثي؟","options":["مُنْطَلَق","مَخْرَج","مَوْعِد","مَسْعى"],"answer":0,"explain":"(مُنْطَلَق) من الخماسي (انطلق) على صورة المضارع بإبدال حرف المضارعة ميمًا مضمومة وفتح ما قبل الآخر. أمّا (مَخْرَج، مَسْعى) فعلى وزن مَفْعَل من الثلاثي، و(مَوْعِد) على وزن مَفْعِل من المثال الواوي (وعد)."},{"id":"t1_7","sec":"s2","group":"t1","no":"السؤال 7","kind":"mcq","max":2,"prompt":"في قوله «أنا البحر في أحشائه الدر كامن» تشبيه نوعه:","options":["تشبيه بليغ","تشبيه تمثيلي","تشبيه مرسل","تشبيه ضمني"],"answer":0,"topic":"البلاغة: التشبيه","pages":"ص 20","explain":"ذُكر المشبّه (أنا = اللغة) والمشبّه به (البحر)، وحُذفت الأداة ووجه الشبه، فهو تشبيه بليغ."},{"id":"t1_a1","sec":"s2","group":"t1","no":"السؤال 8 (أ-1)","kind":"open","max":2,"step":1,"prompt":"مَن المتحدِّث في الأبيات؟ واستدلّ على إجابتك ببيت أو تعبير من النص.","model":"المتحدّثة هي اللغة العربية (على لسانها). الدليل: «وسعتُ كتاب الله لفظًا وغايةً» أو «أنا البحر في أحشائه الدر كامن» أو «أرى لرجال الغرب عزًّا… بعزّ لغاتِ».","rubric":"درجة لتحديد المتحدّث (اللغة العربية)، ودرجة لدليل صحيح من النص.","topic":"فهم النص الشعري","pages":"—"},{"id":"t1_a2","sec":"s2","group":"t1","no":"السؤال 8 (أ-2)","kind":"open","max":2,"step":1,"prompt":"استنتج سببين لشكوى المتحدِّثة من قومها.","model":"1) اتّهامها بالعُقم والعجز عن مواكبة العصر ووصف المخترعات (رموني بعقمٍ… فكيف أضيق اليوم عن وصف آلة). 2) هجرهم لها وإهمال كنوزها وعدم البحث عنها (فهل ساءلوا الغواص عن صدفاتي). (يُقبل أيضًا: انبهارهم بلغات الغرب وتركها للزمان).","rubric":"درجة لكل سبب صحيح (درجتان).","topic":"فهم النص الشعري","pages":"—"},{"id":"t1_b1","sec":"s2","group":"t1","no":"السؤال 8 (ب-1)","kind":"open","max":2,"step":1,"prompt":"استخرج من الأبيات (1–5) أسلوبًا إنشائيًا، ثم بيّن نوعه وغرضه البلاغي.","model":"«فكيف أضيقُ اليومَ عن وصف آلةٍ…»: أسلوب إنشائي طلبي نوعه استفهام، غرضه الإنكار والتعجّب (أي: لا أضيق). أو «وليتني عقمتُ»: تمنٍّ غرضه التحسّر.","rubric":"درجة للاستخراج مع النوع، ودرجة للغرض.","topic":"البلاغة (مراجعة المدخل) ص 18–26","pages":"ص 18–26"},{"id":"t1_b2","sec":"s2","group":"t1","no":"السؤال 8 (ب-2)","kind":"open","max":2,"step":1,"prompt":"اذكر سمتين من سمات مدرسة الإحياء ظهرتا في الأبيات، مع التمثيل.","model":"1) المحافظة على شكل القصيدة العربية من حيث وحدة الوزن والقافية (القافية التائية المكسورة: حصاتي، حياتي، عِداتي…). 2) الالتزام بالقاموس الأدبي القديم في المفردات والتعبيرات (عِداتي، أساتي، تَكِلوني، الغوّاص والصدفات). (يُقبل: جزالة الألفاظ ومتانة الأسلوب).","rubric":"درجة لكل سمة صحيحة مع مثال (درجتان).","topic":"القضايا الأدبية: سمات مدرسة الإحياء","pages":"ص 77"},{"id":"t1_c","sec":"s2","group":"t1","no":"السؤال 8 (ج)","kind":"open","max":2,"step":1,"prompt":"حدّد العاطفة المسيطرة على الأبيات، ثم استدلّ عليها من النص.","model":"عاطفة الحزن والألم الممزوج بالعتاب والخوف على القوم. الدليل: «فيا ويحكم أبلى وتبلى محاسني» / «أخاف عليكم أن تحين وفاتي».","rubric":"درجة لتحديد العاطفة، ودرجة للدليل.","topic":"معايير نقد الشعر: العاطفة","pages":"ص 201–202"},{"id":"t2_7","sec":"s2","group":"t2","no":"السؤال 7","kind":"mcq","max":2,"prompt":"معنى (سويداءه) في قوله «وبلغت سويداءه»:","options":["أعماقه وحَبّته","ظاهره","سواده وحزنه","حدوده"],"answer":0,"topic":"المعجم: معاني المفردات في السياق","pages":"—","explain":"سويداء القلب: حبّته وأعمق موضع فيه؛ والمعنى أن العظة لا تؤثر إلا إذا وصلت إلى أعماق القلب."},{"id":"t2_a1","sec":"s2","group":"t2","no":"السؤال 8 (أ-1)","kind":"open","max":2,"step":1,"prompt":"لماذا قرّر الكاتب أن يكون «شاعرًا بلا قافية ولا بحر»؟ وبمَ شبّه القلب في ذلك؟","model":"لأنه يريد أن يخاطب القلب وجهًا لوجه، ولا سبيل إلى ذلك إلا سبيل الشعر. وشبّه القلب بالأرض التي لا تُنبت البذور إلا إذا حُرثت، والشعرُ هو محراث القلب.","rubric":"درجة للسبب، ودرجة لتشبيه القلب بالأرض المحروثة.","topic":"فهم النص المقالي","pages":"—"},{"id":"t2_a2","sec":"s2","group":"t2","no":"السؤال 8 (أ-2)","kind":"open","max":2,"step":1,"prompt":"اذكر أثرين للتراحم في المجتمع كما ورد في النص.","model":"لما كان بين الناس جائع ولا عارٍ ولا مغبون ولا مهضوم؛ وتجفّ الجفون من الدموع ويطمئن الناس في مضاجعهم؛ وتمحو الرحمةُ الشقاءَ من المجتمع؛ ويجد المجتمع ضالته من السعادة والهناء. (أيّ أثرين)","rubric":"درجة لكل أثر صحيح.","topic":"فهم النص المقالي","pages":"—"},{"id":"t2_b1","sec":"s2","group":"t2","no":"السؤال 8 (ب-1)","kind":"open","max":2,"step":1,"prompt":"علامَ استدلّ الكاتب بقوله: «فالبدر لا يطلع إلا إذا شقّ رداء الليل، والفجر لا يدرُج إلا من مهد الظلام»؟","model":"استدلّ به على أن العزاء والسعادة قد يأتيان من قلب الهموم (النور من سواد الحلك)؛ فمن كان مهمومًا يجد بالإحسان إلى البائسين خير عزاء عن همومه.","rubric":"درجتان للفكرة كاملة، ودرجة لإجابة ناقصة.","topic":"فهم النص المقالي","pages":"—"},{"id":"t2_b2","sec":"s2","group":"t2","no":"السؤال 8 (ب-2)","kind":"open","max":2,"step":1,"prompt":"في قوله: «إنما هي سطورٌ من نورٍ تُسجِّل لك في تلك الصحيفة البيضاء أنك إنسان» صورة فنية. اشرحها، وبيّن نوعها.","model":"شبّه دموع الرحمة بسطور من نور تُكتب في صحيفة بيضاء شهادةً بإنسانية صاحبها. نوعها: تشبيه بليغ (المشبّه: الدموع/هي، والمشبّه به: سطور من نور، دون أداة ولا وجه شبه). وأثرها: توضيح قيمة الرحمة وتعظيمها.","rubric":"درجة للشرح، ودرجة لنوع الصورة.","topic":"البلاغة: التشبيه","pages":"ص 20"},{"id":"t2_c","sec":"s2","group":"t2","no":"السؤال 8 (ج)","kind":"open","max":2,"step":1,"prompt":"استخرج من النص: (1) مقابلة، (2) أسلوب شرط بأداة غير جازمة مع تحديد أداته.","model":"(1) «إنّ اليد التي تصون الدموع أفضل من اليد التي تريق الدماء» أو «كم بين من يحيي الميت ومن يميت الحي». (2) «لو تراحم الناس لما كان بينهم جائع» (الأداة: لو) أو «إذا وجد الحكيم… وجد المجتمع…» (الأداة: إذا).","rubric":"درجة لكل مطلوب.","topic":"البلاغة: المقابلة + الشرط غير الجازم","pages":"ص 24، 186–189"},{"id":"t3_7","sec":"s2","group":"t3","no":"السؤال 7","kind":"mcq","max":2,"prompt":"معنى (أترابها) في قوله «تعيش مقتنعةً بين أترابها»:","options":["نظيراتها في السنّ","أعدائها","تراب أرضها","أوراقها"],"answer":0,"topic":"المعجم: معاني المفردات في السياق","pages":"—","explain":"الأتراب: جمع تِرْب، وهو المماثل في السن؛ أي بين البنفسجات المماثلات لها."},{"id":"t3_a1","sec":"s2","group":"t3","no":"السؤال 8 (أ-1)","kind":"open","max":2,"step":1,"prompt":"لماذا تذمّرت البنفسجة من حالها؟ وبمَ نصحتها الوردة؟","model":"تذمّرت لأنها صغيرة ملتصقة بأديم الأرض، لا تستطيع أن ترفع قامتها نحو السماء أو تحوّل وجهها نحو الشمس مثل الورود. ونصحتها الوردة بالقناعة بما قُسم لها، لأن من خفض جناحه يُرفع قدره ومن طلب المزيد وقع في النقصان.","rubric":"درجة لسبب التذمّر، ودرجة لنصيحة الوردة.","topic":"فهم النص السردي","pages":"—"},{"id":"t3_a2","sec":"s2","group":"t3","no":"السؤال 8 (أ-2)","kind":"open","max":2,"step":1,"prompt":"ما مصير البنفسجة بعد تحوّلها وردة؟ وما موقفها من هذا المصير؟","model":"اقتلعتها العاصفة وبعثرت أوراقها فماتت. لكنها ماتت راضية فخورة؛ لأنها عرفت ما وراء المحيط المحدود الذي وُلدت فيه، وعلى وجهها ابتسامة النصر.","rubric":"درجة للمصير، ودرجة للموقف.","topic":"فهم النص السردي","pages":"—"},{"id":"t3_b1","sec":"s2","group":"t3","no":"السؤال 8 (ب-1)","kind":"open","max":2,"step":1,"prompt":"حدّد عنصري الزمان والمكان في القصة.","model":"المكان: حديقة منفردة. الزمان: صباح يومٍ (ثم عصر ذلك النهار حين هبّت العاصفة).","rubric":"درجة للمكان، ودرجة للزمان.","topic":"عناصر القصة (الأجناس الأدبية)","pages":"ص 30–35"},{"id":"t3_b2","sec":"s2","group":"t3","no":"السؤال 8 (ب-2)","kind":"open","max":2,"step":1,"prompt":"ما دلالة كلٍّ من: (1) «وما أقسى القوي إذا وقف خطيبًا بين الضعفاء» (2) «فبانت كقتيل أرداه العدو بسهم»؟","model":"(1) أن نصح القادرِ المحرومَ مؤلمٌ وقاسٍ؛ لأنه يعظ بما لا يعانيه ولا يشعر بحاجة الضعيف. (2) شدّة ما أصاب الوردة من هلاك مفاجئ وعنيف، وتشبيه سقوطها بسقوط القتيل.","rubric":"درجة لكل دلالة.","topic":"فهم النص السردي","pages":"—"},{"id":"t3_c","sec":"s2","group":"t3","no":"السؤال 8 (ج)","kind":"open","max":2,"step":1,"prompt":"استخرج من القصة: (1) استعارة مكنية واشرحها، (2) مثالًا على الحوار.","model":"(1) «ففتحت البنفسجة ثغرها الأزرق»: شبّه البنفسجة بإنسان له ثغر يتكلم، فحذف المشبّه به (الإنسان) وأبقى شيئًا من لوازمه (الثغر/الكلام) على سبيل الاستعارة المكنية. (يُقبل: «وسمعت الطبيعة… رفعت صوتها»). (2) الحوار بين البنفسجة والوردة: «ما أغباكِ بين الأزهار…» أو بين البنفسجة والطبيعة.","rubric":"درجة للاستعارة مع شرحها، ودرجة لمثال الحوار.","topic":"البلاغة: الاستعارة","pages":"ص 21"},{"id":"m1","sec":"s3","group":"memo","no":"السؤال 9 (أ)","kind":"memo","max":2,"step":0.5,"prompt":"اكتب الأبيات الأربعة التي تلي البيت الآتي من قصيدة «غربة وحنين» لـمحمود سامي البارودي:","given":["حُزْنٌ بَرَانِي، وَأَشْوَاقٌ رَعَتْ كَبِدِي","يَا وَيْحَ نَفْسِيَ مِنْ حُزْنٍ وَأَشْوَاقِ"],"model":[["أُكَلِّفُ النَّفْسَ صَبْرًا وَهْيَ جَازِعَةٌ","وَالصَّبْرُ فِي الْحُبِّ أَعْيَا كُلَّ مُشْتَاقِ"],["لَا فِي (سَرَنْدِيبَ) لِي خِلٌّ أَلُوذُ بِهِ","وَلَا أَنِيسٌ سِوَى هَمِّي وَإِطْرَاقِي"],["أَبِيتُ أَرْعَى نُجُومَ اللَّيْلِ مُرْتَفِقًا","فِي قُنَّةٍ عَزَّ مَرْقَاهَا عَلَى الرَّاقِي"],["كَأَنَّ نَجْمَ الثُّرَيَّا وَهْوَ مُضْطَرِبٌ","دُونَ الْهِلَالِ سِرَاجٌ لَاحَ فِي طَاقِ"]],"given_no":3,"rubric":["كل بيت مكتمل صحيح = ½ درجة (4 أبيات = 2).","خطأ في أكثر من كلمة في شطر واحد من بيت، أو خطأ في ترتيب الأبيات = 1½.","خطأ في بيتين، أو كتابة الشطر الأول فقط من الأبيات، أو كتابة بيتين فقط = 1.","خطأ في ثلاثة أبيات = ½.","خطأ في الأبيات الأربعة، أو إجابة خاطئة = صفر.","درجة سؤال الحفظ = متوسط درجات القصائد الثلاث (من 2)."],"topic":"الحفظ: «غربة وحنين»","pages":"ص 81"},{"id":"m2","sec":"s3","group":"memo","no":"السؤال 9 (أ)","kind":"memo","max":2,"step":0.5,"prompt":"اكتب الأبيات الأربعة التي تلي البيت الآتي من قصيدة «الأهل أهلي والبلاد بلادي» لـفوزي المعلوف:","given":["أَطْلِقْ لِمَدْمَعِكَ الْعِنَانَ وَخَلِّهِ","يَهْمِي إِلَى أَنْ يَنْتَهِي بِنَفَادِ"],"model":[["وَدَعِ الضُّلُوعَ تُذِيبُهَا نِيرَانُهَا","حَتَّى تُجَلِّلَهَا بِثَوْبِ رَمَادِ"],["أَصْبَحْتَ فِي بَحْرٍ كَقَلْبِكَ هَائِجٍ","مُتَوَاصِلِ الْإِرْغَاءِ وَالْإِزْبَادِ"],["مُتَلَاطِمِ الْأَمْوَاجِ تَهْدِرُ فِيهِ مِنْ","هَوْجِ الرِّيَاحِ رَوَائِحٌ وَغَوَادِي"],["وَنَأَتْ دِيَارُ الْأَهْلِ عَنْكَ فَلَمْ يَعُدْ","لَكَ مَأْمَلٌ بِرُجُوعِ عَهْدِ الْوَادِي"]],"given_no":1,"rubric":["كل بيت مكتمل صحيح = ½ درجة (4 أبيات = 2).","خطأ في أكثر من كلمة في شطر واحد من بيت، أو خطأ في ترتيب الأبيات = 1½.","خطأ في بيتين، أو كتابة الشطر الأول فقط من الأبيات، أو كتابة بيتين فقط = 1.","خطأ في ثلاثة أبيات = ½.","خطأ في الأبيات الأربعة، أو إجابة خاطئة = صفر.","درجة سؤال الحفظ = متوسط درجات القصائد الثلاث (من 2)."],"topic":"الحفظ: «الأهل أهلي والبلاد بلادي»","pages":"ص 142"},{"id":"m3","sec":"s3","group":"memo","no":"السؤال 9 (أ)","kind":"memo","max":2,"step":0.5,"prompt":"اكتب الأبيات الأربعة التي تلي البيت الآتي من قصيدة «صدى الحياة» لـأبي القاسم الشابي:","given":["لَا أَرْمُقُ الظِّلَّ الْكَئِيبَ وَلَا أَرَى","مَا فِي قَرَارِ الْهُوَّةِ السَّوْدَاءِ"],"model":[["وَأَسِيرُ فِي دُنْيَا الْمَشَاعِرِ حَالِمًا","غَرِدًا وَتِلْكَ سَعَادَةُ الشُّعَرَاءِ"],["وَأُصِيخُ لِلصَّوْتِ الْإِلَهِيِّ الَّذِي","يُحْيِي بِقَلْبِي مَيِّتَ الْأَصْدَاءِ"],["لَا يُطْفِئُ اللَّهَبَ الْمُؤَجَّجَ فِي دَمِي","مَوْجُ الْأَسَى وَعَوَاصِفُ الْأَرْزَاءِ"],["إِنِّي أَنَا النَّايُ الَّذِي لَا تَنْتَهِي","أَنْغَامُهُ مَا دَامَ فِي الْأَحْيَاءِ"]],"given_no":3,"rubric":["كل بيت مكتمل صحيح = ½ درجة (4 أبيات = 2).","خطأ في أكثر من كلمة في شطر واحد من بيت، أو خطأ في ترتيب الأبيات = 1½.","خطأ في بيتين، أو كتابة الشطر الأول فقط من الأبيات، أو كتابة بيتين فقط = 1.","خطأ في ثلاثة أبيات = ½.","خطأ في الأبيات الأربعة، أو إجابة خاطئة = صفر.","درجة سؤال الحفظ = متوسط درجات القصائد الثلاث (من 2)."],"topic":"الحفظ: «صدى الحياة»","pages":"ص 178"},{"id":"l1","sec":"s3","group":"lit","no":"السؤال 9 (ب-1)","kind":"open","max":2,"step":0.5,"prompt":"اذكر سببين من أسباب ظهور مدرسة الإحياء.","model":"أيّ سببين مما يأتي: 1) نموّ الشعور الوطني والقومي لدى الشعوب العربية. 2) الرغبة في إحياء المجد الأدبي للعرب. 3) انفصال الأدب والأدباء في مرحلة الضعف عن واقع الأمة وتاريخها. 4) إكثار الشعراء من الأغراض التي لا ترقى بالشعر ولا تعبّر عن قضايا الأمة. 5) الاتصال بالثقافة الغربية التي واكبت الاستعمار الفرنسي والإنجليزي.","rubric":"درجة لكل سبب صحيح (درجتان).","topic":"القضايا الأدبية: مدرسة الإحياء","pages":"ص 75"},{"id":"l2","sec":"s3","group":"lit","no":"السؤال 9 (ب-2)","kind":"open","max":1,"step":0.5,"prompt":"اذكر خاصيتين من الخصائص الفنية للمدرسة الرومانسية.","model":"أيّ خاصيتين: التعبير عن تجربة شعورية ذاتية صادقة يطغى عليها الحزن؛ الدعوة إلى تجديد الأوزان واستعمال البحور المجزوءة وتنوّع القوافي؛ تحقيق الوحدة العضوية؛ الاهتمام بالخيال؛ الامتزاج بالطبيعة ومناجاتها وتصويرها؛ سهولة الألفاظ وعذوبتها وحيويتها؛ التجديد في الموضوعات الشعرية.","rubric":"نصف درجة لكل خاصية صحيحة.","topic":"القضايا الأدبية: المدرسة الرومانسية","pages":"ص 136"},{"id":"l3","sec":"s3","group":"lit","no":"السؤال 9 (ب-3)","kind":"open","max":1,"step":0.5,"prompt":"العاطفة من عناصر العمل الأدبي. اذكر أمرين تعتمد عليهما قوّة العاطفة وصدقها.","model":"أيّ أمرين: طبيعة الأديب (أن يكون قويّ الشعور فيما يكتب)؛ قوّة أسلوب الكاتب؛ استمرار العاطفة وثباتها على مدار القصيدة؛ خصوبة العواطف وتنوّعها.","rubric":"نصف درجة لكل أمر صحيح.","topic":"القضايا الأدبية: معايير نقد العاطفة","pages":"ص 201–202"},{"id":"w","sec":"s4","no":"السؤال 10","kind":"write","max":10,"step":0.5,"prompt":"اختر موضوعًا واحدًا فقط، واكتب فيه ما لا يقلّ عن خمسة عشر سطرًا، مراعيًا الخصائص البنائية والأسلوبية لنوع الكتابة، وسلامة اللغة وعلامات الترقيم.","note":"إذا التزمتَ بالموضوع دون الالتزام بنوع الكتابة تُعطى من 1 إلى 7 درجات، وإذا خرجتَ عن الموضوع فالدرجة صفر.","topics":[{"id":"w1","title":"مقال نقاشي","task":"يرى بعض الناس أنّ التعلّم عن بُعد يُغني عن الحضور إلى المدرسة، ويرى آخرون أنّه لا يُغني عنه. اكتب مقالًا نقاشيًا تعرض فيه الرأيين وحجج كلٍّ منهما، ثم تبيّن رأيك مدعّمًا بحجّتين.","topic":"الكتابة: المقال النقاشي","pages":"ص 61–63","crit":[["المقدمة",1,"مقدمة مناسبة تمهّد للموضوع"],["العرض",6,"فقرة لآراء المؤيدين وحججهم، وفقرة لآراء المعارضين وحججهم، ثم رأيك مع حجّتين (3 درجات للرأيين، و3 لرأيك وحجّتيه)"],["الخاتمة",1,"خاتمة مناسبة تلخّص وتؤكّد"],["علامات الترقيم",1,"توظيف صحيح لعلامات الترقيم"],["السلامة اللغوية",1,"يُخصم ½ لثلاثة أخطاء، و1 لأربعة أخطاء فأكثر"]]},{"id":"w2","title":"مقال تفسيري","task":"يُقبل كثير من الشباب في قطر على التطوّع في الفعاليات الوطنية والرياضية. اكتب مقالًا تفسيريًا تقدّم فيه تفسيرين لهذه الظاهرة.","topic":"الكتابة: المقال التفسيري","pages":"ص 100–102" function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&","<":"<",">":">",'"':""","'":"&#39;"}[c]));}

// ---------- storage ----------
let storageOK=true;
function newSession(mode){return {mode,started:new Date().toISOString(),idx:0,phase:"exam",ans:{},self:{},shown:{},wt:null,timer:{el:0,run:true},warned:[],markIdx:0,recorded:false};}
function num(x){return typeof x==="number"&&isFinite(x);}
function cleanSession(s){
  if(!s||typeof s!=="object"||!["exam","practice"].includes(s.mode)||!["exam","mark","result"].includes(s.phase))return null;
  if(!Number.isInteger(s.idx)||s.idx<0||s.idx>=ITEMS.length)s.idx=0;
  if(!Number.isInteger(s.markIdx)||s.markIdx<0)s.markIdx=0;
  const out={mode:s.mode,started:typeof s.started==="string"?s.started:new Date().toISOString(),idx:s.idx,phase:s.phase,ans:{},self:{},shown:{},wt:null,
    timer:{el:(s.timer&&num(s.timer.el)&&s.timer.el>=0)?s.timer.el:0,run:false},warned:Array.isArray(s.warned)?s.warned.filter(num):[],markIdx:s.markIdx,recorded:!!s.recorded};
  const A=s.ans||{},S=s.self||{},H=s.shown||{};
  ITEMS.forEach(q=>{const a=A[q.id];
    if(q.kind==="mcq"){if(Number.isInteger(a)&&a>=0&&a<q.options.length)out.ans[q.id]=a;}
    else if(q.kind==="tf"||q.kind==="match"){if(Array.isArray(a)&&a.length===q.rows.length)out.ans[q.id]=a.map(v=>q.kind==="tf"?(typeof v==="boolean"?v:null):(Number.isInteger(v)&&v>=0&&v<q.cats.length?v:null));}
    else if(typeof a==="string")out.ans[q.id]=a.slice(0,20000);
    const v=S[q.id];
    if(q.kind==="write"){if(v&&typeof v==="object"&&typeof v.t==="string"&&Array.isArray(v.c))out.self[q.id]={t:v.t,c:v.c.map(x=>num(x)?x:null)};}
    else if(num(v)&&v>=0&&v<=q.max)out.self[q.id]=v;
    if(H[q.id]===true)out.shown[q.id]=true;});
  if(typeof s.wt==="string"&&BY.w.topics.some(t=>t.id===s.wt))out.wt=s.wt;
  return out;
}
function load(){const d={name:"",session:null,history:[]};
  try{const raw=localStorage.getItem(KEY);if(!raw)return d;const s=JSON.parse(raw);
    return {name:typeof s.name==="string"?s.name.slice(0,60):"",session:cleanSession(s.session),
      history:Array.isArray(s.history)?s.history.filter(h=>h&&typeof h.d==="string"&&num(h.total)).slice(0,50):[]};
  }catch(e){storageOK=false;return d;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));storageOK=true;}catch(e){storageOK=false;}}
let store=load();
let resumed=!!(store.session&&store.session.phase!=="result");
let view=store.session&&store.session.phase!=="result"?"start":(store.session?"main":"start");

// ---------- timer ----------
let runStart=null; // performance-free: Date.now() when running
function elapsed(){const t=store.session.timer;return t.el+(t.run&&runStart?(Date.now()-runStart)/1000:0);}
function pauseTimer(){const s=store.session;if(!s)return;if(s.timer.run){s.timer.el=elapsed();s.timer.run=false;runStart=null;save();}}

const WARN=[[DUR/2,"انتصف زمن الاختبار: بقيت ساعة واحدة."],[DUR-900,"بقيت 15 دقيقة على نهاية الاختبار."],[DUR-300,"بقيت 5 دقائق على نهاية الاختبار."],[DUR,"انتهى الزمن الرسمي للاختبار (ساعتان). يمكنك التسليم الآن؛ الوقت الإضافي يُسجَّل."]];
let banner="";
function tick(){const s=store.session;if(!s||view!=="main")return;const e=elapsed();
  const el=document.getElementById("timer");if(el){el.textContent=clock(DUR-e);el.className="timer"+(s.timer.run?"":" paused")+(DUR-e<=300?" low":"");}
  if(s.phase==="exam")WARN.forEach(([at,msg],k)=>{if(e>=at&&!s.warned.includes(k)){s.warned.push(k);banner=msg;s.timer.el=elapsed();if(s.timer.run)runStart=Date.now();save();showBanner();}});
  if(s.timer.run&&Math.floor(e)%5===0){s.timer.el=elapsed();runStart=Date.now();save();}
}

let autoPaused=false;

// ---------- scoring ----------
function objScore(q,a){
  if(q.kind==="mcq")return a===q.answer?q.max:0;
  const per=q.max/q.rows.length;
  if(!Array.isArray(a))return 0;
  return q.rows.reduce((t,r,i)=>t+(a[i]===r[1]?per:0),0);}
function writeTopic(s){return BY.w.topics.find(t=>t.id===(s.wt||""))||null;}
function itemScore(s,q){
  if(OBJ[q.kind])return objScore(q,s.ans[q.id]);
  if(q.kind==="write"){const v=s.self.w,t=writeTopic(s);if(!v||!t||v.t!==t.id)return 0;return Math.min(10,v.c.reduce((a,x)=>a+(num(x)?x:0),0));}
  return num(s.self[q.id])?s.self[q.id]:0;}
function isScored(s,q){if(OBJ[q.kind])return true;if(q.kind==="write"){const v=s.self.w,t=writeTopic(s);return !!(v&&t&&v.t===t.id&&t.crit.every((c,i)=>num(v.c[i])));}return num(s.self[q.id]);}
function mean(a){return a.reduce((x,y)=>x+y,0)/a.length;}
function sectionScores(s){
  const sc=q=>itemScore(s,q), isA=q=>!!OBJ[q.kind];
  const part=(f)=>{ // f: filter auto or self
    const r={};
    r.s1=ITEMS.filter(q=>q.sec==="s1"&&f(q)).reduce((t,q)=>t+sc(q),0);
    r.s2=mean(["t1","t2","t3"].map(g=>ITEMS.filter(q=>q.group===g&&f(q)).reduce((t,q)=>t+sc(q),0)));
    const memo=ITEMS.filter(q=>q.group==="memo");
    r.s3=(f(memo[0])?mean(memo.map(sc)):0)+ITEMS.filter(q=>q.group==="lit"&&f(q)).reduce((t,q)=>t+sc(q),0);
    r.s4=f(BY.w)?sc(BY.w):0; return r;};
  const auto=part(isA),self=part(q=>!isA(q));
  return SECS.map(x=>({id:x.id,title:x.title,max:x.max,auto:auto[x.id],self:self[x.id],total:auto[x.id]+self[x.id]}));
}
function totals(s){const r=sectionScores(s);return {rows:r,auto:r.reduce((t,x)=>t+x.auto,0),self:r.reduce((t,x)=>t+x.self,0),total:r.reduce((t,x)=>t+x.total,0)};}
function answered(s,q){const a=s.ans[q.id];
  if(q.kind==="mcq")return Number.isInteger(a);
  if(q.kind==="tf"||q.kind==="match")return Array.isArray(a)&&a.every(v=>v!==null&&v!==undefined);
  return typeof a==="string"&&a.trim().length>0;}
function openItems(s){return ITEMS.filter(q=>!OBJ[q.kind]);}
function weakAreas(s){
  const m={};ITEMS.forEach(q=>{if(q.kind==="write"){const t=writeTopic(s);if(!t)return;var topic=t.topic,pages=t.pages;}else{var topic=q.topic,pages=q.pages;}
    const r=itemScore(s,q)/q.max;if(r>=0.75)return;
    const k=topic;(m[k]=m[k]||{topic,pages,got:0,max:0,qs:[]});m[k].got+=itemScore(s,q);m[k].max+=q.max;m[k].qs.push(qLabel(q));});
  return Object.values(m).sort((a,b)=>a.got/a.max-b.got/b.max);}
function qLabel(q){return q.group&&TEXTS[q.group]?q.no+" — "+TEXTS[q.group].label:q.no;}

// ---------- actions ----------
function act(name,el){
  const s=store.session;const d=el?el.dataset:{};
  switch(name){
    case "start":{if(s&&s.phase!=="result"&&!confirm("ستبدأ محاولة جديدة وتُحذف المحاولة الجارية غير المكتملة. هل أنت متأكد؟"))return;
      store.session=newSession(d.mode);runStart=Date.now();banner="";resumed=false;view="main";save();render(true);return;}
    case "continue":view="main";resumed=true;render(true);return;
    case "home":pauseTimer();view="start";render(true);return;
    case "go":s.idx=Number(d.i);save();render(true);return;
    case "next":if(s.idx<ITEMS.length-1){s.idx++;save();render(true);}return;
    case "prev":if(s.idx>0){s.idx--;save();render(true);}return;
    case "pause":if(s.timer.run)pauseTimer();else{resumeTimer();autoPaused=false;}render();return;
    case "dismiss":banner="";showBanner();return;
    case "pick":{const q=BY[d.q];if(s.mode==="practice"&&s.shown[q.id])return;s.ans[q.id]=Number(d.v);if(s.mode==="practice"&&q.kind==="mcq")s.shown[q.id]=true;save();render();return;}
    case "row":{const q=BY[d.q];if(s.mode==="practice"&&s.shown[q.id])return;const a=Array.isArray(s.ans[q.id])?s.ans[q.id]:q.rows.map(()=>null);
      a[Number(d.r)]=q.kind==="tf"?d.v==="1":Number(d.v);s.ans[q.id]=a;save();render();return;}
    case "check":{const q=BY[d.q];if(!answered(s,q)){alert("أكمل جميع الاختيارات أولًا.");return;}s.shown[q.id]=true;save();render();return;}
    case "reveal":{const q=BY[d.q];s.shown[q.id]=true;save();render();return;}
    case "score":{const q=BY[d.q];s.self[q.id]=Number(d.v);save();render();return;}
    case "wtopic":{if(s.wt&&s.wt!==d.t&&(s.ans.w||"").trim()&&!confirm("تغيير الموضوع لا يحذف ما كتبته، لكن تقييمك الذاتي سيُعاد. متابعة؟"))return;s.wt=d.t;if(s.self.w&&s.self.w.t!==d.t)delete s.self.w;save();render();return;}
    case "crit":{const t=writeTopic(s);if(!t)return;const v=(s.self.w&&s.self.w.t===t.id)?s.self.w:{t:t.id,c:t.crit.map(()=>null)};v.c[Number(d.c)]=Number(d.v);s.self.w=v;save();render();return;}
    case "submit":{const un=ITEMS.filter(q=>!answered(s,q)).length;
      if(!confirm((un?"لم تُجب بعد عن "+un+" بندًا. ":"")+"هل تريد تسليم الاختبار والانتقال إلى التصحيح؟"))return;
      pauseTimer();s.phase="mark";s.markIdx=0;banner="";save();render(true);return;}
    case "mgo":s.markIdx=Number(d.i);save();render(true);return;
    case "finish":{const un=openItems(s).filter(q=>!isScored(s,q)).length;
      if(un&&!confirm("لم تقيّم "+un+" بندًا؛ ستُحسب درجتها صفرًا. هل تريد عرض النتيجة؟"))return;
      pauseTimer();s.phase="result";record(s);save();render(true);return;}
    case "practiceFinish":{if(!confirm("إنهاء التدريب وعرض النتيجة؟"))return;pauseTimer();
      const un=openItems(s).filter(q=>!isScored(s,q));if(un.length){s.phase="mark";s.markIdx=0;}else{s.phase="result";record(s);}save();render(true);return;}
    case "clearhist":if(!confirm("سيُحذف سجل المحاولات كله. هل أنت متأكد؟"))return;store.history=[];save();render();return;
  }
}
function record(s){if(s.recorded)return;s.recorded=true;const t=totals(s);
  store.history.unshift({d:new Date().toISOString(),mode:s.mode,total:t.total,auto:t.auto,self:t.self,secs:t.rows.map(r=>r.total),el:Math.round(s.timer.el)});
  store.history=store.history.slice(0,50);}

// ---------- render helpers ----------
function passageHTML(t,open){
  let b;
  if(t.verses)b=t.verses.map((v,i)=>`<div class="verse"><span><span class="n">${i+1}</span>${esc(v[0])}</span><span class="h2">${esc(v[1])}</span></div>`).join("");
  else b=`<div class="prose">${t.paras.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`;
  return `<details${open?" open":""} id="passage"><summary>📜 ${esc(t.label)}: «${esc(t.title)}» — ${esc(t.author)}</summary><div class="pbody">${b}
   <div class="rubric">${esc(t.gloss)}</div><div class="src">المصدر: ${esc(t.cite)}<br><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.url)}</a></div></div></details>`;}
function scoreBtns(q,cur,act_="score",extra=""){
  return `<div class="seg" role="group" aria-label="الدرجة">${steps(q.max,q.step||0.5).map(v=>`<button class="btn${cur===v?" on":""}" data-act="${act_}" data-q="${q.id}" data-v="${v}"${extra}>${fmt(v)}</button>`).join("")}</div>`;}
function normAr(s){return s.replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[^\u0621-\u064A\s]/g," ").split(/\s+/).filter(Boolean);}
function memoHint(q,txt){const have=new Set(normAr(txt||""));
  return `<div class="rubric" id="memohint"><b>مساعدة تقريبية للتصحيح</b> (تطابق الكلمات بعد حذف التشكيل؛ القرار لك وفق سُلّم التصحيح):<ul>${q.model.map((v,i)=>{const w=normAr(v[0]+" "+v[1]);const ok=w.filter(x=>have.has(x)).length;return `<li>البيت ${q.given_no+i+1}: ${ok}/${w.length} كلمة</li>`;}).join("")}</ul></div>`;}
function modelHTML(q,s){
  if(q.kind==="memo")return `<div class="model" id="model"><div class="t">النص الصحيح (كتاب الطالب ${esc(q.pages)}):</div>${q.model.map((v,i)=>`<div class="verse"><span><span class="n">${q.given_no+i+1}</span>${esc(v[0])}</span><span class="h2">${esc(v[1])}</span></div>`).join("")}</div>
     ${memoHint(q,s.ans[q.id])}<div class="rubric"><b>سُلّم التصحيح (من مفتاح الوزارة):</b><ul>${q.rubric.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`;
  return `<div class="model" id="model"><div class="t">الإجابة النموذجية:</div><div>${esc(q.model)}</div></div><div class="rubric"><b>توزيع الدرجة:</b> ${esc(q.rubric)}${q.pages&&q.pages!=="—"?` · <span class="meta">المرجع: ${esc(q.pages)}</span>`:""}</div>`;}
function writeMarkHTML(q,s){const t=writeTopic(s);if(!t)return `<div class="warnbox">لم تختر موضوعًا للكتابة؛ درجة هذا السؤال صفر.</div>`;
  const v=(s.self.w&&s.self.w.t===t.id)?s.self.w:{c:[]};
  return `<div class="rubric"><b>سُلّم تصحيح «${esc(t.title)}» (من مفتاح الوزارة):</b> ${esc(q.note)}</div>`+t.crit.map((c,i)=>`<div class="rowq"><div class="t">${esc(c[0])} (${fmt(c[1])}) — <span class="meta">${esc(c[2])}</span></div>${
     c[1]>2?`<select data-crit="${i}" aria-label="${esc(c[0])}"><option value="">— اختر الدرجة —</option>${steps(c[1],0.5).map(x=>`<option value="${x}"${v.c[i]===x?" selected":""}>${fmt(x)}</option>`).join("")}</select>`
     :`<div class="seg">${steps(c[1],0.5).map(x=>`<button class="btn${v.c[i]===x?" on":""}" data-act="crit" data-c="${i}" data-v="${x}">${fmt(x)}</button>`).join("")}</div>`}</div>`).join("")
     +`<div class="meta" id="wsum">مجموعك الذاتي: ${fmt(itemScore(s,q))} من 10</div>`;}

function objHTML(q,s,reveal){const a=s.ans[q.id];
  if(q.kind==="mcq")return `<div role="group" aria-label="الخيارات">${q.options.map((o,i)=>{let c="opt";
     if(reveal){c+=i===q.answer?" correct":i===a?" wrong":" dim";}else if(i===a)c+=" sel";
     return `<button class="${c}" data-act="pick" data-q="${q.id}" data-v="${i}"${reveal?" disabled":""}><span class="k">${LETTERS[i]}</span><span>${esc(o)}${reveal&&i===q.answer?" ✓":reveal&&i===a?" ✗":""}</span></button>`;}).join("")}</div>`;
  const arr=Array.isArray(a)?a:[];
  return q.rows.map((r,ri)=>{const v=arr[ri];const ok=reveal?(v===r[1]?" ok":" bad"):"";
    const opts=q.kind==="tf"?[["1","صح",true],["0","خطأ",false]]:q.cats.map((c,ci)=>[String(ci),c,ci]);
    return `<div class="rowq${ok}" data-row="${ri}"><div class="t">${ri+1}) ${esc(r[0])}${reveal?(v===r[1]?" ✓":" ✗ — الصواب: "+esc(q.kind==="tf"?(r[1]?"صح":"خطأ"):q.cats[r[1]])):""}</div><div class="seg">${opts.map(([val,lab,real])=>`<button class="btn${v===real?" on":""}" data-act="row" data-q="${q.id}" data-r="${ri}" data-v="${val}"${reveal?" disabled":""}>${esc(lab)}</button>`).join("")}</div></div>`;}).join("");}
function fbHTML(q,s){const sc=objScore(q,s.ans[q.id]);const full=sc===q.max;
  return `<div class="fb ${full?"ok":"bad"}" id="feedback" role="status"><div class="t">${full?"✓ إجابة صحيحة":"✗ درجتك "+fmt(sc)+" من "+q.max+(q.kind==="mcq"?" — الصواب: "+esc(q.options[q.answer]):"")}</div><div>${esc(q.explain)}</div><div class="meta">المرجع: كتاب الطالب ${esc(q.pages)}</div></div>`;}

function headHTML(){return `<header><h1>اختبار تجريبي تفاعلي (1) — اللغة العربية</h1><p>الصف الثاني عشر · المسار الأدبي · الفصل الدراسي الأول (كتاب 2026–2027، الوحدات 1–6) · على نمط الاختبار التجريبي للوزارة 2022–2023</p></header>`;}
function topbar(s){const e=elapsed();
  return `<div class="topbar"><span id="timer" class="timer${s.timer.run?"":" paused"}${DUR-e<=300?" low":""}" aria-label="الوقت المتبقي">${clock(DUR-e)}</span>
   ${s.phase==="exam"?`<button class="btn" id="pauseBtn" data-act="pause">${s.timer.run?"⏸ إيقاف مؤقت":"▶ استئناف"}</button>`:`<span class="chip">انتهى الوقت المحتسب</span>`}
   <span class="grow"></span><span class="chip">${s.mode==="exam"?"وضع الاختبار":"وضع التدريب"}</span><button class="btn" data-act="home">الرئيسية</button></div><div id="tbanner"></div>`;}

function render(scrollTop){
  const app=document.getElementById("app");let h=headHTML();const s=store.session;
  if(!storageOK)h+=`<div class="warnbox" id="nostore">تعذّر الحفظ في هذا المتصفح (ربما وضع التصفح الخاص)، لذا لن يُستأنف التقدّم ولا يُحفظ السجل بعد إعادة التحميل.</div>`;
  if(view==="start"||!s)h+=startHTML(s);
  else if(s.phase==="exam")h+=examHTML(s);
  else if(s.phase==="mark")h+=markHTML(s);
  else h+=resultHTML(s);
  h+=`<footer>يعمل دون اتصال بالإنترنت · تُحفظ البيانات في هذا المتصفح فقط ولا تُرسل إلى أي مكان</footer>`;
  app.innerHTML=h;showBanner();
  const nm=document.getElementById("name");if(nm)nm.addEventListener("input",()=>{store.name=nm.value.slice(0,60);save();});
  app.querySelectorAll("textarea[data-q]").forEach(ta=>{ta.addEventListener("input",()=>{store.session.ans[ta.dataset.q]=ta.value;
    const wc=document.getElementById("wc");if(wc&&ta.dataset.q==="w")wc.textContent=countWords(ta.value);saveSoon();});});
  app.querySelectorAll("select[data-crit]").forEach(se=>se.addEventListener("change",()=>{if(se.value==="")return;act("crit",{dataset:{c:se.dataset.crit,v:se.value}});}));
  if(scrollTop)window.scrollTo(0,0);
}
let saveT=null;function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,400);}
function countWords(t){return (t.trim().match(/\S+/g)||[]).length+" كلمة";}

function startHTML(s){let h="";
  if(autoPaused){h+=`<div class="notice">أُوقف المؤقت تلقائيًا عند مغادرة الصفحة.</div>`;}
  h+=`<section class="card"><h3>تعليمات الاختبار</h3>
   <ul><li>زمن الاختبار: <b>ساعتان في جلسة واحدة</b> (مؤقت قابل للإيقاف المؤقت، مع تنبيه عند منتصف الوقت وقبل النهاية بـ15 و5 دقائق).</li>
   <li>عدد الأسئلة: <b>10 أسئلة</b> · الدرجة الكلية: <b>40</b>.</li>
   <li>البنود الموضوعية (اختيار من متعدد، صواب وخطأ، توصيل، اختيار الإعراب) تُصحَّح تلقائيًا.</li>
   <li>البنود المقالية: اكتب إجابتك، ثم اعرض الإجابة النموذجية وسُلّم التصحيح، وقيّم نفسك بأمانة.</li></ul>
   <table><thead><tr><th>القسم</th><th>الأسئلة</th><th class="num">الدرجة</th></tr></thead><tbody>${SECS.map(x=>`<tr><td>${esc(x.title)}<div class="meta">${esc(x.how)}</div></td><td>${esc(x.qs)}</td><td class="num">${x.max}</td></tr>`).join("")}<tr><td><b>المجموع</b></td><td>10 أسئلة</td><td class="num"><b>40</b></td></tr></tbody></table>
   <div class="field" style="margin-top:12px"><label for="name">الاسم (اختياري — يُحفظ على هذا الجهاز فقط)</label><input id="name" maxlength="60" autocomplete="off" placeholder="اكتب اسمك إن أردت" value="${esc(store.name)}"></div>`;
  if(s&&s.phase!=="result"){h+=`<div class="notice" id="resumebox">لديك محاولة غير مكتملة (${s.mode==="exam"?"وضع الاختبار":"وضع التدريب"}) — ${s.phase==="mark"?"مرحلة التصحيح الذاتي":"البند "+(s.idx+1)+" من "+ITEMS.length}، الوقت المستغرق ${clock(s.timer.el)}.</div>
     <div class="row"><button class="btn primary" data-act="continue" id="continueBtn">متابعة المحاولة</button></div>`;}
  h+=`<div class="row"><button class="btn${s&&s.phase!=="result"?"":" primary"}" data-act="start" data-mode="exam" id="startExam">ابدأ: وضع الاختبار (التصحيح في النهاية)</button>
      <button class="btn" data-act="start" data-mode="practice" id="startPractice">ابدأ: وضع التدريب (تصحيح فوري)</button></div>
   ${s&&s.phase==="result"?`<div class="row"><button class="btn" data-act="continue">عرض نتيجة آخر محاولة</button></div>`:""}</section>`;
  h+=`<section class="card"><h3>نصوص القراءة (غير مقرّرة، من الملكية العامة)</h3>${DATA.texts.map(t=>`<div class="src"><b>${esc(t.label)}:</b> ${esc(t.cite)} <a href="${esc(t.url)}" target="_blank" rel="noopener">الرابط</a></div>`).join("")}</section>`;
  h+=historyHTML();return h;}

function historyHTML(){let h=`<section class="card" id="history"><h3>سجل المحاولات</h3>`;
  if(store.history.length){h+=`<div style="overflow-x:auto"><table id="histtable"><thead><tr><th>التاريخ</th><th>الوضع</th><th class="num">المجموع /40</th><th class="num">تلقائي</th><th class="num">ذاتي</th><th class="num">الوقت</th></tr></thead><tbody>${store.history.map(x=>`<tr><td>${esc(fmtDate(x.d))}</td><td>${x.mode==="exam"?"اختبار":"تدريب"}</td><td class="num"><b>${fmt(x.total)}</b></td><td class="num">${fmt(x.auto)}</td><td class="num">${fmt(x.self)}</td><td class="num">${clock(x.el||0)}</td></tr>`).join("")}</tbody></table></div><div class="row"><button class="btn danger" data-act="clearhist" id="clearhist">مسح السجل</button></div>`;}
  else h+=`<p class="meta">لا توجد محاولات مكتملة بعد.</p>`;
  return h+`</section>`;}

function examHTML(s){const q=ITEMS[s.idx];const sec=SECS.find(x=>x.id===q.sec);
  const nAns=ITEMS.filter(x=>answered(s,x)).length;
  let h=topbar(s);
  if(resumed){h+=`<div class="notice" id="resumed">تم استئناف محاولتك — البند ${s.idx+1} من ${ITEMS.length}. ${s.timer.run?"":"المؤقت متوقف؛ اضغط «استئناف» للمتابعة."}</div>`;resumed=false;}
  if(!s.timer.run)h+=`<div class="notice" id="pausedNote">⏸ المؤقت متوقف مؤقتًا.</div>`;
  h+=`<div class="progress"><i style="width:${Math.round(nAns/ITEMS.length*100)}%"></i></div><div class="meta" id="prog">أُجيب عن ${nAns} من ${ITEMS.length} بندًا</div>`;
  h+=`<details id="map"><summary>🗺️ خريطة الأسئلة</summary><div class="grid">${ITEMS.map((x,i)=>`<button class="btn${answered(s,x)?" done":""}${i===s.idx?" cur":""}" data-act="go" data-i="${i}" aria-label="البند ${i+1}">${i+1}</button>`).join("")}</div></details>`;
  h+=`<section class="card" id="main" data-qid="${q.id}"><div class="qhead"><h2>${esc(q.no)}${q.group&&TEXTS[q.group]?" — "+esc(TEXTS[q.group].label):""}</h2><span class="chip">${esc(sec.title)} · ${fmt(q.max)} ${q.max<=2?"درجة":"درجات"}</span></div>
     <div class="meta">البند ${s.idx+1} من ${ITEMS.length}</div>`;
  if(q.group&&TEXTS[q.group])h+=passageHTML(TEXTS[q.group],q.id.endsWith("_7"));
  const prac=s.mode==="practice";
  if(OBJ[q.kind]){const rev=prac&&s.shown[q.id];
    h+=`<div class="qtext">${esc(q.prompt)}</div>`+objHTML(q,s,rev);
    if(prac&&!rev&&q.kind!=="mcq")h+=`<div class="row"><button class="btn primary" data-act="check" data-q="${q.id}" id="checkBtn">تحقّق</button></div>`;
    if(rev)h+=fbHTML(q,s);}
  else if(q.kind==="memo"){
    h+=`<div class="qtext">${esc(q.prompt)}</div><div class="quote"><div class="verse"><span><span class="n">${q.given_no}</span>${esc(q.given[0])}</span><span class="h2">${esc(q.given[1])}</span></div></div>
      <label for="ta-${q.id}" style="margin-top:10px">اكتب الأبيات الأربعة (كل بيت في سطر):</label><textarea id="ta-${q.id}" data-q="${q.id}" rows="6">${esc(s.ans[q.id]||"")}</textarea>`;
    h+=practiceOpen(q,s);}
  else if(q.kind==="open"){
    h+=`<div class="qtext">${esc(q.prompt)}</div><label for="ta-${q.id}">إجابتك:</label><textarea id="ta-${q.id}" data-q="${q.id}" rows="4">${esc(s.ans[q.id]||"")}</textarea>`;
    h+=practiceOpen(q,s);}
  else if(q.kind==="write"){
    h+=`<div class="qtext">${esc(q.prompt)}</div><div class="meta">${esc(q.note)}</div>${q.topics.map((t,i)=>`<button class="opt${s.wt===t.id?" sel":""}" data-act="wtopic" data-t="${t.id}"><span class="k">${LETTERS[i]}</span><span><b>${esc(t.title)}:</b> ${esc(t.task)}</span></button>`).join("")}`;
    if(s.wt){h+=`<label for="ta-w" style="margin-top:10px">موضوعك (${esc(writeTopic(s).title)}):</label><textarea class="long" id="ta-w" data-q="w">${esc(s.ans.w||"")}</textarea><div class="meta" id="wc">${countWords(s.ans.w||"")}</div>`;
      if(prac){h+=s.shown.w?writeMarkHTML(q,s):`<div class="row"><button class="btn" data-act="reveal" data-q="w" id="revealBtn">أظهر سُلّم التصحيح وقيّم نفسك</button></div>`;}}
    else h+=`<p class="meta">اختر موضوعًا لتظهر مساحة الكتابة.</p>`;}
  h+=`<div class="row"><button class="btn primary" data-act="next" id="next"${s.idx===ITEMS.length-1?" disabled":""}>التالي</button><button class="btn" data-act="prev" id="prev"${s.idx===0?" disabled":""}>السابق</button></div></section>`;
  h+=`<div class="row"><button class="btn${s.idx===ITEMS.length-1?" primary":""}" data-act="${prac?"practiceFinish":"submit"}" id="submitBtn">${prac?"إنهاء التدريب وعرض النتيجة":"تسليم الاختبار والانتقال إلى التصحيح"}</button></div>`;
  return h;}
function practiceOpen(q,s){if(s.mode!=="practice")return "";
  if(!s.shown[q.id])return `<div class="row"><button class="btn" data-act="reveal" data-q="${q.id}" id="revealBtn">أظهر الإجابة النموذجية</button></div>`;
  return modelHTML(q,s)+`<div class="qtext" style="font-size:.95rem">قيّم إجابتك (من ${fmt(q.max)}):</div>`+scoreBtns(q,s.self[q.id]);}

function markHTML(s){const list=openItems(s);if(s.markIdx>=list.length)s.markIdx=list.length-1;const q=list[s.markIdx];
  const done=list.filter(x=>isScored(s,x)).length;
  let h=topbar(s)+`<div class="notice" id="markNote">مرحلة التصحيح الذاتي: قارن إجابتك بالإجابة النموذجية وسُلّم التصحيح، ثم اختر درجتك. (قُيِّم ${done} من ${list.length})</div>`;
  h+=`<div class="progress"><i style="width:${Math.round(done/list.length*100)}%"></i></div>`;
  h+=`<details id="map"><summary>🗺️ بنود التصحيح</summary><div class="grid">${list.map((x,i)=>`<button class="btn${isScored(s,x)?" done":""}${i===s.markIdx?" cur":""}" data-act="mgo" data-i="${i}">${i+1}</button>`).join("")}</div></details>`;
  h+=`<section class="card" id="main" data-qid="${q.id}"><div class="qhead"><h2>${esc(qLabel(q))}</h2><span class="chip">${fmt(q.max)} ${q.max<=2?"درجة":"درجات"}</span></div><div class="meta">بند التصحيح ${s.markIdx+1} من ${list.length}</div>`;
  if(q.group&&TEXTS[q.group])h+=passageHTML(TEXTS[q.group],false);
  if(q.kind==="write"){const t=writeTopic(s);h+=`<div class="qtext">${t?esc(t.title)+": "+esc(t.task):"لم يُختر موضوع"}</div><div class="meta">إجابتك:</div><div class="mine" id="mine">${esc(s.ans.w||"— لا توجد إجابة —")}</div>`+writeMarkHTML(q,s);}
  else{h+=`<div class="qtext">${esc(q.prompt)}</div>${q.kind==="memo"?`<div class="quote"><div class="verse"><span>${esc(q.given[0])}</span><span class="h2">${esc(q.given[1])}</span></div></div>`:""}<div class="meta">إجابتك:</div><div class="mine" id="mine">${esc(s.ans[q.id]||"— لا توجد إجابة —")}</div>`+modelHTML(q,s)+`<div class="qtext" style="font-size:.95rem">درجتك (من ${fmt(q.max)}):</div>`+scoreBtns(q,s.self[q.id]);}
  h+=`<div class="row"><button class="btn primary" data-act="mgo" data-i="${s.markIdx+1}" id="mnext"${s.markIdx>=list.length-1?" disabled":""}>التالي</button><button class="btn" data-act="mgo" data-i="${s.markIdx-1}" id="mprev"${s.markIdx===0?" disabled":""}>السابق</button></div></section>`;
  h+=`<div class="row"><button class="btn${done===list.length?" primary":""}" data-act="finish" id="finishBtn">عرض النتيجة النهائية</button></div>`;
  return h;}

function resultHTML(s){const t=totals(s);const nm=store.name.trim();const w=weakAreas(s);
  let h=`<div class="topbar"><span class="chip">${s.mode==="exam"?"وضع الاختبار":"وضع التدريب"}</span><span class="grow"></span><button class="btn" data-act="home">الرئيسية</button></div>`;
  h+=`<section class="card" id="main"><h3>النتيجة النهائية</h3><div class="final" id="final">${nm?esc(nm)+"، ":""}مجموعك: <span class="big" id="tot">${fmt(t.total)}</span> من 40</div>
   <div class="meta">تلقائي: <b id="autoTot">${fmt(t.auto)}</b> · تقييم ذاتي: <b id="selfTot">${fmt(t.self)}</b> · الوقت المستغرق: <b id="elapsedT">${clock(s.timer.el)}</b>${s.timer.el>DUR?" (تجاوز الزمن الرسمي)":""}</div>
   <div style="overflow-x:auto"><table id="sectable"><thead><tr><th>القسم</th><th class="num">تلقائي</th><th class="num">ذاتي</th><th class="num">المجموع</th><th class="num">من</th></tr></thead><tbody>${t.rows.map(r=>`<tr data-sec="${r.id}"><td>${esc(r.title)}</td><td class="num">${fmt(r.auto)}</td><td class="num">${fmt(r.self)}</td><td class="num"><b>${fmt(r.total)}</b></td><td class="num">${r.max}</td></tr>`).join("")}<tr><td><b>المجموع</b></td><td class="num">${fmt(t.auto)}</td><td class="num">${fmt(t.self)}</td><td class="num"><b>${fmt(t.total)}</b></td><td class="num">40</td></tr></tbody></table></div>
   <p class="meta">درجة القراءة = متوسط النصوص الثلاثة، ودرجة الحفظ = متوسط القصائد الثلاث، كما في مفتاح الاختبار التجريبي للوزارة. الدرجة الذاتية تقديرية؛ اعرض كتابتك على معلمك للتأكد.</p></section>`;
  h+=`<section class="card" id="weak"><h3>مواطن تحتاج إلى مراجعة</h3>${w.length?w.map(x=>`<div class="weak"><b>${esc(x.topic)}</b> — ${fmt(x.got)} من ${fmt(x.max)}<div class="meta">راجع: كتاب الطالب ${esc(x.pages)} · ${esc(x.qs.join("، "))}</div></div>`).join(""):`<div class="notice">ممتاز! لم يقلّ أداؤك عن 75٪ في أي بند.</div>`}</section>`;
  h+=`<section class="card" id="review"><h3>مراجعة البنود الموضوعية</h3>${ITEMS.filter(q=>OBJ[q.kind]).map(q=>`<details><summary>${esc(qLabel(q))} — ${fmt(objScore(q,s.ans[q.id]))}/${q.max}</summary><div class="pbody"><div class="qtext">${esc(q.prompt)}</div>${objHTML(q,s,true)}${fbHTML(q,s)}</div></details>`).join("")}</section>`;
  h+=`<div class="row"><button class="btn primary" data-act="start" data-mode="exam">محاولة جديدة (اختبار)</button><button class="btn" data-act="start" data-mode="practice">محاولة جديدة (تدريب)</button></div>`;
  return h+historyHTML();}

document.getElementById("app").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;act(b.dataset.act,b);});
if(store.session&&store.session.phase==="exam"&&store.session.timer.run){store.session.timer.run=false;}
render();
</script>
</body>
</html>
