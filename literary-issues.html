    if(mode==="p"&&!reveal)h+='<button class="btn-s btn-w" data-act="show">أظهر الإجابة النموذجية</button>';
    if(reveal){
      h+='<div class="fb info model"><b>الإجابة النموذجية</b> '+pgs(q.p)+'<ul>'+q.model.map(function(m){return '<li>'+m+'</li>';}).join('')+'</ul></div>';
      h+='<div class="self"><div class="small">قارن إجابتك بالنموذج ثم قدّر درجتك بأمانة:</div><div class="row">';
      for(var m=0;m<=q.marks;m++){h+='<button data-act="self" data-v="'+m+'" class="'+(a&&a.self===m?'on':'')+'">'+m+(m===q.marks?' ✓':'')+'</button>';}
      h+='</div></div>';
    }
  }
  return h+'</div>';
}
function refreshCard(qid,mode){
  var el=document.getElementById("c-"+qid);if(!el)return;
  var list=mode==="f"?D.final:SEC[el.closest("[data-sec]").getAttribute("data-sec")].qs;
  var i=list.findIndex(function(q){return q.id===qid;});
  el.outerHTML=qCard(QI[qid],i,mode);updateScore();
}

/* ---------- views ---------- */
var app=document.getElementById("app");
function home(){
  var h='<div class="card hero"><h2>القضايا الأدبية – الفصل الأول</h2><p>اللغة العربية • الصف الثاني عشر • مسار الآداب والإنسانيات • كتاب 2026–2027</p><p class="small" style="color:#eee">كل قضية: شرح مبسّط من الكتاب ← تمارين فورية التصحيح ← ثم اختبار شامل.</p>';
  var all=[];D.sections.forEach(function(s){all=all.concat(s.qs);});var t=stats(all,"p");
  h+='<div>تقدّمك في التمارين: '+t.done+' / '+t.n+'</div>'+bar(pct(t.done,t.n))+'</div>';
  D.sections.forEach(function(s){
    var r=stats(s.qs,"p");
    h+='<div class="card icard"><div class="unit">'+s.unit+' • ص '+s.pages+'</div><h3>'+s.icon+' '+s.title+'</h3><div class="sub">'+s.sub+'</div>'+bar(pct(r.done,r.n));
    h+='<div class="small">أُجيب '+r.done+' من '+r.n+(r.max?(' • الدرجة '+fmt(r.got)+' / '+fmt(r.max)+' ('+pct(r.got,r.max)+'%)'):'')+'</div>';
    h+='<div class="row" style="margin-top:6px"><button class="btn-s" data-act="go" data-to="#/'+s.id+'/learn">📖 الشرح</button><button class="btn-p" data-act="go" data-to="#/'+s.id+'/ex">✍️ التمارين ('+r.n+')</button></div></div>';
  });
  var f=stats(D.final,"f");
  h+='<div class="card icard"><div class="unit">جميع القضايا</div><h3>🎯 الاختبار الشامل ('+D.final.length+' سؤالًا)</h3><div class="sub">أسئلة مختلطة من القضايا الأربع بأسلوب الوزارة، والتصحيح بعد الإنهاء مع نتيجة لكل قضية.</div>'+(S.fdone?'<div class="small">نتيجتك: '+fmt(f.got)+' / '+fmt(f.tot)+'</div>':'')+'<button class="btn-p btn-w" data-act="go" data-to="#/final">'+(S.fdone?'عرض النتيجة':'ابدأ الاختبار')+'</button></div>';
  h+='<div class="card"><button class="btn-s btn-w" data-act="go" data-to="#/progress">📊 ملخّص التقدّم والدرجات</button></div>';
  h+='<div class="card note"><b>ℹ️ ماذا عن الوحدتين الثالثة والخامسة؟</b><p class="small" style="color:#333">حسب فهرس كتاب الفصل الأول 2026–2027 (ص8–9) لا يوجد درس «قضية أدبية» في الوحدة الثالثة (النبوغ، ثورة الفرص، المصدر المؤول، التقرير الإداري) ولا في الخامسة (عرفت طريقي للنجاح – أدب ذاتي، صدى الحياة، أدوات الشرط غير الجازمة). القضايا المقررة أربع فقط وهي الموجودة هنا. لكن انتبه: الشابي صاحب «صدى الحياة» من أعضاء <b>جماعة أبولو</b> (ص138) ونشر في مجلتها (ص177)، فيمكن تطبيق خصائص الرومانسية على قصيدته.</p></div>';
  h+='<div class="card exam box"><div class="bt-title">📝 القضايا الأدبية في امتحان الوزارة</div><div class="small" style="color:#333">في نماذج الوزارة للفصل الأول تأتي القضايا الأدبية ضمن قسم «الحفظ والقضايا الأدبية» (حوالي 6 درجات مع الحفظ)، وأسئلتها قصيرة: «اذكر اثنتين من الخصائص…» أو «اذكر سببين…» (درجة لكل نقطة)، أو تطبيق على أبيات. المطلوب: النقاط كما وردت في الكتاب.</div></div>';
  return h;
}
function lessonView(s){
  var h=tabs(s,"learn")+'<div class="card lesson" data-sec="'+s.id+'"><div class="unit">'+s.unit+' • القضية الأدبية • ص '+s.pages+'</div><h2 style="margin:0;color:var(--pr)">'+s.icon+' '+s.title+'</h2>'+s.lesson+'</div>';
  h+='<button class="btn-p btn-w" data-act="go" data-to="#/'+s.id+'/ex">انتقل إلى التمارين ✍️</button>';
  return h;
}
function tabs(s,cur){return '<div class="tabs"><button data-act="go" data-to="#/'+s.id+'/learn" class="'+(cur==="learn"?"on":"")+'">📖 الشرح</button><button data-act="go" data-to="#/'+s.id+'/ex" class="'+(cur==="ex"?"on":"")+'">✍️ التمارين</button></div>';}
function exView(s){
  var h=tabs(s,"ex")+'<div class="card sticky-score"><div class="scorebox"><div><div class="unit">'+s.unit+'</div><b>'+s.title+'</b></div><div style="margin-inline-start:auto;text-align:left"><span class="big" id="sc">0</span><div class="small" id="scd"></div></div></div><div id="scb">'+bar(0)+'</div></div>';
  h+='<div data-sec="'+s.id+'">'+s.qs.map(function(q,i){return qCard(q,i,"p");}).join('')+'</div>';
  h+='<div class="card" id="donebox"></div>';
  h+='<div class="row"><button class="btn-g" data-act="reset" data-sec="'+s.id+'">↺ إعادة تمارين هذه القضية</button><button class="btn-s" data-act="go" data-to="#/'+s.id+'/learn">📖 راجع الشرح</button></div>';
  return h;
}
function finalView(){
  var h='<div class="card hero"><h2>🎯 الاختبار الشامل</h2><p>'+D.final.length+' سؤالًا من القضايا الأربع. أجب عن الكل ثم اضغط «إنهاء وتصحيح». الأسئلة المقالية تقدّر درجتها بنفسك بعد ظهور النموذج.</p></div>';
  h+='<div class="card sticky-score"><div class="scorebox"><b>'+(S.fdone?'النتيجة':'أُجيب')+'</b><div style="margin-inline-start:auto;text-align:left"><span class="big" id="sc">0</span><div class="small" id="scd"></div></div></div><div id="scb">'+bar(0)+'</div></div>';
  if(S.fdone)h+='<div class="card" id="fres"></div>';
  h+='<div data-sec="final">'+D.final.map(function(q,i){return qCard(q,i,"f");}).join('')+'</div>';
  if(!S.fdone)h+='<button class="btn-p btn-w" data-act="fsubmit">✅ إنهاء وتصحيح</button>';
  else h+='<button class="btn-g btn-w" data-act="freset">↺ إعادة الاختبار من جديد</button>';
  return h;
}
function issueNames(){var m={};D.sections.forEach(function(s){m[s.id]=s.title;});return m;}
function finalByIssue(){
  var r={};D.sections.forEach(function(s){r[s.id]={got:0,tot:0,pend:0};});
  D.final.forEach(function(q){var a=S.f[q.id];r[q.iss].tot+=maxOf(q);if(q.t==="open"&&!(a&&typeof a.self==="number"))r[q.iss].pend++;else r[q.iss].got+=scoreOf(q,a);});
  return r;
}
function progressView(){
  var h='<div class="card hero"><h2>📊 ملخّص التقدّم</h2><p>درجاتك في تمارين كل قضية وفي الاختبار الشامل (محفوظة على هذا الجهاز).</p></div>';
  h+='<div class="card"><b>التمارين</b><div class="tw"><table class="res"><thead><tr><th>القضية</th><th>أُجيب</th><th>الدرجة</th><th>%</th></tr></thead><tbody>';
  var weak=null;
  D.sections.forEach(function(s){var r=stats(s.qs,"p");var p=pct(r.got,r.max);h+='<tr><td style="text-align:right"><a href="#/'+s.id+'/ex">'+s.title+'</a></td><td>'+r.done+'/'+r.n+'</td><td>'+fmt(r.got)+'/'+fmt(r.max)+'</td><td>'+(r.max?p+'%':'—')+'</td></tr>';if(r.max&&(weak===null||p<weak.p))weak={p:p,s:s};});
  h+='</tbody></table></div>';
  if(weak&&weak.p<80)h+='<div class="fb bad">أضعف قضية حاليًا: <b>'+weak.s.title+'</b> ('+weak.p+'%). راجع شرحها ثم أعد تمارينها.</div>';
  h+='</div>';
  h+='<div class="card"><b>الاختبار الشامل</b>';
  if(!S.fdone)h+='<p class="small">لم تُنهِ الاختبار الشامل بعد.</p><button class="btn-p btn-w" data-act="go" data-to="#/final">ابدأ / أكمل الاختبار</button>';
  else{var fb=finalByIssue();var nm=issueNames();h+='<div class="tw"><table class="res"><thead><tr><th>القضية</th><th>الدرجة</th><th>%</th></tr></thead><tbody>';
    Object.keys(fb).forEach(function(k){h+='<tr><td style="text-align:right">'+nm[k]+'</td><td>'+fmt(fb[k].got)+'/'+fmt(fb[k].tot)+(fb[k].pend?' <span class="small">(+'+fb[k].pend+' بانتظار تقديرك)</span>':'')+'</td><td>'+pct(fb[k].got,fb[k].tot)+'%</td></tr>';});
    h+='</tbody></table></div>';}
  h+='</div><div class="card"><button class="btn-g btn-w" data-act="resetall">🗑️ مسح كل التقدّم والبدء من جديد</button></div>';
  return h;
}
function updateScore(){
  var sc=document.getElementById("sc");if(!sc)return;
  var secEl=document.querySelector("[data-sec]");var sid=secEl&&secEl.getAttribute("data-sec");
  if(sid==="final"){
    var r=stats(D.final,"f");
    if(!S.fdone){var n=0;D.final.forEach(function(q){var a=S.f[q.id];if(a&&(a.v!==undefined&&(q.t!=="match"||a.v.some(function(x){return x!==null&&x!==undefined;}))||(a.txt&&a.txt.trim())))n++;});sc.textContent=n+"/"+D.final.length;document.getElementById("scd").textContent="سؤالًا مُجابًا";document.getElementById("scb").innerHTML=bar(pct(n,D.final.length));}
    else{var tot=0,got=0,pend=0;D.final.forEach(function(q){var a=S.f[q.id];tot+=maxOf(q);if(q.t==="open"&&!(a&&typeof a.self==="number"))pend++;else got+=scoreOf(q,a);});
      sc.textContent=fmt(got)+"/"+fmt(tot);document.getElementById("scd").textContent=pct(got,tot)+"%"+(pend?(" • "+pend+" بانتظار تقديرك"):"");document.getElementById("scb").innerHTML=bar(pct(got,tot));
      var fr=document.getElementById("fres");if(fr){var fb=finalByIssue(),nm=issueNames(),h='<b>النتيجة حسب القضية</b><div class="tw"><table class="res"><thead><tr><th>القضية</th><th>الدرجة</th><th>%</th></tr></thead><tbody>';Object.keys(fb).forEach(function(k){h+='<tr><td style="text-align:right">'+nm[k]+'</td><td>'+fmt(fb[k].got)+'/'+fmt(fb[k].tot)+'</td><td>'+pct(fb[k].got,fb[k].tot)+'%</td></tr>';});fr.innerHTML=h+'</tbody></table></div>'+(pend?'<div class="hint">قدّر درجتك في الأسئلة المقالية بالأسفل لتكتمل النتيجة.</div>':'');}
    }
  } else if(sid&&SEC[sid]){
    var s=SEC[sid],r2=stats(s.qs,"p");
    sc.textContent=fmt(r2.got)+"/"+fmt(r2.max);document.getElementById("scd").textContent="أُجيب "+r2.done+" من "+r2.n+(r2.max?(" • "+pct(r2.got,r2.max)+"%"):"");
    document.getElementById("scb").innerHTML=bar(pct(r2.done,r2.n));
    var db=document.getElementById("donebox");
    if(db){if(r2.done===r2.n){var p=pct(r2.got,r2.max);db.innerHTML='<b>🎉 أنهيت تمارين «'+s.title+'»</b><p>درجتك: '+fmt(r2.got)+' من '+fmt(r2.max)+' ('+p+'%). '+(p>=85?'ممتاز! انتقل إلى القضية التالية أو الاختبار الشامل.':p>=60?'جيد، راجع الأسئلة الحمراء ثم أعد التمارين.':'تحتاج مراجعة الشرح ثم إعادة التمارين.')+'</p>';db.style.display="";}else{db.innerHTML="";db.style.display="none";}}
  }
}
function render(){
  var hs=location.hash||"#/";var m=hs.match(/^#\/(u\d)\/(learn|ex)$/);var t="القضايا الأدبية – ث12 ف1";
  if(m&&SEC[m[1]]){var s=SEC[m[1]];app.innerHTML=m[2]==="learn"?lessonView(s):exView(s);t=s.title;}
  else if(hs==="#/final"){app.innerHTML=finalView();t="الاختبار الشامل";}
  else if(hs==="#/progress"){app.innerHTML=progressView();t="ملخّص التقدّم";}
  else{app.innerHTML=home();}
  document.getElementById("htitle").textContent=t;
  updateScore();window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b||b.tagName==="SELECT"||b.tagName==="TEXTAREA")return;
  var act=b.getAttribute("data-act");
  if(act==="go"){ev.preventDefault();var to=b.getAttribute("data-to");if(location.hash===to)render();else location.hash=to;return;}
  var card=b.closest("[data-qid]");
  if(card){
    var qid=card.getAttribute("data-qid"),mode=card.getAttribute("data-mode"),q=QI[qid],st=store(mode);var a=st[qid]||{};
    if(mode==="f"&&S.fdone&&act!=="self")return;
    if(act==="pick"){if(mode==="p"&&a.v!==undefined)return;var v=+b.getAttribute("data-v");a.v=q.t==="tf"?(v===1):v;}
    else if(act==="mcheck"){var vals=a.v||[];if(q.left.some(function(_,r){return vals[r]===undefined||vals[r]===null;})){alert("اختر إجابة لكل سطر أولًا.");return;}a.done=true;}
    else if(act==="show"){a.shown=true;}
    else if(act==="self"){a.self=+b.getAttribute("data-v");}
    else return;
    st[qid]=a;save();refreshCard(qid,mode);return;
  }
  if(act==="reset"){var sid=b.getAttribute("data-sec");if(!confirm("إعادة كل تمارين هذه القضية؟"))return;SEC[sid].qs.forEach(function(q){delete S.a[q.id];});save();render();return;}
  if(act==="fsubmit"){var un=D.final.filter(function(q){var a=S.f[q.id];return !(a&&(a.v!==undefined||(a.txt&&a.txt.trim())));}).length;if(un&&!confirm("بقي "+un+" سؤالًا بلا إجابة. هل تريد الإنهاء والتصحيح؟"))return;S.fdone=true;save();render();return;}
  if(act==="freset"){if(!confirm("مسح إجابات الاختبار الشامل والبدء من جديد؟"))return;S.f={};S.fdone=false;save();render();return;}
  if(act==="resetall"){if(!confirm("مسح كل التقدّم في التمارين والاختبار؟"))return;S={a:{},f:{},fdone:false,v:1};save();render();return;}
});
document.addEventListener("change",function(ev){
  var el=ev.target;if(el.getAttribute("data-act")!=="msel")return;
  var card=el.closest("[data-qid]"),qid=card.getAttribute("data-qid"),mode=card.getAttribute("data-mode"),st=store(mode),a=st[qid]||{};
  if((mode==="p"&&a.done)||(mode==="f"&&S.fdone))return;
  var q=QI[qid];if(!a.v)a.v=q.left.map(function(){return null;});
  a.v[+el.getAttribute("data-row")]=el.value===""?null:+el.value;st[qid]=a;save();updateScore();
});
document.addEventListener("input",function(ev){
  var el=ev.target;if(el.getAttribute("data-act")!=="txt")return;
  var card=el.closest("[data-qid]"),qid=card.getAttribute("data-qid"),mode=card.getAttribute("data-mode"),st=store(mode),a=st[qid]||{};
  if(mode==="f"&&S.fdone)return;a.txt=el.value;st[qid]=a;save();if(mode==="f")updateScore();
});
render();
</script>
</body>
</html>
