:root{--pr:#5b2a86;--pr2:#7b4bb0;--bg:#f6f3ee;--card:#fff;--ok:#2e7d32;--okbg:#e8f5e9;--bad:#c62828;--badbg:#ffebee;--sel:#1565c0;--selbg:#e3f2fd;--mut:#666;--gold:#b7791f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:#1f1f1f;font-family:"LitNaskh","Noto Naskh Arabic","Geeza Pro",serif;font-size:17px;line-height:1.85;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--pr);color:#fff;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
header h1{font-size:17px;margin:0;flex:1;line-height:1.4}
header button{background:rgba(255,255,255,.15);color:#fff;border:0}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px calc(env(safe-area-inset-bottom) + 70px)}
button,.btn{font:inherit;font-size:16px;min-height:44px;min-width:44px;border-radius:12px;border:2px solid transparent;padding:6px 14px;cursor:pointer;touch-action:manipulation}
.btn-p{background:var(--pr);color:#fff}.btn-s{background:#fff;color:var(--pr);border-color:var(--pr)}.btn-g{background:#eee;color:#333}
.btn-w{display:block;width:100%;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>button{flex:1 1 140px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.hero{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff}
.hero h2{margin:0 0 4px;font-size:21px}.hero p{margin:4px 0}
.unit{font-size:13px;color:var(--gold);font-weight:700}
.icard h3{margin:2px 0;font-size:19px;color:var(--pr)}
.sub{font-size:14px;color:var(--mut);line-height:1.6}
.bar{height:10px;background:#e7e1f0;border-radius:6px;overflow:hidden;margin:8px 0 4px}.bar>i{display:block;height:100%;background:var(--ok);border-radius:6px}
.small{font-size:14px;color:var(--mut)}
.pg{display:inline-block;font-size:12px;background:#f1e9fb;color:var(--pr);border-radius:8px;padding:0 7px;margin:0 2px;white-space:nowrap;font-weight:700;line-height:1.7}
.lesson h3{color:var(--pr);font-size:18px;margin:18px 0 6px;border-right:4px solid var(--gold);padding-right:8px}
.lesson p{margin:6px 0}.lesson ul,.lesson ol{margin:6px 0;padding-right:22px}.lesson li{margin:3px 0}
.def{background:#faf7ff;border:1px solid #e3d7f3;border-radius:12px;padding:8px 12px;margin:8px 0}
.box{border-radius:12px;padding:10px 12px;margin:12px 0}.bt-title{font-weight:700;margin-bottom:4px}
.tip{background:#fff8e1;border:1px solid #f3d98b}.exam{background:#e8f4fd;border:1px solid #9cc9ee}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.6;background:#fff}
th,td{border:1px solid #d9d2e4;padding:6px 7px;vertical-align:top;text-align:right}
th{background:#efe7f8;color:var(--pr)}
.poem{background:#fbf9f4;border:1px solid #eadfca;border-radius:12px;padding:6px 12px;margin:8px 0;font-family:"LitAmiri","Amiri",serif;font-size:19px;line-height:2}
.poem .who{font-family:"LitNaskh",serif;font-size:13px;color:var(--gold);font-weight:700}
.poem .bt{display:flex;flex-wrap:wrap;column-gap:22px}
.poem .h2{margin-inline-start:auto}
.tabs{display:flex;gap:8px;margin:8px 0}.tabs button{flex:1;background:#fff;color:var(--pr);border-color:var(--pr)}.tabs button.on{background:var(--pr);color:#fff}
.q{position:relative}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.qn{background:var(--pr);color:#fff;border-radius:10px;padding:0 9px;font-weight:700;font-size:15px}
.qt{font-size:12px;background:#eee;border-radius:8px;padding:0 8px;color:#444}
.qm{font-size:12px;color:var(--mut);margin-inline-start:auto}
.qq{font-weight:700;margin:4px 0 8px}
.src{font-weight:400;font-size:13px;color:var(--gold)}
.opt{display:block;width:100%;text-align:right;background:#fff;border:2px solid #ddd;color:#1f1f1f;margin:7px 0;padding:8px 12px;line-height:1.6}
.opt.sel{border-color:var(--sel);background:var(--selbg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{opacity:1;color:#1f1f1f}
.tfrow{display:flex;gap:10px}.tfrow .opt{flex:1;text-align:center;font-weight:700}
.mrow{border:1px solid #e5e0ec;border-radius:12px;padding:8px;margin:8px 0}
.mrow .ml{font-weight:700;margin-bottom:4px}
select{font:inherit;font-size:16px;min-height:44px;width:100%;border-radius:10px;border:2px solid #ccc;background:#fff;padding:4px 8px;color:#1f1f1f}
select.ok{border-color:var(--ok);background:var(--okbg)}select.bad{border-color:var(--bad);background:var(--badbg)}
textarea{font:inherit;font-size:16px;width:100%;min-height:110px;border-radius:12px;border:2px solid #ccc;padding:8px;line-height:1.7;resize:vertical}
.fb{border-radius:12px;padding:8px 12px;margin-top:8px;font-size:15px;line-height:1.75}
.fb.ok{background:var(--okbg);border:1px solid #a5d6a7}.fb.bad{background:var(--badbg);border:1px solid #ef9a9a}.fb.info{background:#f5f0fb;border:1px solid #d9c8ef}
.model ul{margin:4px 0;padding-right:20px}
.self{margin-top:8px}.self .row button{flex:1 1 60px;background:#fff;border-color:var(--pr);color:var(--pr)}.self .row button.on{background:var(--pr);color:#fff}
.hint{font-size:14px;color:var(--mut);margin:4px 0}
.scorebox{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.big{font-size:26px;font-weight:700;color:var(--pr)}
.sticky-score{position:sticky;top:calc(env(safe-area-inset-top) + 58px);z-index:4}
.res td,.res th{text-align:center}
.sticky-score{padding:6px 12px;margin:6px 0}.sticky-score .unit{display:none}.sticky-score .big{font-size:21px}.sticky-score .bar{margin:4px 0 0;height:6px}.sticky-score .small{line-height:1.4}
.note{background:#fff3f3;border:1px solid #f1c3c3}
.muted{color:var(--mut)}
.res a{display:inline-block;min-height:44px;min-width:44px;line-height:44px;color:var(--pr);font-weight:700}
@media (min-width:700px){body{font-size:18px}.poem{font-size:21px}}
</style>

var D={"sections": [{"id": "u1", "unit": "الوحدة الأولى", "title": "الأجناس الأدبية", "pages": "30–35", "icon": "📚", "lesson": "\u003ch3\u003eأولًا: المفهوم\u003c/h3\u003e\u003cdiv class=\"def\"\u003e\u003cb\u003eالجنس (أو النوع) الأدبي:\u003c/b\u003e هو النوع الفني الذي يَصُبّ فيه الأديب إبداعه الأدبي، كالخطبة أو المقالة أو القصة أو القصيدة أو الملحمة. وتُعرف الأجناس الأدبية أيضًا بـ«الأنواع الأدبية». وقد شغلت قضية الأجناس الأدبية تفكير النقاد. \u003cspan class=\"pg\"\u003eص 30\u003c/span\u003e\u003c/div\u003e\u003cp\u003eيصنّف الكتاب الأجناس الأدبية في العصر الحديث إلى محورين: \u003cb\u003eأجناس شعرية\u003c/b\u003e و\u003cb\u003eأجناس نثرية\u003c/b\u003e.\u003c/p\u003e\u003ch3\u003eثانيًا: الأجناس الشعرية \u003cspan class=\"pg\"\u003eص 30–31\u003c/span\u003e\u003c/h3\u003e\u003cdiv class=\"def\"\u003e\u003cb\u003e1- الشعر الغنائي:\u003c/b\u003e هو الشعر الذي يتغنى فيه الشاعر بذاته الشاعرة، فيعبّر عن أفكاره ومشاعره الخاصة بلغة أدبية تعكس شخصيته واتجاهاته العاطفية. \u003cspan class=\"pg\"\u003eص 30\u003c/span\u003e\u003c/div\u003e\u003cp\u003eمثاله قول إيليا أبي ماضي حين عبّر عن ذاته:\u003c/p\u003e\u003cdiv class=\"poem\"\u003e\u003cdiv class=\"who\"\u003eإيليا أبو ماضي\u003c/div\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eلا تَسَلني عَنِ السَّماءِ فَما عِنـ\u003c/span\u003e\u003cspan class=\"h2\"\u003eـديَ إلّا النُّعوتُ وَالأَسماءُ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eهِيَ شَيءٌ وَبَعضُ شَيءٍ وَحينًا\u003c/span\u003e\u003cspan class=\"h2\"\u003eكُلُّ شَيءٍ وَعِندَ قَومٍ هَباءُ\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"def\"\u003e\u003cb\u003e2- الشعر المسرحي:\u003c/b\u003e جنس أدبي حديث نسبيًّا، ظهر حين اتصلت الثقافة العربية بالثقافة الغربية عن طريق الترجمة والبعثات العلمية. ويُعدّ \u003cb\u003eأحمد شوقي\u003c/b\u003e أبرز شعراء الشعر المسرحي العربي، وقد تأثر فيه بشعراء فرنسا مثل «لامارتين»، وشعراء الإنجليز مثل «شكسبير». والمسرح الشعري نصّ يمكن تمثيله أمام الجمهور. \u003cspan class=\"pg\"\u003eص 30\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"def\"\u003e\u003cb\u003e3- الشعر الملحمي:\u003c/b\u003e \u003cb\u003eالملحمة\u003c/b\u003e قصيدة قصصية شديدة الطول، تدور عادةً حول أعمال بطولية ووقائع ذات دلالة لأمة من الأمم أو ثقافة من الثقافات. \u003cspan class=\"pg\"\u003eص 31\u003c/span\u003e\u003c/div\u003e\u003cp\u003e\u003cb\u003eخصائص الملحمة:\u003c/b\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eالبطل شخص جليل ذو مكانة كبيرة بين أبناء وطنه أو في العالم أجمع، ويحظى بأهمية تاريخية أو أسطورية.\u003c/li\u003e\u003cli\u003eميدان الأحداث شديد الاتساع يشمل كثيرًا من الأمم والبلاد المختلفة.\u003c/li\u003e\u003cli\u003eتصرفات البطل تتّسم بالشجاعة الفائقة، وتبدو خارقة في كثير من الأحيان.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cb\u003eأشهر الملاحم:\u003c/b\u003e «الإلياذة» و«الأوديسة» للشاعر الإغريقي \u003cb\u003eهوميروس\u003c/b\u003e، و«الشاهنامة» في الأدب الفارسي. \u003cb\u003eولم يعرف الأدب العربي القديم فن الملحمة بالمعنى المعروف\u003c/b\u003e، لكنه عرف ما يشبهها في العصر الحديث، ومنها \u003cb\u003e«الإلياذة الإسلامية»\u003c/b\u003e المعروفة بـ«ديوان مجد الإسلام» لـ\u003cb\u003eأحمد محرم\u003c/b\u003e: نظم فيها سيرة النبي ﷺ في نحو ثلاثة آلاف بيت، من ولادته حتى وفاته، ملتزمًا التسلسل الزمني في عرض الأحداث. \u003cspan class=\"pg\"\u003eص 31\u003c/span\u003e\u003c/p\u003e\u003cp class=\"small\"\u003eأحمد محرم (1877–1945م): شاعر مصري سخّر شعره للدفاع عن العروبة والذَّود عن الإسلام.\u003c/p\u003e\u003cdiv class=\"poem\"\u003e\u003cdiv class=\"who\"\u003eأحمد محرم – عن شهداء بدر\u003c/div\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eطُفْ بالمصارعِ وَاستَمِعْ نَجواها\u003c/span\u003e\u003cspan class=\"h2\"\u003eوَالثِمْ بأفياءِ الجِنانِ ثَراها\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003ch3\u003eثالثًا: الشعر الحر (من حيث الشكل) \u003cspan class=\"pg\"\u003eص 31\u003c/span\u003e\u003c/h3\u003e\u003cp\u003eظهر شكل جديد من الشعر أُطلق عليه \u003cb\u003e(الشعر الحر)\u003c/b\u003e، ومرّ بثلاث مراحل:\u003c/p\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eما تحلّل منه الشعراء\u003c/th\u003e\u003cth\u003eالاسم / الأعلام\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالأولى\u003c/td\u003e\u003ctd\u003eالقافية الموحّدة\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالثانية\u003c/td\u003e\u003ctd\u003eأوزان الخليل والقافية الموحدة، \u003cb\u003eمع الالتزام بالتفعيلة\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003cb\u003eشعر التفعيلة\u003c/b\u003e: أمين الريحاني، نازك الملائكة، بدر شاكر السياب، عبد الوهاب البياتي، محمود درويش\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالثالثة\u003c/td\u003e\u003ctd\u003eالوزن والقافية والتفعيلة\u003c/td\u003e\u003ctd\u003e\u003cb\u003eقصيدة النثر\u003c/b\u003e: أدونيس (سوريا)، يوسف الخال (لبنان)، جبرا إبراهيم جبرا (فلسطين)\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eوتميّزت \u003cb\u003eقصيدة النثر\u003c/b\u003e بالاعتماد على \u003cb\u003eالرمز والأساطير والإشارات والتضمينات\u003c/b\u003e.\u003c/p\u003e\u003cdiv class=\"box tip\"\u003e\u003cdiv class=\"bt-title\"\u003e💡 حيلة للحفظ\u003c/div\u003eمراحل الشعر الحر مثل «سُلّم يتخلّص من قيد بعد قيد»: \u003cb\u003eقافية ← ثم الوزن (وتبقى التفعيلة) ← ثم كل شيء\u003c/b\u003e.\u003cbr\u003eالأجناس الشعرية ثلاثة تبدأ بـ«غ م م»: \u003cb\u003eغ\u003c/b\u003eنائي، \u003cb\u003eم\u003c/b\u003eسرحي، \u003cb\u003eم\u003c/b\u003eلحمي.\u003c/div\u003e\u003ch3\u003eرابعًا: الأجناس النثرية \u003cspan class=\"pg\"\u003eص 32–33\u003c/span\u003e\u003c/h3\u003e\u003cdiv class=\"def\"\u003e\u003cb\u003e1- الخطابة:\u003c/b\u003e فنّ الإلقاء الشفهي في مواجهة الجماهير، وتهدف إلى استمالة الناس وإقناعهم، وهي \u003cb\u003eأقدم فنون النثر\u003c/b\u003e. كانت قديمًا مشافهةً، أما اليوم فأصبحت أحيانًا مكتوبة، ومزج بعض الخطباء بين المشافهة والمكتوب فأخذت مسمّى جديدًا هو \u003cb\u003e(الخطاب)\u003c/b\u003e. واشتهرت في العصر الحديث في مجالات منها: السياسة والحرب والدين. \u003cspan class=\"pg\"\u003eص 32\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"def\"\u003e\u003cb\u003e2- المقال:\u003c/b\u003e فن نثري حديث يعالج موضوعًا ما أو يعرض قضية ما من خلال منظور الكاتب، وقد تطوّر المقال في الأدب العربي عن \u003cb\u003eالرسالة الأدبية القديمة\u003c/b\u003e. \u003cspan class=\"pg\"\u003eص 32\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eنوع المقال\u003c/th\u003e\u003cth\u003eسماته\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eأدبي\u003c/td\u003e\u003ctd\u003eيعرض الكاتب قضية تدور في رأسه وتتغذّى من أفكاره وملاحظاته؛ يتميّز بظهور شخصية الكاتب، وبروز عاطفته، وكثرة الإيحاءات اللفظية، وتنوّع الأساليب بين الخبر والإنشاء.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعلمي بحت\u003c/td\u003e\u003ctd\u003eيعرض قضية علمية بعيدًا عن الأسلوب الأدبي؛ الألفاظ محددة الدلالة، والفكرة واضحة، ويبتعد عن المجاز والصور البيانية والإيحاءات.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعلمي متأدّب\u003c/td\u003e\u003ctd\u003eيعبّر فيه الكاتب عن الحقيقة العلمية \u003cb\u003eبأسلوب أدبي واضح\u003c/b\u003e.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعلمي ميسّر\u003c/td\u003e\u003ctd\u003eيعرض قضية علمية بأسلوب ميسّر، ليس فيه إغراق في المصطلحات ولا الحقائق العلمية ولا الأرقام.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp class=\"small\"\u003eنموذج المقال الأدبي في الكتاب: مقطع لمصطفى صادق الرافعي عن العظمة (مجلة الرسالة 1942) \u003cspan class=\"pg\"\u003eص 32\u003c/span\u003e.\u003c/p\u003e\u003cdiv class=\"def\"\u003e\u003cb\u003e3- المسرحية:\u003c/b\u003e جنس أدبي يروي قصة من خلال حوار الشخصيات وأفعالها، وتدور أحداثها على خشبة المسرح أمام الجمهور. \u003cspan class=\"pg\"\u003eص 33\u003c/span\u003e\u003c/div\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003eلم يعرف الأدب العربي فن المسرح إلا في العصر الحديث\u003c/b\u003e بعد الاتصال بالثقافة الغربية في القرن التاسع عشر، على يد الأديب اللبناني \u003cb\u003eمارون النقاش\u003c/b\u003e الذي تأثر بالفرنسي «موليير»، فترجم مسرحية «البخيل»، ثم كتب «الحسود السليط» و«أبو الحسن المغفل».\u003c/li\u003e\u003cli\u003e\u003cb\u003eأبو خليل القباني\u003c/b\u003e: أول من أسّس مسرحًا عربيًّا في القرن التاسع عشر في \u003cb\u003eدمشق\u003c/b\u003e، وقدّم عروضًا مستوحاة من التاريخ العربي مثل «هارون الرشيد».\u003c/li\u003e\u003cli\u003eوعرف الأدب العربي \u003cb\u003eالمسرح الشعري\u003c/b\u003e عن طريق أحمد شوقي: «مصرع كليوباترا» و«مجنون ليلى».\u003c/li\u003e\u003c/ul\u003e\u003cdiv class=\"def\"\u003e\u003cb\u003e4- القصة:\u003c/b\u003e جنس أدبي عام لأنواع متعددة منها: الأقصوصة، والقصة القصيرة، والقصة المتوسطة، والرواية. \u003cspan class=\"pg\"\u003eص 33\u003c/span\u003e\u003c/div\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003eمن أعلامها:\u003c/b\u003e محمد حسين هيكل، محمود تيمور، توفيق الحكيم، نجيب محفوظ، سليمان الشطي، زكريا تامر، عيسى الناعوري، يوسف إدريس.\u003c/li\u003e\u003cli\u003e\u003cb\u003eعناصر القصة الفنية:\u003c/b\u003e الأحداث، الشخصيات، الزمان، المكان، العقدة، الحل.\u003c/li\u003e\u003cli\u003eيمثّل \u003cb\u003eالقصص القرآني\u003c/b\u003e نموذجًا رائعًا متقدّمًا للقصة بعناصرها الفنية، ولعل \u003cb\u003eقصة يوسف عليه السلام\u003c/b\u003e تُعدّ نموذجًا حيًّا للقصة القرآنية.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eوهناك أنواع أخرى كثيرة في العصر الحديث منها: الرواية، والسيرة، والخاطرة، وأدب اليوميات والمذكرات الشخصية، والرسالة. \u003cspan class=\"pg\"\u003eص 33\u003c/span\u003e\u003c/p\u003e\u003cdiv class=\"box tip\"\u003e\u003cdiv class=\"bt-title\"\u003e💡 حيلة للحفظ\u003c/div\u003eالأجناس النثرية: \u003cb\u003e«خَمْمَق»\u003c/b\u003e = \u003cb\u003eخ\u003c/b\u003eطابة، \u003cb\u003eم\u003c/b\u003eقال، \u003cb\u003eم\u003c/b\u003eسرحية، \u003cb\u003eق\u003c/b\u003eصة.\u003cbr\u003eأنواع المقال الأربعة: «أدبي – بحت – متأدّب – ميسّر». تذكّر: \u003cb\u003eالمتأدّب\u003c/b\u003e = علم + أسلوب أدبي، \u003cb\u003eالميسّر\u003c/b\u003e = علم + بدون مصطلحات وأرقام.\u003c/div\u003e\u003cdiv class=\"box exam\"\u003e\u003cdiv class=\"bt-title\"\u003e📝 كيف يأتي في الامتحان؟\u003c/div\u003eأسئلة القضية الأدبية في نماذج الوزارة قصيرة ومباشرة (درجتان غالبًا، درجة لكل نقطة)، مثل: «وضّح مفهوم الأجناس الأدبية»، «اذكر الأجناس الشعرية ممثّلًا لكل جنس»، «بيّن مراحل تطوّر الشعر الحر ذاكرًا أعلامه» (تدريبات ص34)، أو صح/خطأ مثل تدريب ص35. اكتب النقاط كما في الكتاب ومعها اسم علم أو مثال.\u003c/div\u003e", "qs": [{"id": "u1_1", "t": "mcq", "q": "الجنس الأدبي هو:", "opts": ["النوع الفني الذي يصبّ فيه الأديب إبداعه الأدبي", "البحر الشعري الذي تُنظم عليه القصيدة", "الغرض الذي يقصده الشاعر من قصيدته", "الأسلوب الذي يكتب به الأديب مقاله"], "a": 0, "ex": "التعريف كما في الكتاب: «النوع الفني الذي يصبّ فيه الأديب إبداعه الأدبي، كالخطبة أو المقالة أو القصة أو القصيدة أو الملحمة».", "p": "30"}, {"id": "u1_2", "t": "mcq", "q": "الشعر الذي يتغنى فيه الشاعر بذاته، فيعبّر عن أفكاره ومشاعره الخاصة بلغة تعكس شخصيته واتجاهاته العاطفية هو:", "opts": ["الشعر الملحمي", "الشعر الغنائي", "الشعر التعليمي", "الشعر المسرحي"], "a": 1, "ex": "هذا تعريف الشعر الغنائي، ومثاله في الكتاب أبيات إيليا أبي ماضي.", "p": "30"}, {"id": "u1_3", "t": "mcq", "q": "يُعدّ أبرز شعراء الشعر المسرحي العربي:", "opts": ["إيليا أبو ماضي", "أحمد شوقي", "نازك الملائكة", "أحمد محرم"], "a": 1, "ex": "«ويُعدّ شوقي أبرز شعراء الشعر المسرحي العربي، وقد تأثر فيه بشعراء فرنسا مثل لامارتين، والإنجليز مثل شكسبير».", "p": "30"}, {"id": "u1_4", "t": "mcq", "q": "صاحب «الإلياذة الإسلامية» المعروفة بـ«ديوان مجد الإسلام» هو:", "opts": ["هوميروس", "أحمد شوقي", "أحمد محرم", "محمود سامي البارودي"], "a": 2, "ex": "أحمد محرم نظم فيها سيرة النبي ﷺ في نحو ثلاثة آلاف بيت ملتزمًا التسلسل الزمني.", "p": "31"}, {"id": "u1_5", "t": "mcq", "q": "المرحلة التي تحلّل فيها الشعراء من أوزان الخليل والقافية الموحدة مع الالتزام بالتفعيلة هي:", "opts": ["مرحلة الشعر العمودي", "المرحلة الأولى", "المرحلة الثانية (شعر التفعيلة)", "المرحلة الثالثة (قصيدة النثر)"], "a": 2, "ex": "الأولى: التحلل من القافية الموحدة. الثانية: من أوزان الخليل والقافية مع الالتزام بالتفعيلة = شعر التفعيلة. الثالثة: من الوزن والقافية والتفعيلة = قصيدة النثر.", "p": "31"}, {"id": "u1_6", "t": "mcq", "q": "من أبرز شعراء «قصيدة النثر» في سوريا:", "opts": ["محمود درويش", "أدونيس", "نازك الملائكة", "بدر شاكر السياب"], "a": 1, "ex": "قصيدة النثر: أدونيس (سوريا)، يوسف الخال (لبنان)، جبرا إبراهيم جبرا (فلسطين). أما نازك والسياب ودرويش فمن شعراء التفعيلة.", "p": "31"}, {"id": "u1_7", "t": "mcq", "q": "المقال الذي يعبّر فيه الكاتب عن الحقيقة العلمية بأسلوب أدبي واضح هو المقال:", "opts": ["الأدبي", "العلمي البحت", "العلمي المتأدّب", "العلمي الميسّر"], "a": 2, "ex": "العلمي المتأدّب = حقيقة علمية + أسلوب أدبي واضح. أما البحت فبعيد عن الأسلوب الأدبي، والميسّر بلا إغراق في المصطلحات والأرقام.", "p": "32"}, {"id": "u1_8", "t": "mcq", "q": "أول من أسّس مسرحًا عربيًّا في القرن التاسع عشر في دمشق:", "opts": ["توفيق الحكيم", "مارون النقاش", "أحمد شوقي", "أبو خليل القباني"], "a": 3, "ex": "أبو خليل القباني في دمشق. أما مارون النقاش فأدخل المسرح إلى الأدب العربي بترجمة «البخيل» لموليير.", "p": "33"}, {"id": "u1_9", "t": "tf", "q": "المقال فنّ نثري لم يعرفه العرب قديمًا بخصائصه الفنية المعروفة.", "a": true, "ex": "الكتاب: المقال «فن نثري حديث» تطوّر عن الرسالة الأدبية القديمة. (تدريب ص35)", "p": "32", "fix": ""}, {"id": "u1_10", "t": "tf", "q": "عرف الأدب العربي المسرحية في العصر القديم وتطورت في العصر الحديث.", "a": false, "ex": "العبارة خاطئة.", "p": "33", "fix": "لم يعرف الأدب العربي فن المسرح إلا في العصر الحديث بعد الاتصال بالثقافة الغربية في القرن التاسع عشر (على يد مارون النقاش)."}, {"id": "u1_11", "t": "tf", "q": "لم يعرف الأدب العربي القديم فنّ الملحمة بخصائصه الأدبية المعروفة.", "a": true, "ex": "«ولم يعرف الأدب العربي القديم فنّ الملحمة بالمعنى المعروف، ولكن عرف ما يشبه ذلك في العصر الحديث» مثل الإلياذة الإسلامية.", "p": "31", "fix": ""}, {"id": "u1_12", "t": "tf", "q": "الخطابة أحدث فنون النثر العربي، ولم تعرف إلا مكتوبة.", "a": false, "ex": "العبارة خاطئة.", "p": "32", "fix": "الخطابة \u003cb\u003eأقدم\u003c/b\u003e فنون النثر، وكانت قديمًا \u003cb\u003eمشافهة\u003c/b\u003e، ثم أصبحت أحيانًا مكتوبة، ومزج بعضهم بينهما فسُمّيت «الخطاب»."}, {"id": "u1_13", "t": "tf", "q": "يمكن التمييز بين الأجناس الأدبية المختلفة على الرغم من التداخل بين فنونها.", "a": true, "ex": "لكل جنس خصائص تميّزه (كما رأيت في تعريف الملحمة والمسرحية والمقال…) رغم التداخل بينها. (تدريب ص35)", "p": "35", "fix": ""}, {"id": "u1_14", "t": "match", "q": "صِل كلّ علَم بالجنس الأدبي الذي برز فيه:", "p": "31–33", "ex": "", "right": ["شعر التفعيلة", "المسرحية", "قصيدة النثر", "القصة والرواية", "الملحمة"], "left": ["نازك الملائكة", "أدونيس", "مارون النقاش", "نجيب محفوظ", "هوميروس"], "ans": [0, 2, 1, 3, 4]}, {"id": "u1_15", "t": "match", "q": "صِل نوع المقال بسمته:", "p": "32", "ex": "", "right": ["ألفاظ محددة الدلالة وابتعاد عن المجاز", "حقيقة علمية بأسلوب أدبي واضح", "لا إغراق في المصطلحات ولا الأرقام", "ظهور شخصية الكاتب وبروز عاطفته"], "left": ["المقال الأدبي", "المقال العلمي البحت", "المقال العلمي المتأدّب", "المقال العلمي الميسّر"], "ans": [3, 0, 1, 2]}, {"id": "u1_16", "t": "open", "q": "وضّح مفهوم الأجناس الأدبية. \u003cspan class=\"src\"\u003e(تدريب 1 ص34)\u003c/span\u003e", "model": ["الجنس (أو النوع) الأدبي هو النوع الفني الذي يصبّ فيه الأديب إبداعه الأدبي.", "مثل: الخطبة، أو المقالة، أو القصة، أو القصيدة، أو الملحمة."], "p": "30", "marks": 2, "hint": ""}, {"id": "u1_17", "t": "open", "q": "اذكر الأجناس الأدبية الشعرية ممثّلًا لكل جنس منها. \u003cspan class=\"src\"\u003e(تدريب 2 ص34)\u003c/span\u003e", "model": ["الشعر الغنائي: مثل أبيات إيليا أبي ماضي «لا تسلني عن السماء…».", "الشعر المسرحي: مثل مسرحيات أحمد شوقي «مصرع كليوباترا» و«مجنون ليلى».", "الشعر الملحمي: مثل الإلياذة والأوديسة لهوميروس، والشاهنامة، و«الإلياذة الإسلامية» لأحمد محرم."], "p": "30–31", "marks": 3, "hint": ""}, {"id": "u1_18", "t": "open", "q": "بيّن مراحل تطور الشعر الحر ذاكرًا أبرز أعلامه الذين برزوا فيها. \u003cspan class=\"src\"\u003e(تدريب 3 ص34)\u003c/span\u003e", "model": ["المرحلة الأولى: التحلل من القافية الموحدة.", "المرحلة الثانية: التحلل من أوزان الخليل والقافية الموحدة مع الالتزام بالتفعيلة (شعر التفعيلة): نازك الملائكة، بدر شاكر السياب، عبد الوهاب البياتي، محمود درويش، أمين الريحاني.", "المرحلة الثالثة: التحلل من الوزن والقافية والتفعيلة (قصيدة النثر): أدونيس، يوسف الخال، جبرا إبراهيم جبرا؛ وتميّزت بالرمز والأساطير والإشارات والتضمينات."], "p": "31", "marks": 3, "hint": ""}, {"id": "u1_19", "t": "open", "q": "عُد إلى سورة يوسف عليه السلام، وحدّد منها: (أ) شخصيتين ثانويتين، (ب) مكانًا لأحد الأحداث، (ج) نموذجًا للحوار. \u003cspan class=\"src\"\u003e(تدريب 6 ص35)\u003c/span\u003e", "model": ["أ- الشخصيات الثانوية: يعقوب عليه السلام، إخوة يوسف، عزيز مصر، امرأة العزيز، الملك، صاحبا السجن (يكفي اثنان).", "ب- المكان: الجُبّ (البئر)، بيت العزيز، السجن، مصر (يكفي واحد).", "ج- الحوار: مثل قول يعقوب ليوسف: ﴿يَا بُنَيَّ لَا تَقْصُصْ رُؤْيَاكَ عَلَى إِخْوَتِكَ﴾، أو حوار يوسف مع صاحبي السجن."], "p": "33، 35", "marks": 3, "hint": "تذكّر أن عناصر القصة: الأحداث، الشخصيات، الزمان، المكان، العقدة، الحل."}, {"id": "u1_20", "t": "open", "q": "تأمّل قول إيليا أبي ماضي:\u003cdiv class=\"poem\"\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eلا تَسَلني عَنِ السَّماءِ فَما عِنـ\u003c/span\u003e\u003cspan class=\"h2\"\u003eـديَ إلّا النُّعوتُ وَالأَسماءُ\u003c/span\u003e\u003c/div\u003e\u003c/div\u003eإلى أيّ الأجناس الشعرية ينتمي هذا الشعر؟ علّل.", "model": ["ينتمي إلى \u003cb\u003eالشعر الغنائي\u003c/b\u003e.", "لأن الشاعر يتغنّى فيه بذاته، ويعبّر عن أفكاره ومشاعره الخاصة بلغة تعكس شخصيته (الكتاب: «حين عبّر عن ذاته»)."], "p": "30", "marks": 2, "hint": ""}], "sub": "الشعر الغنائي والمسرحي والملحمي، الشعر الحر، الخطابة والمقال والمسرحية والقصة"}, {"id": "u2", "unit": "الوحدة الثانية", "title": "مدرسة الإحياء", "pages": "75–79", "icon": "🏛️", "lesson": "\u003ch3\u003eحال الأدب قبل الإحياء \u003cspan class=\"pg\"\u003eص 75\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003eعانى الأدب العربي لعقود طويلة من \u003cb\u003eالضعف والركود\u003c/b\u003e بعد سقوط الخلافة العباسية في بغداد.\u003c/li\u003e\u003cli\u003eانتقل الأدب من الاتجاه الغنائي الذاتي المتصل بالحكام وأصحاب السلطة إلى الاتجاه الموضوعي العام الذي يعبّر عن هموم العامة.\u003c/li\u003e\u003cli\u003eازدهر التيار الشعبي، وظهر أدب الرحلات، وتطورت فنون شعرية أشهرها \u003cb\u003eالشعر التعليمي والألغاز الشعرية\u003c/b\u003e.\u003c/li\u003e\u003cli\u003eقيل عن أدب ذلك العصر: \u003cb\u003eأدب الضعف والانحطاط\u003c/b\u003e، وبقي كذلك حتى بدايات العصر الحديث حين نهض الأدب على يد مجموعة من الأدباء.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eتعريف مدرسة الإحياء وسبب التسمية \u003cspan class=\"pg\"\u003eص 75\u003c/span\u003e\u003c/h3\u003e\u003cdiv class=\"def\"\u003e\u003cb\u003eالمدرسة الإحيائية:\u003c/b\u003e الحركة الأدبية التي ظهرت أوائل العصر الحديث في \u003cb\u003eالنصف الثاني من القرن التاسع عشر\u003c/b\u003e، والتزم فيها الأدباء – خاصة الشعراء – نهج أدباء عصور الازدهار: \u003cb\u003eالجاهلي، والإسلامي، والأموي، والعباسي\u003c/b\u003e. \u003cspan class=\"pg\"\u003eص 75\u003c/span\u003e\u003c/div\u003e\u003cp\u003eولم يتخلّص شعراؤها تمامًا من كل مظاهر الضعف، بل جرت بعض آثاره على ألسنة نفر منهم سرعان ما تلاشى.\u003c/p\u003e\u003cp\u003e\u003cb\u003eأسماؤها الأخرى:\u003c/b\u003e مدرسة البعث، مدرسة البعث والإحياء، المدرسة التقليدية، الكلاسيكية.\u003c/p\u003e\u003ch3\u003eأسباب ظهورها \u003cspan class=\"pg\"\u003eص 75\u003c/span\u003e\u003c/h3\u003e\u003col\u003e\u003cli\u003eنمو الشعور الوطني والقومي لدى الشعوب العربية.\u003c/li\u003e\u003cli\u003eالرغبة في إحياء المجد الأدبي للعرب.\u003c/li\u003e\u003cli\u003eانفصال الأدب والأدباء في مرحلة ضعف الأدب عن واقع الأمة وتاريخها.\u003c/li\u003e\u003cli\u003eإكثار الشعراء من الأغراض الشعرية التي لا ترقى بالشعر ولا تعبّر عن قضايا الأمة.\u003c/li\u003e\u003cli\u003eالاتصال بالثقافة الغربية التي واكبت الاستعمار الفرنسي والإنجليزي.\u003c/li\u003e\u003c/ol\u003e\u003ch3\u003eأعلامها في الشعر \u003cspan class=\"pg\"\u003eص 76\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cb\u003eمحمود سامي البارودي\u003c/b\u003e رائد المدرسة الإحيائية في الشعر العربي. ومن أبرز شعرائها كذلك: أحمد شوقي، حافظ إبراهيم، ناصيف اليازجي، أحمد محرم، علي الجارم، معروف الرصافي، جميل صدقي الزهاوي. ويظهر في أسلوبهم \u003cb\u003eمحاكاة القديم والحنين إليه\u003c/b\u003e.\u003c/p\u003e\u003cdiv class=\"poem\"\u003e\u003cdiv class=\"who\"\u003eالبارودي – من لاميّته\u003c/div\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eقَلَّدْتُ جيدَ المَعالي حِلْيَةَ الغَزَلِ\u003c/span\u003e\u003cspan class=\"h2\"\u003eوَقُلْتُ في الجِدِّ ما أَغْنى عَنِ الهَزَلِ\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003eفالبارودي هنا يكتب على غرار الأقدمين: \u003cb\u003eشكلًا ومضمونًا، لغةً وتعبيرًا، تصويرًا وتخييلًا وإيقاعًا\u003c/b\u003e، فكأنك تقرأ لشاعر قديم.\u003c/p\u003e\u003cdiv class=\"def\"\u003e\u003cb\u003eالمعارضة الشعرية:\u003c/b\u003e أن يُنشد شاعرٌ قصيدة في موضوع ما، ثم يقوم شاعر آخر بنظم قصيدة أخرى \u003cb\u003eعلى غرار القصيدة الأولى، محاكيًا لها وزنًا وقافيةً وموضوعًا\u003c/b\u003e، غير أن الشاعر الأخير يحرص على \u003cb\u003eالجِدّة والابتكار\u003c/b\u003e. \u003cspan class=\"pg\"\u003eص 76\u003c/span\u003e\u003c/div\u003e\u003cp\u003eمثالها: قصيدة أمير الشعراء \u003cb\u003eشوقي «نهج البردة»\u003c/b\u003e التي عارض فيها قصيدة \u003cb\u003e«البردة» للبوصيري\u003c/b\u003e (من شعراء العصر المملوكي، ت 696هـ):\u003c/p\u003e\u003cdiv class=\"poem\"\u003e\u003cdiv class=\"who\"\u003eشوقي – نهج البردة\u003c/div\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eرِيمٌ عَلى القاعِ بَيْنَ البانِ وَالعَلَمِ\u003c/span\u003e\u003cspan class=\"h2\"\u003eأَحَلَّ سَفْكَ دَمي في الأَشْهُرِ الحُرُمِ\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"poem\"\u003e\u003cdiv class=\"who\"\u003eالبوصيري – البردة\u003c/div\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eأَمِنْ تَذَكُّرِ جيرانٍ بِذي سَلَمِ\u003c/span\u003e\u003cspan class=\"h2\"\u003eمَزَجْتَ دَمْعًا جَرى مِنْ مُقْلَةٍ بِدَمِ\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cp class=\"small\"\u003eلاحظ: نفس البحر، ونفس القافية (الميم المكسورة)، ونفس الموضوع (المديح النبوي).\u003c/p\u003e\u003cp\u003eوعرف الأدب العربي \u003cb\u003eالمسرح الشعري\u003c/b\u003e على يد أحمد شوقي: «مجنون ليلى» و«مصرع كليوباترا». \u003cspan class=\"pg\"\u003eص 76\u003c/span\u003e\u003c/p\u003e\u003ch3\u003eأعلامها في النثر \u003cspan class=\"pg\"\u003eص 76–77\u003c/span\u003e\u003c/h3\u003e\u003cp\u003eاستلهم الأدباء روح الأدب العربي القديم \u003cb\u003eأصالةً وجزالةً، ونسجًا وسبكًا\u003c/b\u003e، فجاءت كتاباتهم على منوال الرواد السابقين.\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003eأحمد فارس الشدياق\u003c/b\u003e (1804–1887م): من كتبه «\u003cb\u003eالجاسوس على القاموس\u003c/b\u003e» انتقد فيه معجم القاموس المحيط للفيروزآبادي، و«\u003cb\u003eالساق على الساق فيما هو الفارياق\u003c/b\u003e» أودع فيه خلاصة آرائه، ويمثّل جسرًا بين الثقافتين العربية والغربية.\u003c/li\u003e\u003cli\u003e\u003cb\u003eأديب إسحاق\u003c/b\u003e: نادى بأن يكون العرب نارًا مسلّطة على الاستعمار والذل والعبودية، ونادى بوجوب اتحاد الشعوب العربية.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cb\u003eالمسرح\u003c/b\u003e («أبو الفنون»): تأثر به الأدباء العرب، ومن أنواعه: الجاد، والكوميدي، والتراجيدي، والتجريبي. ومن رواده: أحمد أبو خليل القباني، ومارون النقاش، و\u003cb\u003eتوفيق الحكيم رائد «المسرح الذهني»\u003c/b\u003e وأغزرهم إنتاجًا، ومن مسرحياته «أهل الكهف» و«سليمان الحكيم». \u003cspan class=\"pg\"\u003eص 77\u003c/span\u003e\u003c/p\u003e\u003cdiv class=\"def\"\u003e\u003cb\u003eالمسرح الذهني:\u003c/b\u003e حدث ذهني مقروء يسهل تصوّره وتأمّله، ويصعب تمثيله على خشبة المسرح. \u003cspan class=\"pg\"\u003eص 77\u003c/span\u003e\u003c/div\u003e\u003ch3\u003eجدول سريع: أعلام الإحياء \u003cspan class=\"pg\"\u003eص 76–77\u003c/span\u003e\u003c/h3\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعَلَم\u003c/th\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eأبرز ما يُذكر له في الكتاب\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eمحمود سامي البارودي\u003c/td\u003e\u003ctd\u003eالشعر\u003c/td\u003e\u003ctd\u003eرائد المدرسة الإحيائية؛ لاميّته «قلّدت جيد المعالي…»\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأحمد شوقي\u003c/td\u003e\u003ctd\u003eالشعر والمسرح الشعري\u003c/td\u003e\u003ctd\u003e«نهج البردة» (معارضة لبردة البوصيري)، «مجنون ليلى»، «مصرع كليوباترا»\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحافظ إبراهيم، ناصيف اليازجي، أحمد محرم، علي الجارم، معروف الرصافي، جميل صدقي الزهاوي\u003c/td\u003e\u003ctd\u003eالشعر\u003c/td\u003e\u003ctd\u003eمن أبرز شعراء المدرسة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأحمد فارس الشدياق\u003c/td\u003e\u003ctd\u003eالنثر\u003c/td\u003e\u003ctd\u003e«الجاسوس على القاموس»، «الساق على الساق فيما هو الفارياق»\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأديب إسحاق\u003c/td\u003e\u003ctd\u003eالنثر\u003c/td\u003e\u003ctd\u003eالدعوة إلى مقاومة الاستعمار واتحاد الشعوب العربية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأبو خليل القباني، مارون النقاش\u003c/td\u003e\u003ctd\u003eالمسرح\u003c/td\u003e\u003ctd\u003eمن روّاد المسرح العربي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتوفيق الحكيم\u003c/td\u003e\u003ctd\u003eالمسرح\u003c/td\u003e\u003ctd\u003eرائد «المسرح الذهني»: «أهل الكهف»، «سليمان الحكيم»\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003ch3\u003eالسمات الفنية لمدرسة الإحياء \u003cspan class=\"pg\"\u003eص 77\u003c/span\u003e\u003c/h3\u003e\u003col\u003e\u003cli\u003eالمحافظة على شكل القصيدة العربية القديمة من حيث \u003cb\u003eالالتزام بوحدة الوزن والقافية\u003c/b\u003e.\u003c/li\u003e\u003cli\u003eالمحافظة على \u003cb\u003eالأغراض التقليدية\u003c/b\u003e للشعر القديم كالمديح والرثاء والغزل والوصف.\u003c/li\u003e\u003cli\u003eبدء القصائد بـ\u003cb\u003eالمقدمات التقليدية\u003c/b\u003e، كافتتاح القصيدة بالغزل أو الوقوف على الأطلال ووصف الديار والآثار.\u003c/li\u003e\u003cli\u003eالالتزام بـ\u003cb\u003eالقاموس الأدبي القديم\u003c/b\u003e من حيث المفردات والتعبيرات والصور والأخيلة.\u003c/li\u003e\u003cli\u003e\u003cb\u003eتعدد الأغراض\u003c/b\u003e في القصيدة الواحدة (من الغزل إلى الفخر إلى الوصف…).\u003c/li\u003e\u003cli\u003e\u003cb\u003eهجر\u003c/b\u003e أكثر الأغراض التي كانت دائرة في عصور الضعف كالألغاز الشعرية وشعر التصوف.\u003c/li\u003e\u003c/ol\u003e\u003cdiv class=\"box tip\"\u003e\u003cdiv class=\"bt-title\"\u003e💡 حيلة للحفظ\u003c/div\u003eسمات الإحياء = «قصيدة قديمة بالكامل»: \u003cb\u003eشكل\u003c/b\u003e قديم (وزن وقافية واحدة) + \u003cb\u003eمقدمة\u003c/b\u003e قديمة (غزل/أطلال) + \u003cb\u003eأغراض\u003c/b\u003e قديمة ومتعددة + \u003cb\u003eمعجم\u003c/b\u003e قديم + \u003cb\u003eهجر\u003c/b\u003e أغراض عصر الضعف.\u003cbr\u003eأسماؤها: «بعث – إحياء – تقليدية – كلاسيكية».\u003c/div\u003e\u003cp\u003e\u003cb\u003eربط بالنصوص:\u003c/b\u003e قصيدة «غربة وحنين» للبارودي (ص80) من نصوص هذه الوحدة، والبارودي «رائد مدرسة الإحياء التي أعادت الشعر العربي إلى عصور القوة» ولُقّب بـ«ربّ السيف والقلم». وفي تدريبات النص (ص85 س8) يُطلب: دلّل على سمات المدرسة الإحيائية في شعر البارودي من حيث \u003cb\u003eمقدمة القصيدة، والمعجم اللغوي القديم، والخيال\u003c/b\u003e.\u003c/p\u003e\u003cdiv class=\"box exam\"\u003e\u003cdiv class=\"bt-title\"\u003e📝 كيف يأتي في الامتحان؟\u003c/div\u003eفي نموذج الوزارة (2021–2022) جاء سؤال: «اذكر سببين من أسباب ظهور مدرسة الإحياء» (درجتان، درجة لكل سبب). ويأتي أيضًا التطبيقي: «استخلص من الأبيات خصائص المدرسة الإحيائية في الغرض والشكل والمضمون» (تدريب ص79)، أو «دلّل من النص على سمات الإحياء» (ص85).\u003cbr\u003eطريقة الإجابة: \u003cb\u003eاذكر السمة كما في الكتاب ← ثم الدليل من البيت\u003c/b\u003e (كلمة أو عبارة).\u003c/div\u003e", "qs": [{"id": "u2_1", "t": "mcq", "q": "رائد المدرسة الإحيائية في الشعر العربي هو:", "opts": ["أحمد شوقي", "خليل مطران", "محمود سامي البارودي", "حافظ إبراهيم"], "a": 2, "ex": "«يُعدّ الشاعر محمود سامي البارودي رائد المدرسة الإحيائية في الشعر العربي». أما مطران فمن رواد الرومانسية.", "p": "76"}, {"id": "u2_2", "t": "mcq", "q": "ظهرت مدرسة الإحياء في:", "opts": ["بعد عام 1945م", "أواخر القرن الثامن عشر", "النصف الثاني من القرن التاسع عشر", "مطلع القرن العشرين"], "a": 2, "ex": "«الحركة الأدبية التي ظهرت أوائل العصر الحديث في النصف الثاني من القرن التاسع عشر».", "p": "75"}, {"id": "u2_3", "t": "mcq", "q": "جميع ما يأتي من أسماء مدرسة الإحياء ما عدا:", "opts": ["المدرسة التقليدية", "مدرسة البعث", "مدرسة الديوان", "الكلاسيكية"], "a": 2, "ex": "أسماؤها: البعث، البعث والإحياء، التقليدية، الكلاسيكية. أما «الديوان» فمدرسة رومانسية (العقاد والمازني وشكري).", "p": "75"}, {"id": "u2_4", "t": "mcq", "q": "عارض أحمد شوقي في قصيدته «نهج البردة» قصيدة:", "opts": ["سينية البحتري", "لامية البارودي", "البردة للبوصيري", "لامية العرب للشنفرى"], "a": 2, "ex": "شوقي عارض «البردة» للبوصيري (شاعر مملوكي ت 696هـ).", "p": "76"}, {"id": "u2_5", "t": "mcq", "q": "رائد «المسرح الذهني» هو:", "opts": ["توفيق الحكيم", "أبو خليل القباني", "مارون النقاش", "أحمد شوقي"], "a": 0, "ex": "توفيق الحكيم رائد المسرح الذهني، ومن مسرحياته «أهل الكهف» و«سليمان الحكيم».", "p": "77"}, {"id": "u2_6", "t": "mcq", "q": "مؤلف كتاب «الجاسوس على القاموس» الذي انتقد فيه القاموس المحيط للفيروزآبادي:", "opts": ["أحمد فارس الشدياق", "ناصيف اليازجي", "أديب إسحاق", "توفيق الحكيم"], "a": 0, "ex": "أحمد فارس الشدياق (1804–1887م)، وله أيضًا «الساق على الساق فيما هو الفارياق».", "p": "76"}, {"id": "u2_7", "t": "mcq", "q": "واحدة مما يأتي \u003cu\u003eليست\u003c/u\u003e من سمات مدرسة الإحياء:", "opts": ["تعدد الأغراض في القصيدة الواحدة", "المحافظة على وحدة الوزن والقافية", "الدعوة إلى الوحدة العضوية في القصيدة", "بدء القصيدة بالمقدمات التقليدية"], "a": 2, "ex": "الوحدة العضوية من خصائص الرومانسية (وجماعة أبولو). أما الإحياء فيتميّز بتعدد الأغراض في القصيدة الواحدة.", "p": "77"}, {"id": "u2_8", "t": "mcq", "q": "«حدث ذهني مقروء يسهل تصوّره وتأمّله ويصعب تمثيله على خشبة المسرح» هذا تعريف:", "opts": ["المسرح التجريبي", "المسرح التراجيدي", "المسرح الشعري", "المسرح الذهني"], "a": 3, "ex": "من «إضاءة» ص77.", "p": "77"}, {"id": "u2_9", "t": "tf", "q": "من سمات مدرسة الإحياء المحافظة على شكل القصيدة العربية العمودية القديمة.", "a": true, "ex": "السمة الأولى: المحافظة على شكل القصيدة القديمة بالالتزام بوحدة الوزن والقافية. (تدريب 6 ص78)", "p": "77", "fix": ""}, {"id": "u2_10", "t": "tf", "q": "تخلّص شعراء المدرسة الإحيائية من كل عيوب القصيدة العربية.", "a": false, "ex": "العبارة خاطئة.", "p": "75", "fix": "لم يتخلّصوا تمامًا من كل مظاهر الضعف، بل جرت بعض آثاره على ألسنة نفر منهم سرعان ما تلاشى."}, {"id": "u2_11", "t": "tf", "q": "مارون النقاش هو رائد المسرح الذهني.", "a": false, "ex": "العبارة خاطئة.", "p": "77", "fix": "رائد المسرح الذهني هو \u003cb\u003eتوفيق الحكيم\u003c/b\u003e؛ أما مارون النقاش فهو من رواد المسرح العربي (ترجم «البخيل» لموليير)."}, {"id": "u2_12", "t": "tf", "q": "المعارضات فنّ نثري يقوم على محاكاة الأديب أساليب أدباء آخرين.", "a": false, "ex": "العبارة خاطئة.", "p": "76", "fix": "المعارضة فن \u003cb\u003eشعري\u003c/b\u003e: ينظم شاعر قصيدة على غرار قصيدة شاعر آخر \u003cb\u003eوزنًا وقافيةً وموضوعًا\u003c/b\u003e مع حرصه على الجِدّة والابتكار."}, {"id": "u2_13", "t": "match", "q": "صِل كل علَم بعمله:", "p": "76–77", "ex": "", "right": ["البردة", "الساق على الساق فيما هو الفارياق", "أهل الكهف", "نهج البردة"], "left": ["أحمد شوقي", "البوصيري", "أحمد فارس الشدياق", "توفيق الحكيم"], "ans": [3, 0, 1, 2]}, {"id": "u2_14", "t": "open", "q": "وضّح المقصود بـ(مدرسة الإحياء) في الأدب العربي الحديث، واذكر اسمين آخرين عُرفت بهما. \u003cspan class=\"src\"\u003e(تدريب 1 و3 ص78)\u003c/span\u003e", "model": ["الحركة الأدبية التي ظهرت أوائل العصر الحديث في النصف الثاني من القرن التاسع عشر، والتزم فيها الأدباء – خاصة الشعراء – نهج أدباء عصور الازدهار (الجاهلي والإسلامي والأموي والعباسي).", "من أسمائها: مدرسة البعث، البعث والإحياء، المدرسة التقليدية، الكلاسيكية (يكفي اسمان)."], "p": "75", "marks": 3, "hint": ""}, {"id": "u2_15", "t": "open", "q": "اذكر ثلاثة من أسباب ظهور المدرسة الإحيائية. \u003cspan class=\"src\"\u003e(تدريب 2 ص78)\u003c/span\u003e", "model": ["نمو الشعور الوطني والقومي لدى الشعوب العربية.", "الرغبة في إحياء المجد الأدبي للعرب.", "انفصال الأدب والأدباء في مرحلة الضعف عن واقع الأمة وتاريخها.", "إكثار الشعراء من الأغراض التي لا ترقى بالشعر ولا تعبّر عن قضايا الأمة.", "الاتصال بالثقافة الغربية التي واكبت الاستعمار الفرنسي والإنجليزي. (يكفي ثلاثة)"], "p": "75", "marks": 3, "hint": ""}, {"id": "u2_16", "t": "open", "q": "وضّح حال الحركة الأدبية قبل ظهور المدرسة الإحيائية. \u003cspan class=\"src\"\u003e(تدريب 4 ص78)\u003c/span\u003e", "model": ["ضعف وركود لعقود طويلة بعد سقوط الخلافة العباسية في بغداد.", "انتقل الأدب من الاتجاه الغنائي الذاتي المتصل بالحكام إلى الاتجاه الموضوعي العام المعبّر عن هموم العامة، وازدهر التيار الشعبي وأدب الرحلات، والشعر التعليمي والألغاز الشعرية.", "وقيل عنه: أدب الضعف والانحطاط."], "p": "75", "marks": 2, "hint": ""}, {"id": "u2_17", "t": "open", "q": "وضّح خصائص النثر في مدرسة الإحياء، ثم اذكر بعض أعلامه مع مؤلفاتهم. \u003cspan class=\"src\"\u003e(تدريب 5 ص78)\u003c/span\u003e", "model": ["الخصائص: استلهم الأدباء روح الأدب العربي القديم أصالةً وجزالةً ونسجًا وسبكًا، فجاءت كتاباتهم على منوال الرواد السابقين.", "الأعلام: أحمد فارس الشدياق: «الجاسوس على القاموس»، و«الساق على الساق فيما هو الفارياق».", "أديب إسحاق: نادى بأن يكون العرب نارًا مسلطة على الاستعمار وبوجوب اتحاد الشعوب العربية."], "p": "76–77", "marks": 3, "hint": ""}, {"id": "u2_18", "t": "open", "q": "قال علي الجارم:\u003cdiv class=\"poem\"\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eمالي فُتِنْتُ بِلَحْظِكِ الفَتّاكِ\u003c/span\u003e\u003cspan class=\"h2\"\u003eوَسَلَوْتُ كُلَّ مَليحَةٍ إِلّاكِ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eيُسْراكِ قَدْ مَلَكَتْ زِمامَ صَبابَتي\u003c/span\u003e\u003cspan class=\"h2\"\u003eوَمَضَلَّتي وَهُدايَ في يُمْناكِ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eفَإِذا وَصَلْتِ فَكُلُّ شَيْءٍ باسِمٌ\u003c/span\u003e\u003cspan class=\"h2\"\u003eوَإِذا هَجَرْتِ فَكُلُّ شَيْءٍ باكي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eهذا دَمي في وَجْنَتَيْكِ عَرَفْتُهُ\u003c/span\u003e\u003cspan class=\"h2\"\u003eلا تَسْتَطيعُ جُحودَهُ عَيْناكِ\u003c/span\u003e\u003c/div\u003e\u003c/div\u003eاستخلص من الأبيات أهمّ خصائص المدرسة الإحيائية: (أ) في الغرض الشعري، (ب) في الشكل، (ج) في المضمون. \u003cspan class=\"src\"\u003e(تدريب 7 ص79)\u003c/span\u003e", "model": ["أ- الغرض: المحافظة على الأغراض التقليدية للشعر القديم، وهو هنا \u003cb\u003eالغزل\u003c/b\u003e.", "ب- الشكل: المحافظة على شكل القصيدة العمودية القديمة بـ\u003cb\u003eوحدة الوزن والقافية\u003c/b\u003e (القافية واحدة، والرويّ الكاف المكسورة: الفتّاكِ، إلّاكِ، يمناكِ، باكي، عيناكِ).", "ج- المضمون: الالتزام بالقاموس الأدبي القديم في المفردات والصور، مثل: «لحظك الفتّاك»، «زمام صبابتي»، «دمي في وجنتيك» – وهي معانٍ وصور مألوفة في الغزل القديم."], "p": "77، 79", "marks": 3, "hint": "تذكّر سمات الإحياء الست في ص77 ثم ابحث عن دليلها في الأبيات."}, {"id": "u2_19", "t": "open", "q": "قال البارودي:\u003cdiv class=\"poem\"\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eقَلَّدْتُ جيدَ المَعالي حِلْيَةَ الغَزَلِ\u003c/span\u003e\u003cspan class=\"h2\"\u003eوَقُلْتُ في الجِدِّ ما أَغْنى عَنِ الهَزَلِ\u003c/span\u003e\u003c/div\u003e\u003c/div\u003eكيف يمثّل هذا البيت منهج مدرسة الإحياء؟", "model": ["يكتب البارودي على غرار الأقدمين شكلًا ومضمونًا، لغةً وتعبيرًا، تصويرًا وتخييلًا وإيقاعًا، فكأنك تقرأ لشاعر قديم.", "الشكل: بيت عمودي بشطرين ملتزم بالوزن والقافية (اللام المكسورة).", "اللغة والصورة: معجم قديم جزل وصورة تقليدية (جعل للمعالي «جيدًا» يُقلَّد بالحلية)."], "p": "76", "marks": 2, "hint": ""}], "sub": "التعريف والأسباب، البارودي وشوقي، المعارضة، النثر والمسرح، السمات الفنية"}, {"id": "u4", "unit": "الوحدة الرابعة", "title": "المدرسة الرومانسية وأدب المهجر", "pages": "135–140", "icon": "🌙", "lesson": "\u003ch3\u003eتمهيد \u003cspan class=\"pg\"\u003eص 135\u003c/span\u003e\u003c/h3\u003e\u003cp\u003eتنشأ المدارس الأدبية عندما تتوافر مجموعة من الخصائص الأسلوبية والجوانب الإبداعية والقواسم المشتركة بين مجموعة أدباء ضمن فترة زمنية محددة؛ ولذلك: \u003cb\u003eالمدرسة الأدبية لا تأتي فجأة ولا تزول فجأة\u003c/b\u003e.\u003c/p\u003e\u003ch3\u003eتعريف المدرسة الرومانسية \u003cspan class=\"pg\"\u003eص 135\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003eكلمة «رومانسية» مستحدثة في العربية، ويحاكيها مصطلحان: \u003cb\u003eالرومانتيكية والرومانطيقية\u003c/b\u003e، وتُرجم المصطلح إلى العربية فعُرف بـ\u003cb\u003eالإبداعية أو الابتداعية\u003c/b\u003e.\u003c/li\u003e\u003cli\u003eمشتقة من «\u003cb\u003eرومانس\u003c/b\u003e»: نوع من القصص شاع في القرون الوسطى في معظم البلاد الأوروبية الجنوبية خاصة، كان يُنظم شعرًا في الغالب ويدور حول مغامرات الفرسان وبطولاتهم في سبيل المكارم والحب، وتعني أيضًا كل ما هو خيالي أو غير واقعي، بعيد عن العقل قريب من العواطف والمشاعر.\u003c/li\u003e\u003cli\u003eأما الآن فالرومانسية \u003cb\u003eمذهب أدبي ظهر في أوروبا بعد ظهور المدرسة الكلاسيكية الغربية\u003c/b\u003e، ومن أهم أفكاره: \u003cb\u003eالاهتمام بالعاطفة والمشاعر الإنسانية، وبعالم الخيال والأحلام\u003c/b\u003e.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eنشأتها في الغرب \u003cspan class=\"pg\"\u003eص 136\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003eنشأت نوعًا من \u003cb\u003eالتمرّد على قيود المذهب الكلاسيكي\u003c/b\u003e.\u003c/li\u003e\u003cli\u003eبدأت في \u003cb\u003eفرنسا في أواخر القرن الثامن عشر\u003c/b\u003e، وبلغت قمة ازدهارها في منتصف القرن التاسع عشر.\u003c/li\u003e\u003cli\u003eمن أعلامها: الفرنسي \u003cb\u003eفيكتور هيجو\u003c/b\u003e مؤلف «البؤساء» و«عمال البحر».\u003c/li\u003e\u003cli\u003eويُعدّ \u003cb\u003eوليم شكسبير واضع القاعدة الأولى للرومانسية الغربية في مسرحه\u003c/b\u003e الشهير في إنجلترا، وتميّزت أعماله بتحليل عواطف القلب البشري من حبّ وبغض.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eالخصائص الفنية للمدرسة الرومانسية \u003cspan class=\"pg\"\u003eص 136\u003c/span\u003e\u003c/h3\u003e\u003col\u003e\u003cli\u003eالتعبير عن \u003cb\u003eتجربة شعورية ذاتية صادقة يطغى عليها الشعور بالحزن\u003c/b\u003e.\u003c/li\u003e\u003cli\u003eالدعوة إلى \u003cb\u003eتجديد الأوزان\u003c/b\u003e، واستعمال البحور المجزوءة، وتنوّع القوافي.\u003c/li\u003e\u003cli\u003eالدعوة إلى تحقيق \u003cb\u003eالوحدة العضوية\u003c/b\u003e المتمثلة في: وحدة الموضوع، وترابط الأفكار، ووحدة الجو النفسي.\u003c/li\u003e\u003cli\u003eالاهتمام بـ\u003cb\u003eالخيال\u003c/b\u003e.\u003c/li\u003e\u003cli\u003eالامتزاج بـ\u003cb\u003eالطبيعة\u003c/b\u003e ومناجاتها وتصويرها.\u003c/li\u003e\u003cli\u003e\u003cb\u003eسهولة الألفاظ\u003c/b\u003e وعذوبتها وحيويتها.\u003c/li\u003e\u003cli\u003eالتجديد في الموضوعات الشعرية، والدعوة إلى التأكيد على أن \u003cb\u003eالأدب إبداع\u003c/b\u003e.\u003c/li\u003e\u003c/ol\u003e\u003cdiv class=\"box tip\"\u003e\u003cdiv class=\"bt-title\"\u003e💡 حيلة للحفظ\u003c/div\u003eاحفظ الخصائص السبع كـ«٣ للقلب + ٤ للشكل واللغة»: \u003cb\u003eالقلب\u003c/b\u003e: ذاتٌ حزينة صادقة، خيال، طبيعة. \u003cb\u003eالشكل واللغة\u003c/b\u003e: أوزان وقوافٍ جديدة، وحدة عضوية، ألفاظ سهلة عذبة، موضوعات جديدة (الأدب إبداع).\u003cbr\u003eوتذكّر أن الرومانسية «عكس الإحياء» في أغلب السمات (انظر جدول المقارنة بالأسفل).\u003c/div\u003e\u003ch3\u003eالرومانسية في الأدب العربي \u003cspan class=\"pg\"\u003eص 136–137\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003eكانت \u003cb\u003eبوادرها على يد أدباء المهجر\u003c/b\u003e مثل جبران خليل جبران وإيليا أبي ماضي، الذين اطّلعوا على عيون الأدب الغربي عامة والأمريكي خاصة.\u003c/li\u003e\u003cli\u003eظهرت مع \u003cb\u003eمطلع القرن العشرين\u003c/b\u003e، وضعفت – كمذهب أدبي – وقلّ عدد أصحابها \u003cb\u003eبعد عام 1945م\u003c/b\u003e.\u003c/li\u003e\u003cli\u003eالمذهب الرومانسي العربي \u003cb\u003eامتداد للمذهب الرومانسي الغربي\u003c/b\u003e؛ فقد تبنّى فلسفته واتّسم إنتاجه بسماته.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cb\u003eعوامل ظهورها في الأدب العربي\u003c/b\u003e \u003cspan class=\"pg\"\u003eص 137\u003c/span\u003e:\u003c/p\u003e\u003col\u003e\u003cli\u003eاتصال العرب بالثقافة الغربية عن طريق البعثات، وترجمة بعض الأعمال الأدبية الرومانسية.\u003c/li\u003e\u003cli\u003eرفض النهج التقليدي السائد عند مدرسة الإحياء الكلاسيكية.\u003c/li\u003e\u003cli\u003eالرغبة في الاستقلالية والتعبير عن النزعة الذاتية.\u003c/li\u003e\u003cli\u003eالهروب من الواقع الأليم في ظل مفاسد الاستعمار إلى عالم الخيال.\u003c/li\u003e\u003cli\u003eتفجّر أحزان الشعراء بعدما خلّفته الحرب العالمية الأولى من قتل وتشريد وتدمير.\u003c/li\u003e\u003c/ol\u003e\u003ch3\u003eالاتجاهات والجماعات الرومانسية \u003cspan class=\"pg\"\u003eص 137–138\u003c/span\u003e\u003c/h3\u003e\u003cp\u003eبدأت الرومانسية العربية \u003cb\u003eمذهبًا نظريًّا نقديًّا ثائرًا\u003c/b\u003e قبل أن يجسّدها الأدباء في إنتاج فني، وتبلور في كتابين نقديين: \u003cb\u003e«الديوان» (1921م)\u003c/b\u003e للعقاد والمازني، و\u003cb\u003e«الغربال» (1922م)\u003c/b\u003e لميخائيل نعيمة.\u003c/p\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالجماعة\u003c/th\u003e\u003cth\u003eالمكان / التاريخ\u003c/th\u003e\u003cth\u003eالأعلام\u003c/th\u003e\u003cth\u003eما تميّزت به\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cb\u003eمدرسة الديوان\u003c/b\u003e\u003cbr\u003e(مدرسة التجديد الذهني)\u003c/td\u003e\u003ctd\u003eمصر – كتاب الديوان 1921م\u003c/td\u003e\u003ctd\u003eالعقاد، المازني، عبد الرحمن شكري\u003c/td\u003e\u003ctd\u003eقامت على دعامتين: \u003cb\u003eسعة ثقافة أصحابها\u003c/b\u003e، و\u003cb\u003eالاطلاع الواسع على الأدب الغربي خاصة الإنجليزي\u003c/b\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cb\u003eالرابطة القلمية\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eالولايات المتحدة الأمريكية 1920م (المهجر الشمالي)\u003c/td\u003e\u003ctd\u003eجبران، ميخائيل نعيمة، إيليا أبو ماضي، نسيب عريضة\u003c/td\u003e\u003ctd\u003eالدعوة إلى \u003cb\u003eالتجديد\u003c/b\u003e، و\u003cb\u003eالمبالغة في ذكر الأوطان\u003c/b\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cb\u003eجماعة أبولو\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e1932م – أسّسها \u003cb\u003eأحمد زكي أبو شادي\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eخليل مطران، علي محمود طه، أبو القاسم الشابي، إبراهيم ناجي، حسن الصيرفي، التيجاني\u003c/td\u003e\u003ctd\u003e\u003cb\u003eالوحدة العضوية\u003c/b\u003e، الانغماس في الطبيعة، التجديد في القوالب والأوزان، والدعوة إلى الأصالة والفطرة الشعرية والعاطفة الصادقة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cb\u003eالعصبة الأندلسية\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eالبرازيل (المهجر الجنوبي)\u003c/td\u003e\u003ctd\u003eفوزي المعلوف، رشيد الخوري، شكر الله الجر\u003c/td\u003e\u003ctd\u003eسُمّي شعراؤها «شعراء المهجر الجنوبي»، وأصدرت «\u003cb\u003eمجلة العصبة\u003c/b\u003e»\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"poem\"\u003e\u003cdiv class=\"who\"\u003eأبو القاسم الشابي – من نماذج أبولو\u003c/div\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eأَيُّها الحُبُّ أَنتَ سِرُّ بَلائي\u003c/span\u003e\u003cspan class=\"h2\"\u003eوَهُمومي وَرَوعَتي وَعَنائي\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003ch3\u003eأدب المهجر\u003c/h3\u003e\u003cp\u003e«أدب المهجر» لون جديد من ألوان الأدب العربي (ص134)، وأصحابه الأدباء العرب الذين هاجروا إلى الأمريكتين: \u003cb\u003eالمهجر الشمالي (الرابطة القلمية)\u003c/b\u003e و\u003cb\u003eالمهجر الجنوبي (العصبة الأندلسية)\u003c/b\u003e. و\u003cb\u003eقضية الغربة والاغتراب من أبرز موضوعات شعر المهجر\u003c/b\u003e (ص141، 146). ومثاله نص الوحدة «الأهل أهلي والبلاد بلادي» لـ\u003cb\u003eفوزي المعلوف\u003c/b\u003e، من روّاد العصبة الأندلسية، وعُرف بأنه «\u003cb\u003eشاعر الرومانسية الحزينة\u003c/b\u003e» \u003cspan class=\"pg\"\u003eص 141\u003c/span\u003e.\u003c/p\u003e\u003ch3\u003eمن أعلام الرومانسية العربية \u003cspan class=\"pg\"\u003eص 138\u003c/span\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003eخليل مطران\u003c/b\u003e: لبناني أقام بمصر، يُلقّب بـ\u003cb\u003eشاعر القُطرين\u003c/b\u003e، ومن أشهر قصائده «المساء».\u003c/li\u003e\u003cli\u003e\u003cb\u003eإبراهيم ناجي\u003c/b\u003e (مصر): دواوين «الطائر الجريح» و«ليالي القاهرة» و«وراء الغمام».\u003c/li\u003e\u003cli\u003e\u003cb\u003eعلي محمود طه\u003c/b\u003e: «الملّاح التائه». ومن الشام: \u003cb\u003eعمر أبو ريشة\u003c/b\u003e.\u003c/li\u003e\u003cli\u003eمن شعراء \u003cb\u003eالخليج\u003c/b\u003e: إبراهيم العريّض، أحمد محمد خليفة، غازي القصيبي، أحمد العدواني.\u003c/li\u003e\u003cli\u003eفي \u003cb\u003eالنثر\u003c/b\u003e: روايات يوسف السباعي وعبد الحليم عبد الله.\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eمقارنة مهمة: الإحياء × الرومانسية\u003c/h3\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eوجه المقارنة\u003c/th\u003e\u003cth\u003eمدرسة الإحياء\u003c/th\u003e\u003cth\u003eالمدرسة الرومانسية\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالشكل والموسيقا\u003c/td\u003e\u003ctd\u003eوحدة الوزن والقافية\u003c/td\u003e\u003ctd\u003eتجديد الأوزان، البحور المجزوءة، تنوّع القوافي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبناء القصيدة\u003c/td\u003e\u003ctd\u003eتعدد الأغراض في القصيدة الواحدة\u003c/td\u003e\u003ctd\u003eالوحدة العضوية (موضوع واحد، أفكار مترابطة، جو نفسي واحد)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمقدمة\u003c/td\u003e\u003ctd\u003eمقدمات تقليدية (غزل، أطلال)\u003c/td\u003e\u003ctd\u003e— (تدخل في الموضوع مباشرة غالبًا)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاللغة\u003c/td\u003e\u003ctd\u003eالقاموس الأدبي القديم\u003c/td\u003e\u003ctd\u003eسهولة الألفاظ وعذوبتها وحيويتها\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمضمون\u003c/td\u003e\u003ctd\u003eالأغراض التقليدية (مدح، رثاء، غزل، وصف)\u003c/td\u003e\u003ctd\u003eتجربة ذاتية صادقة حزينة، الطبيعة، موضوعات جديدة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالقدوة\u003c/td\u003e\u003ctd\u003eشعراء عصور الازدهار العربية\u003c/td\u003e\u003ctd\u003eالأدب الغربي (الإنجليزي، الأمريكي…)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالرواد\u003c/td\u003e\u003ctd\u003eالبارودي، شوقي، حافظ\u003c/td\u003e\u003ctd\u003eمطران  وعذوبتها وحيويتها / التجديد في الموضوعات والتأكيد على أن الأدب إبداع. (أي اثنتين)"], "p": "136", "marks": 2, "hint": ""}, {"id": "u4_18", "t": "open", "q": "قامت مدرسة الديوان على دعامتين أساسيتين، فما هما؟ \u003cspan class=\"src\"\u003e(تدريب 5 ص140)\u003c/span\u003e", "model": ["سعة ثقافة أصحابها.", "الاطلاع الواسع على الأدب الغربي، خاصة الأدب الإنجليزي."], "p": "137", "marks": 2, "hint": ""}, {"id": "u4_19", "t": "open", "q": "اذكر ما تميّزت به كلٌّ من الرابطة القلمية وجماعة أبولو، مبيّنًا وجهًا من أوجه الاختلاف بينهما. \u003cspan class=\"src\"\u003e(تدريب 6-أ ص140)\u003c/span\u003e", "model": ["الرابطة القلمية: الدعوة إلى التجديد، والمبالغة في ذكر الأوطان.", "جماعة أبولو: الوحدة العضوية، والانغماس في الطبيعة، والتجديد في القوالب والأوزان، والدعوة إلى الأصالة والفطرة الشعرية والعاطفة الصادقة.", "الاختلاف (أحد الأوجه): المكان – الرابطة في المهجر الشمالي (الولايات المتحدة) وأبولو في مصر بتأسيس أبي شادي؛ أو الزمن – الرابطة 1920م وأبولو 1932م؛ أو الأعضاء."], "p": "138", "marks": 3, "hint": ""}, {"id": "u4_20", "t": "open", "q": "قال خليل مطران:\u003cdiv class=\"poem\"\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eإِنّي أَقَمْتُ عَلى التَّعِلَّةِ بِالمُنى\u003c/span\u003e\u003cspan class=\"h2\"\u003eفي غُرْبَةٍ قالوا: تَكونُ دَوائي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eإِنْ يَشْفِ هذا الجِسْمَ طيبُ هَوائِها\u003c/span\u003e\u003cspan class=\"h2\"\u003eأَيُلَطِّفُ النّيرانَ طيبُ هَواءِ؟\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eعَبَثٌ طَوافي في البِلادِ وَعِلَّةٌ\u003c/span\u003e\u003cspan class=\"h2\"\u003eفي عِلَّةٍ مَنْفايَ لِاسْتِشْفاءِ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eمُتَفَرِّدٌ بِصَبابَتي مُتَفَرِّدٌ\u003c/span\u003e\u003cspan class=\"h2\"\u003eبِكَآبَتي مُتَفَرِّدٌ بِعَنائي\u003c/span\u003e\u003c/div\u003e\u003c/div\u003eحدّد ما تحقق من خصائص الرومانسية في الأبيات. \u003cspan class=\"src\"\u003e(تدريب 7 ص140)\u003c/span\u003e", "model": ["\u003cb\u003eتجربة ذاتية صادقة يطغى عليها الحزن\u003c/b\u003e: «متفرّد بصبابتي متفرّد بكآبتي متفرّد بعنائي»، «عبث طوافي».", "\u003cb\u003eالاهتمام بالخيال\u003c/b\u003e: صوّر ألمه الداخلي بـ«النيران» التي لا يلطّفها طيب الهواء.", "\u003cb\u003eسهولة الألفاظ وعذوبتها\u003c/b\u003e: ألفاظ واضحة قريبة مثل: غربة، دوائي، هواء، كآبتي.", "\u003cb\u003eالوحدة العضوية\u003c/b\u003e: الأبيات كلها في موضوع واحد (ألم الغربة والمرض) وجوّ نفسي واحد حزين."], "p": "136، 140", "marks": 3, "hint": "ابدأ بالخاصية كما في ص136 ثم الدليل من البيت."}], "sub": "التعريف والنشأة، الخصائص السبع، العوامل، الديوان والرابطة القلمية وأبولو والعصبة الأندلسية"}, {"id": "u6", "unit": "الوحدة السادسة", "title": "معايير نقد الشعر والنثر", "pages": "201–207", "icon": "⚖️", "lesson": "\u003ch3\u003eعناصر العمل الأدبي \u003cspan class=\"pg\"\u003eص 201\u003c/span\u003e\u003c/h3\u003e\u003cp\u003eعناصر العمل الأدبي أربعة: \u003cb\u003eالعاطفة، والفكرة، والأسلوب، والخيال\u003c/b\u003e. كل نوع من الأدب لا بد أن يشتمل عليها ولا يخلو من عنصر منها، لكن بعض الأجناس يحتاج إلى أحدها أكثر من غيره: \u003cb\u003eفالشعر يحتاج من الخيال أكثر مما تحتاجه الحِكَم، والحِكَم تحتاج من المعاني أكثر مما تحتاجه القصة\u003c/b\u003e.\u003c/p\u003e\u003ch3\u003e1- العاطفة \u003cspan class=\"pg\"\u003eص 201–202\u003c/span\u003e\u003c/h3\u003e\u003cdiv class=\"def\"\u003e\u003cb\u003eالعاطفة:\u003c/b\u003e مجموعة من المشاعر والأحاسيس التي تنتاب الأديب عندما يمرّ بتجربة ما. وتظهر أهميتها في أنها \u003cb\u003eتمنح الأدب صفة الخلود\u003c/b\u003e. \u003cspan class=\"pg\"\u003eص 201\u003c/span\u003e\u003c/div\u003e\u003cp\u003eيجب أن تكون العاطفة \u003cb\u003eصادقة\u003c/b\u003e نابعة من أعماق وجدان الشاعر، ومستمرة، وخصبة، وخالية من المبالغة. ومقياس القطعة الأدبية ما فيها من \u003cb\u003eقوة وصدق\u003c/b\u003e.\u003c/p\u003e\u003cp\u003e\u003cb\u003eتعتمد قوة العاطفة وصدقها على:\u003c/b\u003e\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cb\u003eطبيعة الأديب\u003c/b\u003e: فيجب أن يكون قويّ الشعور فيما يكتب.\u003c/li\u003e\u003cli\u003e\u003cb\u003eقوة أسلوب الكاتب\u003c/b\u003e: فبعض الأدباء مُلئوا شعورًا جارفًا لكن لم يُمنحوا أسلوبًا ينقلون به عواطفهم؛ ولذلك عاب النقاد قول شوقي في رثاء أبيه:\u003cdiv class=\"poem\"\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eسَأَلوني لِمَ لَمْ أَرثِ أَبي\u003c/span\u003e\u003cspan class=\"h2\"\u003eوَرِثاءُ الأَبِ دَيْنٌ أَيُّ دَيْنْ؟\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cb\u003eاستمرار العاطفة وثباتها\u003c/b\u003e على مدار القصيدة.\u003c/li\u003e\u003cli\u003e\u003cb\u003eخصوبة العواطف وتنوّعها\u003c/b\u003e، ومردّه إلى كثرة التجارب.\u003c/li\u003e\u003c/ol\u003e\u003ch3\u003e2- الأفكار والمعاني \u003cspan class=\"pg\"\u003eص 202–203\u003c/span\u003e\u003c/h3\u003e\u003cp\u003eهي \u003cb\u003eأساس بناء العمل الأدبي\u003c/b\u003e. وفي بعض الفنون تكون أهم عنصر \u003cb\u003eكالحِكَم والأمثال\u003c/b\u003e. ويجب أن تكون المعاني: \u003cb\u003eغزيرة فيّاضة، ودقيقة، وواضحة\u003c/b\u003e.\u003c/p\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eمقياس نقد الأفكار\u003c/th\u003e\u003cth\u003eمعناه\u003c/th\u003e\u003cth\u003eمثال الكتاب\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cb\u003eالصحة والخطأ\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eيلتزم الأديب بالحقيقة مهما كان نوعها: علمية، تاريخية، لغوية، أدبية؛ لأن الخطأ في الحقيقة قد يُفسد القصيدة.\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cb\u003eالتجديد والابتكار\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eالمعاني المبتكرة تزيد قوة الأدب، وإن كانت معروفة قدّمها الأديب بأسلوب تبدو فيه جديدة.\u003c/td\u003e\u003ctd\u003eأبو تمام جعل الكريم «اليمّ» من أي النواحي أتيته\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cb\u003eالتعمّق والسطحية\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eكلما عمقت المعاني زاد التأثير؛ والمعنى السهل الذي يعرفه كثير من الناس معنى بسيط ساذج.\u003c/td\u003e\u003ctd\u003eجبران: «حقيقة الحياة حياة…»\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"poem\"\u003e\u003cdiv class=\"who\"\u003eأبو تمام – مثال التجديد والابتكار\u003c/div\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eهُوَ اليَمُّ مِن أَيِّ النَّواحي أَتَيتَهُ\u003c/span\u003e\u003cspan class=\"h2\"\u003eفَلُجَّتُهُ المَعروفُ وَالجودُ ساحِلُه\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cp class=\"small\"\u003eوظيفة الأديب ليست أن يُعلّم الحقائق، إنما أن ينتفع بالحقائق المعروفة ويهيّج بها عواطف الناس في صورة جديدة مبتكرة. \u003cspan class=\"pg\"\u003eص 202\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e3- الخيال \u003cspan class=\"pg\"\u003eص 203\u003c/span\u003e\u003c/h3\u003e\u003cdiv class=\"def\"\u003e\u003cb\u003eالخيال:\u003c/b\u003e مَلَكة أدبية فريدة وظيفتها \u003cb\u003eإبراز الأفكار والمعاني في صورة شيّقة مؤثّرة\u003c/b\u003e، وكل ضروب الأدب تحتاج إليه، كلّ فنّ بقدر حاجته. \u003cspan class=\"pg\"\u003eص 203\u003c/span\u003e\u003c/div\u003e\u003cp\u003e\u003cb\u003eشروط جودة الخيال:\u003c/b\u003e صحة الخيال، وقوة التأثير، والعفوية، والجِدّة والابتكار، والاتساق مع الفكرة.\u003c/p\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eنوع الصورة\u003c/th\u003e\u003cth\u003eما تضمّه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cb\u003eخيال جزئي (بسيط)\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eالتشبيه، والاستعارة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cb\u003eخيال كلي (مركّب)\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eيرسم به الشاعر صورة كلية للمشهد الشعري، وتجمع بين \u003cb\u003eاللون والصوت والحركة\u003c/b\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003ch3\u003e4- الأسلوب \u003cspan class=\"pg\"\u003eص 203–204\u003c/span\u003e\u003c/h3\u003e\u003cp\u003eالأسلوب \u003cb\u003eوسيلة التعبير عن الأفكار والآراء\u003c/b\u003e، ويتكوّن الأسلوب الجيد عن طريق \u003cb\u003eالثقافة الواسعة وكثرة المران والممارسة\u003c/b\u003e. والموضوع يحدّد نوع الأسلوب (فأسلوب المقال العلمي غير أسلوب المقال الأدبي…)، كما يحدده فكر الكاتب ومشربه الأدبي.\u003c/p\u003e\u003cp\u003e\u003cb\u003eأولًا – نقد المفردات:\u003c/b\u003e أن تكون الكلمة فصيحة دقيقة في مكانها المناسب ولها إيحاء خاص، ويُشترط: سلامتها من الغرابة، والدقة في الاستعمال، و\u003cb\u003eشاعريتها\u003c/b\u003e فلا تكون سوقية أو وحشية أو منفّرة، وأن تكون مفيدة تغني عن الترادف والحشو، والصحة النحوية.\u003c/p\u003e\u003cp\u003e\u003cb\u003eثانيًا – نقد التراكيب:\u003c/b\u003e\u003c/p\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالأسلوب\u003c/th\u003e\u003cth\u003eتعريفه وسماته\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cb\u003eالجزل\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eيسمعه العامة ويعرفونه كلهم لكنهم \u003cb\u003eلا يستعملونه في أحاديثهم\u003c/b\u003e. سماته: \u003cb\u003eقوة الكلمات، وقِصَر الجمل، وتقديم الإيجاز على الإطناب\u003c/b\u003e.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cb\u003eالسهل (السهل الممتنع)\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eألفاظه لا تحتاج إلى توضيح لكنها مرتفعة عن الألفاظ العامية؛ فهو مع سهولته وقربه ليس إبداعه بالأمر السهل. (مثاله وصف الشيخ محمد عبد الله دراز للقرآن الكريم: متعة العامة والخاصة)\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eومن أمثلة نقد التراكيب قول محمد السنوسي: «الشعر هندسة كبرى تكاد ترى * في النسج واللفظ منه روح فرجار»؛ فقد استخدم كلمة \u003cb\u003e(فرجار)\u003c/b\u003e وهي أداة علمية غريبة في موضع غير مناسب، فجاء تركيب «روح فرجار» غير مناسب. \u003cspan class=\"pg\"\u003eص 204\u003c/span\u003e\u003c/p\u003e\u003ch3\u003e5- موسيقا الشعر \u003cspan class=\"pg\"\u003eص 204–205\u003c/span\u003e\u003c/h3\u003e\u003cp\u003eموسيقا الشعر هي \u003cb\u003eالعلامة الفارقة والمميّزة بين الشعر والنثر\u003c/b\u003e، وتتألف من:\u003c/p\u003e\u003cdiv class=\"tw\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالنوع\u003c/th\u003e\u003cth\u003eمكوّناته\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cb\u003eالموسيقا الخارجية\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e\u003cb\u003eالوزن\u003c/b\u003e (البحر الذي نُظمت عليه القصيدة) و\u003cb\u003eالقافية\u003c/b\u003e (إيقاع القصيدة وجرسها المميّز) و\u003cb\u003eالرويّ\u003c/b\u003e (الحرف الذي تُنسب إليه القصيدة).\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cb\u003eالموسيقا الداخلية\u003c/b\u003e\u003c/td\u003e\u003ctd\u003eالنغم الخاص الذي تمتاز به القصيدة من خلال مفرداتها وتنسيقها، وحركات الإعراب، والمدّ، والتفخيم، وفنون المحسّنات الصوتية.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cul\u003e\u003cli\u003eالبحور ذات التفعيلات \u003cb\u003eالطويلة\u003c/b\u003e – في الغالب – تصلح للموضوعات \u003cb\u003eالحماسية\u003c/b\u003e، وذات التفعيلات \u003cb\u003eالقصيرة\u003c/b\u003e تصلح لـ\u003cb\u003eالغزل\u003c/b\u003e ونحوه، وهي \u003cb\u003eعلاقة ظاهرة وليست قاعدة ثابتة\u003c/b\u003e.\u003c/li\u003e\u003cli\u003eاشتهرت قصائد برويّها: لامية العرب للشنفرى، عينية أبي ذؤيب الهذلي، رائية ابن أبي ربيعة، نونية أبي البقاء الرندي، سينية شوقي.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cb\u003eتطبيق الكتاب\u003c/b\u003e على قول الشابي في «أغاني الحياة»:\u003c/p\u003e\u003cdiv class=\"poem\"\u003e\u003cdiv class=\"who\"\u003eأبو القاسم الشابي\u003c/div\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eإِذا ما طَمَحْتُ إِلى غايَةٍ\u003c/span\u003e\u003cspan class=\"h2\"\u003eرَكِبْتُ المُنى وَنَسيتُ الحَذَرْ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"bt\"\u003e\u003cspan class=\"h1\"\u003eوَلَمْ أَتَجَنَّبْ وُعورَ الشِّعابِ\u003c/span\u003e\u003cspan class=\"h2\"\u003eوَلا كُبَّةَ اللَّهَبِ المُسْتَعِرْ\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cul\u003e\u003cli\u003eالموسيقا الخارجية: الوزن من \u003cb\u003eبحر المتقارب\u003c/b\u003e، وهو من البحور ذات التفعيلات القصيرة التي تناسب روح الشباب وحماسته. والقافية موحّدة والقصيدة \u003cb\u003eرائية\u003c/b\u003e لأنها تنتهي بحرف الراء الساكنة.\u003c/li\u003e\u003cli\u003eالموسيقا الداخلية: الجمل الشعرية قصيرة متتابعة، وحركات الإعراب سريعة متلاحقة. \u003cspan class=\"pg\"\u003eص 205\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cdiv class=\"box tip\"\u003e\u003cdiv class=\"bt-title\"\u003e💡 حيلة للحفظ\u003c/div\u003eعناصر العمل الأدبي: «\u003cb\u003eعَفَخَأ\u003c/b\u003e» = \u003cb\u003eع\u003c/b\u003eاطفة، \u003cb\u003eف\u003c/b\u003eكرة، \u003cb\u003eخ\u003c/b\u003eيال، \u003cb\u003eأ\u003c/b\u003eسلوب (+ موسيقا الشعر).\u003cbr\u003eمقاييس الفكرة: «\u003cb\u003eصَحّ – جَدّ – عَمُق\u003c/b\u003e» = الصحة والخطأ، التجديد والابتكار، التعمق والسطحية.\u003cbr\u003eقوة العاطفة: «\u003cb\u003eطبيعة – أسلوب – استمرار – خصوبة\u003c/b\u003e».\u003c/div\u003e\u003cdiv class=\"box exam\"\u003e\u003cdiv class=\"bt-title\"\u003e📝 كيف يأتي في الامتحان؟\u003c/div\u003eفي نموذج الوزارة (2021–2022، المسار الأدبي) جاء حرفيًّا: «\u003cb\u003eاذكر اثنين من مقاييس نقد الأفكار والمعاني في الأدب\u003c/b\u003e» – درجتان، والإجابة: الصحة والخطأ / التجديد والابتكار / التعمق والسطحية.\u003cbr\u003eويأتي التطبيقي: «احكم على الأبيات في ضوء معايير نقد الشعر من حيث: العاطفة – الفكرة – الخيال – الموسيقا الخارجية – الموسيقا الداخلية» (تدريب ص207). اكتب لكل معيار: \u003cb\u003eالحكم + الدليل من البيت\u003c/b\u003e.\u003c/div\u003e", "qs": [{"id": "u6_1", "t": "mcq", "q": "عناصر العمل الأدبي الأربعة هي:", "opts": ["الأحداث والشخصيات والزمان والمكان", "المقدمة والعرض والخاتمة والعنوان", "العاطفة والفكرة والأسلوب والخيال", "الوزن والقافية والروي والبحر"], "a": 2, "ex": "«عناصر العمل الأدبي وهي: العاطفة، والفكرة، والأسلوب، والخيال». (الخيار الأخير عناصر القصة).", "p": "201"}, {"id": "u6_2", "t": "mcq", "q": "العنصر الذي يمنح الأدب صفة الخلود:", "opts": ["الفكرة", "الوزن", "العاطفة", "الأسلوب الجزل"], "a": 2, "ex": "«وتظهر أهمية العاطفة في أنها تمنح الأدب الصفة التي نسمّيها بالخلود».", "p": "201"}, {"id": "u6_3", "t": "mcq", "q": "يكون عنصر «الأفكار والمعاني» أهمّ ما في العمل الأدبي في:", "opts": ["الرثاء", "الحِكَم والأمثال", "الوصف", "الغزل"], "a": 1, "ex": "«وفي بعض فنون الأدب يكون هذا العنصر أهمّ ما فيه، كالحِكَم والأمثال».", "p": "202"}, {"id": "u6_4", "t": "mcq", "q": "قول أبي تمام في الكريم: «هو اليمّ من أيّ النواحي أتيته…» مثال على مقياس:", "opts": ["التجديد والابتكار", "الصحة والخطأ", "التعمق والسطحية", "قوة الأسلوب"], "a": 0, "ex": "الناس اعتادوا وصف الكريم بالبحر، لكن أبا تمام قدّم المعنى المطروح من منظور جديد يتّسم بالطرافة والتجديد.", "p": "202"}, {"id": "u6_5", "t": "mcq", "q": "التشبيه والاستعارة من صور:", "opts": ["الخيال الجزئي (البسيط)", "الخيال الكلي (المركّب)", "الأسلوب الجزل", "الموسيقا الداخلية"], "a": 0, "ex": "الخيال الجزئي يضم التشبيه والاستعارة، والكلي يرسم صورة كلية للمشهد تجمع اللون والصوت والحركة.", "p": "203"}, {"id": "u6_6", "t": "mcq", "q": "عاب النقاد قول شوقي في رثاء أبيه «سألوني لِمَ لم أرثِ أبي…» لأن قوة العاطفة تعتمد على:", "opts": ["قوة أسلوب الكاتب", "حرف الروي", "صحة الفكرة", "الخيال الكلي"], "a": 0, "ex": "بعض الأدباء مُلئوا شعورًا جارفًا لكنهم لم يُمنحوا حينئذ أسلوبًا ينقلون به عواطفهم.", "p": "201"}, {"id": "u6_7", "t": "mcq", "q": "الحرف الذي تُنسب إليه القصيدة يسمى:", "opts": ["القافية", "التفعيلة", "البحر", "الرويّ"], "a": 3, "ex": "«وحرف الروي هو الحرف الذي تُنسب إليه القصيدة» مثل لامية العرب وسينية شوقي.", "p": "204"}, {"id": "u6_8", "t": "mcq", "q": "أبيات الشابي «إذا ما طمحت إلى غاية…» من بحر المتقارب، وهو بحر:", "opts": ["لا يناسب إلا الغزل", "مجزوء يناسب الحكمة", "ذو تفعيلات طويلة يناسب الرثاء", "ذو تفعيلات قصيرة تناسب روح الشباب وحماسته"], "a": 3, "ex": "تطبيق الكتاب ص205.", "p": "205"}, {"id": "u6_9", "t": "mcq", "q": "الأسلوب الذي «يسمعه العامة ويعرفونه كلهم لكنهم لا يستعملونه في أحاديثهم»:", "opts": ["الأسلوب العلمي", "الأسلوب السهل", "الأسلوب الجزل", "الأسلوب العامي"], "a": 2, "ex": "ومن سماته: قوة الكلمات، وقصر الجمل، وتقديم الإيجاز على الإطناب.",   return typeof a.self==="number";
