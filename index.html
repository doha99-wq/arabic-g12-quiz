:root{
  --bg:#f6f7f9;--card:#fff;--soft:#f0f2f5;--text:#16181d;--muted:#5f6672;--border:#dde1e7;
  --accent:#0f6e6e;--accent-soft:#e3f2f1;--ok:#1b7f3b;--ok-soft:#e5f5ea;--bad:#b42318;--bad-soft:#fdecea;
  --radius:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111418;--card:#1a1e24;--soft:#22272f;--text:#eef0f3;--muted:#a3abb7;--border:#323945;
  --accent:#5cc8c0;--accent-soft:#17312f;--ok:#5fd38a;--ok-soft:#163222;--bad:#ff8a80;--bad-soft:#3a1a18;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"QuizNaskh","Noto Naskh Arabic","Geeza Pro","Segoe UI","Tahoma",sans-serif;font-size:16px;line-height:1.75}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px}
header h1{font-size:1.3rem;line-height:1.5;margin:6px 0 2px}
header p{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}
input,select{width:100%;font:inherit;font-size:16px;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text)}
.field+.field{margin-top:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{font:inherit;font-size:.95rem;padding:9px 16px;min-height:44px;min-width:44px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#0b1416}}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 4px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:6px 4px;text-align:center}
.stat b{display:block;font-size:1.15rem;line-height:1.4}
.stat span{font-size:.75rem;color:var(--muted)}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meta{font-size:.82rem;color:var(--muted)}
.qhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.qhead h2{font-size:1.05rem;margin:0}
.chip{display:inline-block;font-size:.78rem;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 10px}
.qtext{font-size:1.08rem;font-weight:600;margin:10px 0 4px}
.quote{background:var(--soft);border-radius:12px;padding:12px;margin-top:10px;text-align:center}
.quote .ref{font-size:.8rem;color:var(--muted)}
.quran{font-family:"QuizQuran","Amiri Quran","QuizAmiri",serif;font-size:1.5rem;line-height:2.2}
.poem{display:flex;flex-wrap:wrap;justify-content:center;column-gap:28px;font-family:"QuizAmiri","Amiri",serif;font-size:1.28rem;line-height:2}
.prose{font-family:"QuizAmiri","Amiri",serif;font-size:1.15rem;line-height:2;text-align:right}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:right;font:inherit;font-size:1rem;line-height:1.7;padding:12px 14px;margin-top:8px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent)}}
.opt{touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
.opt .k{flex:0 0 auto;min-width:1.6em;height:1.6em;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;margin-top:.1em}
.opt:disabled{cursor:default}
.opt.correct{background:var(--ok-soft);border:2px solid var(--ok);font-weight:600}
.opt.wrong{background:var(--bad-soft);border:2px solid var(--bad)}
.opt.dim{opacity:.55}
.fb{margin-top:12px;padding:12px;border-radius:12px;font-size:.95rem}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.fb .t{font-weight:700}.fb.ok .t{color:var(--ok)}.fb.bad .t{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:8px}
th,td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:right}
th{color:var(--muted);font-weight:600}
.notice{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:.92rem;margin-top:12px}
.warnbox{background:var(--bad-soft);border-radius:12px;padding:10px 12px;font-size:.92rem;margin-top:12px}
.wrongitem{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.93rem}
.wrongitem .a{color:var(--ok)}
h3{font-size:1.02rem;margin:0 0 4px}
.final{font-size:1.15rem;font-weight:700}
footer{margin-top:18px;font-size:.8rem;color:var(--muted);text-align:center}
@media (min-width:700px){.wrap{padding:22px 20px 50px}header h1{font-size:1.55rem}.stat b{font-size:1.3rem}}
</style>
</head>

const QUESTIONS = [{"id":"i1","sec":"intro","topic":"سورة النور – المفردات","kind":"mcq","q":"معنى الفعل «يزجي» في الآية الكريمة كما ورد في شرح الكتاب:","quote":{"type":"quran","text":"أَلَمْ تَرَ أَنَّ ٱللَّهَ يُزْجِى سَحَابًا","ref":"النور: 43"},"options":["يسوق برفق","يجمع بقوة وعنف","يُنزل المطر بغزارة","يحجب ضوء الشمس"],"answer":0,"explain":"يُزجي: يسوق برفق؛ فالله تعالى يسوق السحاب سوقًا رفيقًا ثم يؤلّف بينه.","page":"13"},{"id":"i2","sec":"intro","topic":"سورة النور – المفردات","kind":"mcq","q":"معنى كلمة «الوَدْق» في الآية الكريمة:","quote":{"type":"quran","text":"فَتَرَى ٱلْوَدْقَ يَخْرُجُ مِنْ خِلَـٰلِهِۦ","ref":"النور: 43"},"options":["المطر","البرق","السحاب المتراكم","البَرَد"],"answer":0,"explain":"الودق: المطر، يخرج من خلال السحاب أي من فُرَجه ومخارجه.","page":"13"},{"id":"i3","sec":"intro","topic":"سورة النور – ربط بالنحو","kind":"mcq","q":"الفعل «يَكَادُ» في الآية الكريمة من أفعال:","quote":{"type":"quran","text":"يَكَادُ سَنَا بَرْقِهِۦ يَذْهَبُ بِٱلْأَبْصَـٰرِ","ref":"النور: 43"},"options":["المقاربة","الرجاء","الشروع","القلوب (الظن واليقين)"],"answer":0,"explain":"كاد/يكاد يدل على قرب وقوع الخبر (المقاربة)، وخبره هنا جملة «يذهب» ولم يقترن بـ«أن» وهو الأكثر.","page":"13، 56–57"},{"id":"i4","sec":"intro","topic":"سورة النور – البلاغة","kind":"mcq","q":"المحسّن البديعي بين «الليل» و«النهار» في الآية الكريمة:","quote":{"type":"quran","text":"يُقَلِّبُ ٱللَّهُ ٱلَّيْلَ وَٱلنَّهَارَ","ref":"النور: 44"},"options":["طباق إيجاب","طباق سلب","جناس ناقص","مقابلة"],"answer":0,"explain":"جمع بين الشيء وضده دون أن يختلف الضدان إيجابًا وسلبًا، فهو طباق إيجاب.","page":"13، 24"},{"id":"i5","sec":"intro","topic":"سورة النور – التدبر","kind":"mcq","q":"جاء لفظ «ظلمات» بصيغة الجمع ولفظ «نور» بصيغة المفرد في الآية (40). ما دلالة ذلك؟","quote":null,"options":["طرق الضلال كثيرة متشعبة، وطريق الحق واحد","كثرة ساعات الليل وقلة ساعات النهار","مراعاة الفاصلة القرآنية فقط","لا فرق في المعنى بين الجمع والإفراد هنا"],"answer":0,"explain":"الحق طريق واحد مستقيم، أما الباطل فسُبُله متعددة متشعبة؛ ولهذا جُمعت الظلمات وأُفرد النور.","page":"17"},{"id":"i6","sec":"intro","topic":"سورة النور","kind":"tf","q":"سورة النور سورة مدنية.","quote":null,"options":["صواب","خطأ"],"answer":0,"explain":"سورة النور من السور المدنية، وفي الكتاب سؤال يطلب تحديد نوعها.","page":"14"},{"id":"i7","sec":"intro","topic":"البلاغة – الاستعارة","kind":"mcq","q":"نوع الاستعارة في قوله تعالى على لسان زكريا عليه السلام:","quote":{"type":"quran","text":"وَٱشْتَعَلَ ٱلرَّأْسُ شَيْبًا","ref":"مريم: 4"},"options":["استعارة مكنية","استعارة تصريحية","تشبيه بليغ","تشبيه ضمني"],"answer":0,"explain":"شبّه انتشار الشيب في الرأس باشتعال النار، فحذف المشبه به (النار) ورمز إليه بشيء من لوازمه «اشتعل»؛ فهي مكنية.","page":"21"},{"id":"i8","sec":"intro","topic":"البلاغة – الاستعارة","kind":"mcq","q":"في الآية الكريمة استُعيرت «الظلمات» للضلال و«النور» للهدى. نوع الاستعارة:","quote":{"type":"quran","text":"لِتُخْرِجَ ٱلنَّاسَ مِنَ ٱلظُّلُمَـٰتِ إِلَى ٱلنُّورِ","ref":"إبراهيم: 1"},"options":["استعارة تصريحية","استعارة مكنية","تشبيه مجمل","كناية"],"answer":0,"explain":"صُرّح بلفظ المشبه به (الظلمات، النور) وحُذف المشبه (الضلال، الهدى)؛ فهي تصريحية.","page":"21"},{"id":"i9","sec":"intro","topic":"البلاغة – البديع","kind":"mcq","q":"بين كلمتي «السّاعة» و«ساعة» في الآية الكريمة:","quote":{"type":"quran","text":"وَيَوْمَ تَقُومُ ٱلسَّاعَةُ يُقْسِمُ ٱلْمُجْرِمُونَ مَا لَبِثُوا۟ غَيْرَ سَاعَةٍ","ref":"الروم: 55"},"options":["جناس تام","جناس ناقص","طباق إيجاب","سجع"],"answer":0,"explain":"اتفق اللفظان في نوع الحروف وشكلها وعددها وترتيبها، واختلف المعنى: الأولى يوم القيامة والثانية جزء من الزمن؛ فهو جناس تام.","page":"23"},{"id":"i10","sec":"intro","topic":"البلاغة – التشبيه","kind":"tf","q":"التشبيه المُجمَل هو التشبيه الذي حُذف منه وجه الشبه.","quote":null,"options":["صواب","خطأ"],"answer":0,"explain":"المجمل ما حُذف منه وجه الشبه، أما البليغ فحُذفت منه الأداة ووجه الشبه معًا.","page":"20"},{"id":"u1_1","sec":"u1","topic":"القضية الأدبية – الأجناس الأدبية","kind":"mcq","q":"من أشهر الملاحم العالمية «الإلياذة» و«الأوديسة»، وهما للشاعر:","quote":null,"options":["هوميروس الإغريقي","شكسبير الإنجليزي","راسين الفرنسي","الفردوسي الفارسي"],"answer":0,"explain":"الإلياذة والأوديسة للشاعر الإغريقي هوميروس، أما «الشاهنامة» فمن الأدب الفارسي.","page":"31"},{"id":"u1_2","sec":"u1","topic":"القضية الأدبية – الأجناس الأدبية","kind":"mcq","q":"سُمّيت المرحلة الثانية من مراحل الشعر الحر، التي تحلل فيها الشعراء من أوزان الخليل والتزموا التفعيلة:","quote":null,"options":["شعر التفعيلة","قصيدة النثر","الشعر الملحمي","الشعر المسرحي"],"answer":0,"explain":"التزم شعراء المرحلة الثانية التفعيلة فسُمّي شعرهم «شعر التفعيلة»، ومن أعلامه نازك الملائكة والسياب ومحمود درويش.","page":"31"},{"id":"u1_3","sec":"u1","topic":"القضية الأدبية – المقال","kind":"mcq","q":"المقال الذي يعبّر فيه الكاتب عن الحقيقة العلمية بأسلوب أدبي واضح هو:","quote":null,"options":["المقال العلمي المتأدّب","المقال العلمي البحت","المقال العلمي الميسّر","المقال الأدبي"],"answer":0,"explain":"العلمي المتأدّب يعرض الحقيقة العلمية بأسلوب أدبي، أما البحت فيبتعد عن المجاز والصور.","page":"32"},{"id":"u1_4","sec":"u1","topic":"القضية الأدبية – الخطبة","kind":"tf","q":"الخطبة أحدث فنون النثر العربي ظهورًا.","quote":null,"options":["صواب","خطأ"],"answer":1,"explain":"الخطبة أقدم فنون النثر، وكانت قديمًا مشافهة ثم صارت أحيانًا مكتوبة وأخذت مسمى «الخطاب».","page":"32"},{"id":"u1_5","sec":"u1","topic":"القضية الأدبية – المسرحية","kind":"mcq","q":"تأثّر مارون النقاش بالأديب الفرنسي «موليير»، فترجم مسرحية:","quote":null,"options":["البخيل","مجنون ليلى","أهل الكهف","مصرع كليوباترا"],"answer":0,"explain":"ترجم مارون النقاش «البخيل» ونقلها إلى المسرح العربي، ثم كتب «الحسود السليط» و«أبو الحسن المغفل».","page":"33"},{"id":"u1_6","sec":"u1","topic":"مستقبل العالم ومكاننا فيه","kind":"mcq","q":"من الظواهر التي شهدها العالم في أواخر القرن العشرين كما في الفقرة الثانية من المقال:","quote":null,"options":["انتهاء الحرب الباردة بين الدولتين الكبريين","قيام الثورة الصناعية الأولى","اتحاد العالم كله في كتلة اقتصادية واحدة","ظهور الكمبيوتر لأول مرة"],"answer":0,"explain":"ذكر الكاتب سقوط أنظمة سياسية واقتصادية، وانتهاء الحرب الباردة والاستقطاب، وبداية تشكّل نظام عالمي جديد بكتل اقتصادية متقابلة.","page":"48"},{"id":"u1_7","sec":"u1","topic":"مستقبل العالم ومكاننا فيه","kind":"mcq","q":"يرى الكاتب أن البشرية تحتاج إلى بنية تحتية من القيم، وأن الإسلام في ذلك:","quote":null,"options":["أساس صالح ونبع فيّاض لهذه القيم والمبادئ","لا صلة له بالنظام العالمي الجديد","مرحلة ماضية لا يمكن العودة إليها","عائق أمام التواصل مع الأمم"],"answer":0,"explain":"يبرز الإسلام أساسًا صالحًا ونبعًا فيّاضًا للقيم التي تقوم على تكريم الإنسان والمساواة وإشاعة الود والرحمة والتكافل والسلام.","page":"49"},{"id":"u1_8","sec":"u1","topic":"مسيرة وطن وحكمة قائد","kind":"mcq","q":"معنى كلمة «أسلافنا» كما ورد في معجم درس خطاب حضرة صاحب السمو:","quote":null,"options":["من تقدّمنا من الآباء وذوي القرابة في السن أو الفضل","الأجيال القادمة من الأبناء","أعضاء مجلس الشورى","الدول الشقيقة المجاورة"],"answer":0,"explain":"الأسلاف جمع سَلَف: كل من تقدّمك من آبائك وذوي قرابتك في السن أو الفضل.","page":"38"},{"id":"u1_9","sec":"u1","topic":"النحو – أفعال المقاربة والرجاء والشروع","kind":"mcq","q":"الفعل الذي يجب اقتران خبره بـ«أنْ» من الأفعال الآتية:","quote":null,"options":["حَرَى","كاد","طَفِق","كَرَب"],"answer":0,"explain":"يجب اقتران خبر «حرى» و«اخلولق» بأن، ويقلّ مع كاد وكرب، ويمتنع مع أفعال الشروع مثل طفق.","page":"57–58"},{"id":"u1_10","sec":"u1","topic":"النحو – أفعال المقاربة والرجاء والشروع","kind":"mcq","q":"«أخذ الطلابُ يستعدّون للاختبار». الحكم الصحيح على الفعل «أخذ» هنا:","quote":null,"options":["فعل شروع، وخبره لا يقترن بـ«أن»","فعل مقاربة، ويجب اقتران خبره بـ«أن»","فعل رجاء، ويكثر اقتران خبره بـ«أن»","فعل ماضٍ تام لا عمل له"],"answer":0,"explain":"أخذ هنا تدل على البدء في الفعل (شروع)، وخبر أفعال الشروع لا يقترن بأن؛ لأنها للحال وأن للاستقبال.","page":"56–58"},{"id":"u1_11","sec":"u1","topic":"الكتابة – المقال النقاشي","kind":"mcq","q":"الجزء من المقال النقاشي الذي يتضمن خلاصة رأي الكاتب والموازنة بين الآراء أو ترجيح بعضها معلَّلًا هو:","quote":null,"options":["الخاتمة","المقدمة","العنوان","العرض"],"answer":0,"explain":"الخاتمة تتضمن خلاصة رأي الكاتب في قضية النقاش، والموازنة بين الآراء أو ترجيح بعضها معلّلًا لرأيه بحجج وأدلة مقنعة.","page":"62"},{"id":"u1_12","sec":"u1","topic":"التحدث – المناظرة","kind":"mcq","q":"تتكوّن فِرَق المناظرة من:","quote":null,"options":["فريق موالاة، وفريق معارضة، وفريق المحكّمين","فريق المتحدثين وفريق المستمعين فقط","فريق واحد يعرض الحجج ويردّ عليها","الطلاب والمعلم وأولياء الأمور"],"answer":0,"explain":"أولى مراحل المناظرة تكوين فرقائها: الموالاة، والمعارضة، والمحكّمين، ثم تعلن لجنة الحكم النتيجة.","page":"70"},{"id":"u2_1","sec":"u2","topic":"القضية الأدبية – مدرسة الإحياء","kind":"mcq","q":"أيٌّ مما يأتي ليس من أسماء مدرسة «الإحياء»؟","quote":null,"options":["المدرسة الرومانسية","مدرسة البعث","المدرسة التقليدية","المدرسة الكلاسيكية"],"answer":0,"explain":"عُرفت بمدرسة البعث، والبعث والإحياء، والتقليدية، والكلاسيكية. أما الرومانسية فمدرسة لاحقة (الوحدة الرابعة).","page":"75"},{"id":"u2_2","sec":"u2","topic":"القضية الأدبية – مدرسة الإحياء","kind":"tf","q":"من السمات الفنية لمدرسة الإحياء تعدّد الأغراض الشعرية في القصيدة الواحدة.","quote":null,"options":["صواب","خطأ"],"answer":0,"explain":"من سماتها أن ينتقل الشاعر في القصيدة الواحدة من الغزل إلى الفخر إلى الوصف، مع المحافظة على وحدة الوزن والقافية.","page":"77"},{"id":"u2_3","sec":"u2","topic":"غربة وحنين – الشاعر","kind":"mcq","q":"أنشد البارودي قصيدته «غربة وحنين» وهو منفيٌّ في:","quote":null,"options":["سرنديب (جزيرة سيلان)","الأستانة","بيروت","روضة النيل"],"answer":0,"explain":"نُفي البارودي إلى جزيرة سيلان (سرنديب، سريلانكا اليوم) بعد الثورة العرابية، وبقي أكثر من سبعة عشر عامًا.","page":"80"},{"id":"u2_4","sec":"u2","topic":"غربة وحنين – الشاعر","kind":"mcq","q":"لُقّب محمود سامي البارودي بـ:","quote":null,"options":["ربّ السيف والقلم","أمير الشعراء","شاعر النيل","رائد المسرح الذهني"],"answer":0,"explain":"لُقّب البارودي «رب السيف والقلم»، وهو رائد مدرسة الإحياء التي أعادت الشعر العربي إلى عصور القوة.","page":"80"},{"id":"u2_5","sec":"u2","topic":"غربة وحنين – البلاغة","kind":"mcq","q":"في قول البارودي «أبيت أرعى نجوم الليل» كناية عن:","quote":{"type":"poem","lines":["أَبِيتُ أَرْعَى نُجُومَ اللَّيْلِ مُرْتَفِقًا","في قُنَّةٍ عَزَّ مَرْقَاهَا عَلَى الرَّاقِي"],"ref":"غربة وحنين، البيت 6"},"options":["الأرق والهمّ","الفرح بجمال الليل","الاهتمام بعلم الفلك","الاستعداد للسفر"],"answer":0,"explain":"رعي نجوم الليل: مراقبتها وانتظار مغيبها، وهو كناية عن الأرق والهم كما في شرح الكتاب.","page":"81"},{"id":"u2_6","sec":"u2","topic":"غربة وحنين – الأفكار","kind":"mcq","q":"الفكرة التي يعبّر عنها البيت الآتي:","quote":{"type":"poem","lines":["لا بُدَّ لِلضِّيْقِ بَعْدَ الْيَأْسِ مِنْ فَرَجٍ","وكُلُّ داجِيَةٍ يَومًا لإِشْرَاقِ"],"ref":"غربة وحنين، البيت 16"},"options":["الأمل في انفراج الشدة مهما اشتدت","الحزن على فراق الأهل والديار","وصف جمال روضة النيل","الشكوى من ظلم الأعداء"],"answer":0,"explain":"يختم البارودي قصيدته بالتفاؤل: لا بد للضيق من فرج، ولكل ظلمة (داجية) إشراق.","page":"81"},{"id":"u2_7","sec":"u2","topic":"غربة وحنين – الأفكار","kind":"mcq","q":"المبدأ الذي يؤمن به البارودي في البيت الآتي:","quote":{"type":"poem","lines":["وَهَوَّنَ الْخَطْبَ عِنْدِى أَنَّنِي رَجُلٌ","لاَقٍ مِنَ الدَّهْرِ مَا كُلُّ امْرِئٍ لاَقِي"],"ref":"غربة وحنين، البيت 14"},"options":["هوّن عليه المصيبةَ أنّ ما لقيه يلقاه كل الناس","الاستسلام لليأس أمام المصائب","لوم الدهر وحده على ما أصابه","التفاخر بالشجاعة في الحروب"],"answer":0,"explain":"يرى أن المصائب سُنّة الحياة تصيب كل إنسان، فيهون عليه الخطب ويصبر.","page":"81، 84"},{"id":"u2_8","sec":"u2","topic":"بلقيس – الفهم","kind":"tf","q":"رأت بلقيس أن قوة الجيش تبرّر الإسراع إلى استعماله في كل حين.","quote":null,"options":["صواب","خطأ"],"answer":1,"explain":"قالت بلقيس: قوة الجيش لا تبرر الإسراع إلى استعماله في كل حين، ولا شيء خير من السلام إذا جثمت خلفه قوة الجيش تحميه.","page":"89"},{"id":"u2_9","sec":"u2","topic":"بلقيس – الفهم","kind":"mcq","q":"كان رأي رئيس الجيش في أمر كتاب سليمان عليه السلام:","quote":null,"options":["الحرب","قبول الدعوة فورًا","إرسال الهدايا","ترك الأمر للوزراء"],"answer":0,"explain":"أصرّ رئيس الجيش على رأيه الأول: الحرب، معتمدًا على أنهم أولو بأس شديد ولهم جيش قوي.","page":"89"},{"id":"u2_10","sec":"u2","topic":"بلقيس – الفهم","kind":"mcq","q":"لماذا أرسلت بلقيس رسلًا يحملون هدية إلى سليمان عليه السلام؟","quote":null,"options":["لتتبيّن حقيقة غرضه","لتعلن الحرب عليه","لتشتري منه الخيل والمركبات","لتطلب منه زيارة سبأ"],"answer":0,"explain":"قالت بلقيس: خطر لي أن أبعث رسلًا يحملون هدية مني إليه حتى أتبيّن حقيقة غرضه.","page":"90"},{"id":"u2_11","sec":"u2","topic":"بلقيس – البلاغة","kind":"mcq","q":"نوع التشبيه في قول الرسول: «الفضة والذهب لديهم مثل الحجارة»:","quote":null,"options":["تشبيه مجمل","تشبيه بليغ","تشبيه تمثيلي","تشبيه ضمني"],"answer":0,"explain":"ذُكرت الأداة (مثل) وحُذف وجه الشبه (الكثرة والوفرة)؛ فهو تشبيه مجمل.","page":"90، 20"},{"id":"u2_12","sec":"u2","topic":"النحو – أحوال المبتدأ والخبر","kind":"mcq","q":"«في الحديقةِ أزهارٌ». تقدّم الخبر على المبتدأ في الجملة لأن:","quote":null,"options":["المبتدأ نكرة والخبر شبه جملة","المبتدأ ضمير منفصل","الخبر محصور في المبتدأ","المبتدأ مصدر مؤول"],"answer":0,"explain":"من حالات تقدّم الخبر: أن يكون المبتدأ نكرة والخبر شبه جملة، مثل: في المسجد رجال.","page":"97"},{"id":"u2_13","sec":"u2","topic":"النحو – أحوال المبتدأ والخبر","kind":"mcq","q":"«لولا الأملُ لضاقت الحياةُ». ركن الجملة الاسمية المحذوف بعد «لولا»:","quote":null,"options":["الخبر، وتقديره: موجود","المبتدأ، وتقديره: هو","لا حذف في الجملة","الفعل، وتقديره: كان"],"answer":0,"explain":"يُحذف الخبر إذا كان المبتدأ مسبوقًا بلولا، والتقدير: لولا الأملُ موجودٌ.","page":"97"},{"id":"u2_14","sec":"u2","topic":"النحو – أحوال المبتدأ والخبر","kind":"mcq","q":"في قوله تعالى، المحذوف من ركني الجملة الاسمية هو:","quote":{"type":"quran","text":"فَصَبْرٌ جَمِيلٌ","ref":"يوسف: 18"},"options":["المبتدأ، والتقدير: فصبري صبرٌ جميل","الخبر، والتقدير: فصبرٌ جميلٌ أولى","المبتدأ والخبر معًا","لا محذوف في الآية"],"answer":0,"explain":"يُحذف المبتدأ إذا كان خبره مصدرًا نائبًا عن فعله، والتقدير: فصبري صبرٌ جميل.","page":"96–97"},{"id":"u3_1","sec":"u3","topic":"النبوغ – الأسلوب","kind":"mcq","q":"تمثّل العبارة الآتية خاصية من خصائص أسلوب المنفلوطي، هي:","quote":{"type":"prose","text":"فتراه صغيرًا في عِلمه، صغيرًا في أدبه، صغيرًا في مُروءته وهمَّته","ref":"النبوغ، الفقرة 1"},"options":["التكرار والإطناب","الإيجاز الشديد","استعمال الكلمات العامية","الغموض والتعقيد"],"answer":0,"explain":"من خصائص أسلوبه التكرار والإطناب؛ فهو كثيرًا ما يعيد في معانيه، كما في تكرار «صغيرًا في...».","page":"107–108"},{"id":"u3_2","sec":"u3","topic":"النبوغ – الفهم","kind":"mcq","q":"التواضع في مفهوم الكاتب هو:","quote":null,"options":["الأدب","صِغَر النفس","التذلّل والتملّق","ترك الطموح"],"answer":0,"explain":"يقول الكاتب: «وما التواضع إلا الأدب، ولا الكبر إلا سوء الأدب»، وينكر الخلط بين التواضع وصغر النفس.","page":"108"},{"id":"u3_3","sec":"u3","topic":"النبوغ – الفهم","kind":"mcq","q":"الجناحان العظيمان اللذان يطير بهما المتعلم إلى سماء المجد والشرف هما:","quote":null,"options":["علوّ الهمة، والفهم في العلم","الحفظ، والتكرار","المال، والجاه","الذكاء، والحظ"],"answer":0,"explain":"جناحان عظيمان يطير بهما المتعلم: علو الهمة، والفهم في العلم.","page":"109"},{"id":"u3_4","sec":"u3","topic":"النبوغ – الفهم","kind":"mcq","q":"كان طالب العلم أحوج الناس إلى علوّ الهمة؛ لأن:","quote":null,"options":["حاجة الأمة إلى نبوغه أكثر من حاجتها إلى نبوغ سواه","العلم سهل لا يحتاج إلى جهد","الصانعين أقدر منه على النبوغ","الهمة العالية تغني عن الفهم"],"answer":0,"explain":"علّل الكاتب ذلك بأن حاجة الأمة إلى نبوغ طالب العلم أكثر من حاجتها إلى نبوغ الصانعين والمحترفين.","page":"109"},{"id":"u3_5","sec":"u3","topic":"النبوغ – البلاغة","kind":"mcq","q":"يقول الكاتب عن طالب العلم: «بل هو البحر الزاخر الذي تستقي منه الجداول والغدران». نوع التشبيه في قوله «هو البحر»:","quote":null,"options":["تشبيه بليغ","تشبيه تمثيلي","تشبيه ضمني","تشبيه مفصّل"],"answer":0,"explain":"حُذفت الأداة ووجه الشبه، وبقي المشبه (هو) والمشبه به (البحر)؛ فهو تشبيه بليغ.","page":"109، 20"},{"id":"u3_6","sec":"u3","topic":"النبوغ – الفهم","kind":"tf","q":"يرى الكاتب أن من يخطئ في تقدير قيمته مستعليًا خيرٌ ممن يخطئ في تقديرها متدلّيًا.","quote":null,"options":["صواب","خطأ"],"answer":0,"explain":"هذا رأي الكاتب صراحةً؛ لأن من صغرت نفسه في عين نفسه صغُر في علمه وأدبه وهمّته وسائر شؤونه.","page":"108"},{"id":"u3_7","sec":"u3","topic":"ثورة الفرص وتحديات الغد","kind":"mcq","q":"عُرفت الثورة الصناعية الثالثة التي قادها الكمبيوتر منذ ستينيات القرن العشرين بـ:","quote":null,"options":["الثورة الرقمية","ثورة البخار","ثورة الفولاذ والنفط","الثورة الزراعية"],"answer":0,"explain":"قاد الكمبيوتر الثورة الصناعية الثالثة «الثورة الرقمية» بتحويل الأجهزة الإلكترونية والميكانيكية إلى التكنولوجيا الرقمية.","page":"118"},{"id":"u3_8","sec":"u3","topic":"ثورة الفرص وتحديات الغد","kind":"mcq","q":"يرتكز ما اصطُلح على تسميته «التعليم 4.0» على:","quote":null,"options":["الذكاء الاصطناعي والتعلم الآلي","الحفظ والتلقين","التعليم الورقي التقليدي","تقليل عدد الطلاب في الفصول"],"answer":0,"explain":"التعليم 4.0 يرتكز على الذكاء الاصطناعي والتعلم الآلي لتقديم تعلّم مستمر ومرن ومخصّص للطلاب.","page":"119"},{"id":"u3_9","sec":"u3","topic":"ثورة الفرص وتحديات الغد","kind":"tf","q":"في ظل الثورة الصناعية الرابعة سيكون ميزان القوة للدول بحجمها وكثافتها السكانية.","quote":null,"options":["صواب","خطأ"],"answer":1,"explain":"يقرر النص أن ميزان القوة لن يكون بالحجم والكثافة السكانية، بل للأسرع في استيعاب أدوات هذه الثورة.","page":"119"},{"id":"u3_10","sec":"u3","topic":"النحو – المصدر المؤول","kind":"mcq","q":"«يسرّني أن تتفوّقَ». المصدر المؤول في الجملة في محل:","quote":null,"options":["رفع فاعل","نصب مفعول به","جر بحرف الجر","رفع مبتدأ"],"answer":0,"explain":"التأويل: يسرّني تفوّقُك؛ فالمصدر المؤول (أن تتفوق) في محل رفع فاعل.","page":"126"},{"id":"u3_11","sec":"u3","topic":"النحو – المصدر المؤول","kind":"mcq","q":"«علمتُ أنّك صادقٌ». تأويل المصدر المؤول وموقعه الإعرابي:","quote":null,"options":["صِدْقَك – مفعول به","صِدْقُك – فاعل","صِدْقِك – مجرور","صِدْقُك – خبر"],"answer":0,"explain":"أنّ واسمها وخبرها تؤوَّل بمصدر صريح: علمتُ صدقَك؛ فهو في محل نصب مفعول به.","page":"126"},{"id":"u3_12","sec":"u3","topic":"النحو – المصدر المؤول","kind":"mcq","q":"أيُّ الحروف الآتية ليس من الحروف المصدرية التي يتكوّن منها المصدر المؤول في الدرس؟","quote":null,"options":["لَنْ","أنْ","أنَّ","ما"],"answer":0,"explain":"يتكوّن المصدر المؤول من: ما + الفعل، أو أنّ + اسمها وخبرها، أو أنْ + الفعل. أما «لن» فحرف نفي ونصب.","page":"126"}];
const SEC_ORDER = ["intro","u1","u2","u3"];
const SEC_LABEL = {intro:"المدخل",u1:"الوحدة الأولى",u2:"الوحدة الثانية",u3:"الوحدة الثالثة"};
const BY_ID = {}; QUESTIONS.forEach(q => BY_ID[q.id] = q);
const KEY = "arabic-g12-s1-quiz-v1";
const LETTERS = "أبجد";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function shuffled(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function idsFor(f){return QUESTIONS.filter(q=>f==="all"||q.sec===f).map(q=>q.id);}
function labelFor(f){return f==="all"?"كل الأسئلة":SEC_LABEL[f];}
function makeSession(ids,label,filter){
  const perm={}; ids.forEach(id=>{const q=BY_ID[id];perm[id]=q.kind==="tf"?[0,1]:shuffled(q.options.length);});
  return {ids,perm,picks:{},idx:0,finished:false,recorded:false,label,filter,started:new Date().toISOString()};
}
function validSession(s){
  if(!s||!Array.isArray(s.ids)||!s.ids.length||typeof s.perm!=="object"||typeof s.picks!=="object") return false;
  for(const id of s.ids){const q=BY_ID[id];if(!q)return false;const p=s.perm[id];
    if(!Array.isArray(p)||p.length!==q.options.length||[...p].sort().join()!==[...Array(q.options.length).keys()].join())return false;}
  for(const id in s.picks){if(!s.ids.includes(id)||!Number.isInteger(s.picks[id]))return false;}
  return Number.isInteger(s.idx)&&s.idx>=0&&s.idx<s.ids.length;
}
let storageOK=true;
function load(){
  const d={name:"",filter:"all",session:null,history:[]};
  try{const raw=localStorage.getItem(KEY);if(!raw)return d;const s=JSON.parse(raw);
    return {name:typeof s.name==="string"?s.name.slice(0,60):"",
      filter:(s.filter==="all"||SEC_LABEL[s.filter])?s.filter:"all",
      session:validSession(s.session)?s.session:null,
      history:Array.isArray(s.history)?s.history.filter(h=>h&&typeof h.date==="string").slice(0,100):[]};
  }catch(e){storageOK=false;return d;}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));storageOK=true;}catch(e){storageOK=false;}}

let store=load();
let resumed=false;
if(store.session&&!store.session.finished&&Object.keys(store.session.picks).length>0) resumed=true;
if(!store.session){store.session=makeSession(idsFor(store.filter),labelFor(store.filter),store.filter);save();}

function tally(s){let c=0,w=0;s.ids.forEach(id=>{if(!(id in s.picks))return;if(s.picks[id]===BY_ID[id].answer)c++;else w++;});return {correct:c,wrong:w,answered:c+w,total:s.ids.length};}
function pct(a,b){return b?Math.round(a/b*100)+"٪":"—";}
function secBreakdown(s){
  return SEC_ORDER.filter(sec=>s.ids.some(id=>BY_ID[id].sec===sec)).map(sec=>{
    const ids=s.ids.filter(id=>BY_ID[id].sec===sec);const c=ids.filter(id=>s.picks[id]===BY_ID[id].answer).length;
    return {sec,correct:c,total:ids.length};});
}
function fmtDate(iso){try{return new Date(iso).toLocaleString("ar-QA-u-nu-latn",{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});}catch(e){return iso;}}

// ---------- actions ----------
function startNew(f){store.filter=f;store.session=makeSession(idsFor(f),labelFor(f),f);resumed=false;save();render();scrollTopCard();}
function pick(orig){const s=store.session;const id=s.ids[s.idx];if(s.finished||id in s.picks)return;s.picks[id]=orig;save();render();}
function next(){const s=store.session;const id=s.ids[s.idx];if(!(id in s.picks))return;
  if(s.idx<s.ids.length-1){s.idx++;}else{s.finished=true;recordHistory(s);}
  resumed=false;save();render();scrollTopCard();}
function prev(){const s=store.session;if(s.idx>0){s.idx--;save();render();}}
function recordHistory(s){
  if(s.recorded)return;s.recorded=true;const t=tally(s);
  store.history.unshift({date:new Date().toISOString(),label:s.label,correct:t.correct,total:t.total,
    sections:secBreakdown(s).map(x=>({sec:x.sec,correct:x.correct,total:x.total}))});
  store.history=store.history.slice(0,100);
}
function wrongIds(s){return s.ids.filter(id=>id in s.picks&&s.picks[id]!==BY_ID[id].answer);}
function retryWrong(){const s=store.session;const w=wrongIds(s);if(!w.length)return;
  const base=s.label.startsWith("إعادة الخاطئة")?s.label:"إعادة الخاطئة — "+s.label;
  store.session=makeSession(w,base,s.filter);resumed=false;save();render();scrollTopCard();}
function resetProgress(){if(!confirm("سيُحذف تقدّمك في المحاولة الحالية وتبدأ من جديد. هل أنت متأكد؟"))return;startNew(store.filter);}
function clearHistory(){if(!confirm("سيُحذف سجل المحاولات السابقة كله. هل أنت متأكد؟"))return;store.history=[];save();render();}
function scrollTopCard(){const el=document.getElementById("main");if(el&&el.getBoundingClientRect().top<0)el.scrollIntoView({block:"start"});}

// ---------- render ----------
function quoteHTML(qt){
  if(!qt)return "";
  if(qt.type==="quran")return `<div class="quote"><div class="quran">﴿${esc(qt.text)}﴾</div><div class="ref">[${esc(qt.ref)}]</div></div>`;
  if(qt.type==="poem")return `<div class="quote"><div class="poem">${qt.lines.map(l=>`<span>${esc(l)}</span>`).join("")}</div><div class="ref">(${esc(qt.ref)})</div></div>`;
  return `<div class="quote"><div class="prose">«${esc(qt.text)}»</div><div class="ref">(${esc(qt.ref)})</div></div>`;
}
function render(){
  const s=store.session;const t=tally(s);
  const filterOpts=[["all",`كل الأسئلة (${QUESTIONS.length})`],...SEC_ORDER.map(k=>[k,`${SEC_LABEL[k]} (${idsFor(k).length})`])];
  let h=`<header><h1>كويز تفاعلي — اللغة العربية</h1><p>الصف الثاني عشر · الفصل الدراسي الأول · المدخل والوحدات الأولى والثانية والثالثة (كتاب الطالب ص 11–132)</p></header>`;
  h+=`<section class="card" aria-label="الإعدادات">
    <div class="field"><label for="name">الاسم (اختياري — يُحفظ على هذا الجهاز فقط)</label><input id="name" maxlength="60" autocomplete="off" placeholder="اكتب اسمك إن أردت" value="${esc(store.name)}"></div>
    <div class="field"><label for="filter">اختر الأسئلة (تغيير الاختيار يبدأ محاولة جديدة)</label><select id="filter">${filterOpts.map(([v,l])=>`<option value="${v}"${v===store.filter?" selected":""}>${esc(l)}</option>`).join("")}</select></div>
    <div class="row"><button class="btn" id="restart">ابدأ محاولة جديدة</button><button class="btn danger" id="reset">إعادة ضبط التقدّم</button></div>
  </section>`;
  if(!storageOK)h+=`<div class="warnbox">تعذّر الحفظ في هذا المتصفح (ربما وضع التصفح الخاص)، لذا لن يُستأنف التقدّم بعد إعادة التحميل.</div>`;
  if(resumed)h+=`<div class="notice" id="resumed">تم استئناف محاولتك السابقة: ${esc(s.label)} — السؤال ${s.idx+1} من ${s.ids.length}.</div>`;
  h+=`<div class="stats" aria-live="polite">
    <div class="stat ok"><b id="st-ok">${t.correct}</b><span>صحيحة</span></div>
    <div class="stat bad"><b id="st-bad">${t.wrong}</b><span>خاطئة</span></div>
    <div class="stat"><b id="st-ans">${t.answered}/${t.total}</b><span>أُجيب عنها</span></div>
    <div class="stat"><b id="st-pct">${pct(t.correct,t.answered)}</b><span>النسبة</span></div>
  </div><div class="progress"><i style="width:${Math.round(t.answered/t.total*100)}%"></i></div>`;
  if(!s.finished){
    const q=BY_ID[s.ids[s.idx]];const picked=q.id in s.picks?s.picks[q.id]:null;
    h+=`<section class="card" id="main" data-qid="${q.id}">
      <div class="qhead"><h2>السؤال ${s.idx+1} من ${s.ids.length}</h2><span class="chip">${esc(SEC_LABEL[q.sec])}</span></div>
      <div class="meta">${esc(s.label)} · ${esc(q.topic)} · ${q.kind==="tf"?"صواب أم خطأ؟":"اختر الإجابة الصحيحة"}</div>
      <div class="qtext">${esc(q.q)}</div>${quoteHTML(q.quote)}
      <div role="group" aria-label="الخيارات">${s.perm[q.id].map((orig,i)=>{
        let cls="opt";if(picked!==null){cls+=orig===q.answer?" correct":orig===picked?" wrong":" dim";}
        const mark=picked!==null&&orig===q.answer?" ✓":picked!==null&&orig===picked?" ✗":"";
        const key=q.kind==="mcq"?LETTERS[i]:(orig===0?"ص":"خ");
        return `<button class="${cls}" data-orig="${orig}"${picked!==null?" disabled":""}><span class="k">${key}</span><span class="ot">${esc(q.options[orig])}${mark}</span></button>`;}).join("")}</div>`;
    if(picked!==null){const ok=picked===q.answer;
      h+=`<div class="fb ${ok?"ok":"bad"}" id="feedback" role="status"><div class="t">${ok?"✓ إجابة صحيحة":"✗ إجابة غير صحيحة — الصواب: "+esc(q.options[q.answer])}</div><div>${esc(q.explain)}</div><div class="meta">المرجع: كتاب الطالب ص ${esc(q.page)}</div></div>`;}
    h+=`<div class="row"><button class="btn primary" id="next"${picked===null?" disabled":""}>${s.idx<s.ids.length-1?"السؤال التالي":"عرض النتيجة"}</button><button class="btn" id="prev"${s.idx===0?" disabled":""}>السابق</button></div></section>`;
  }else{
    const w=wrongIds(s);const nm=store.name.trim();
    h+=`<section class="card" id="main"><h3>النتيجة النهائية — ${esc(s.label)}</h3>
      <div class="final" id="final">${nm?esc(nm)+"، ":""}نتيجتك: ${t.correct} من ${t.total} (${pct(t.correct,t.total)})</div>
      <table id="sectable"><thead><tr><th>القسم</th><th>صحيحة</th><th>من</th><th>النسبة</th></tr></thead><tbody>${secBreakdown(s).map(r=>`<tr><td>${SEC_LABEL[r.sec]}</td><td>${r.correct}</td><td>${r.total}</td><td>${pct(r.correct,r.total)}</td></tr>`).join("")}</tbody></table>`;
    if(w.length){h+=`<p class="meta" style="margin-top:12px">الأسئلة التي أخطأت فيها — راجع الصفحة المذكورة ثم أعد المحاولة:</p>`+w.map(id=>{const q=BY_ID[id];return `<div class="wrongitem"><div><b>${esc(q.q)}</b></div><div class="a">الصواب: ${esc(q.options[q.answer])}</div><div class="meta">${SEC_LABEL[q.sec]} · ص ${esc(q.page)}</div></div>`;}).join("");}
    else h+=`<div class="notice">ممتاز! أجبت عن جميع الأسئلة إجابة صحيحة.</div>`;
    h+=`<div class="row"><button class="btn primary" id="retry"${w.length?"":" disabled"}>أعد الأسئلة الخاطئة فقط (${w.length})</button><button class="btn" id="restart2">ابدأ من جديد</button></div></section>`;
  }
  h+=`<section class="card" id="history"><h3>سجل المحاولات</h3>`;
  if(store.history.length){h+=`<table id="histtable"><thead><tr><th>التاريخ</th><th>الأسئلة</th><th>النتيجة</th><th>النسبة</th></tr></thead><tbody>${store.history.map(x=>`<tr><td>${esc(fmtDate(x.date))}</td><td>${esc(x.label)}</td><td>${x.correct}/${x.total}</td><td>${pct(x.correct,x.total)}</td></tr>`).join("")}</tbody></table><div class="row"><button class="btn danger" id="clearhist">مسح السجل</button></div>`;}
  else h+=`<p class="meta">لا توجد محاولات مكتملة بعد. تُسجَّل المحاولة هنا عند عرض النتيجة النهائية.</p>`;
  h+=`</section><footer>يعمل دون اتصال بالإنترنت · تُحفظ البيانات في هذا المتصفح فقط ولا تُرسل إلى أي مكان · ترتيب الخيارات يتغيّر في كل محاولة</footer>`;
  const app=document.getElementById("app");app.innerHTML=h;
  // bind
  const nameEl=document.getElementById("name");
  nameEl.addEventListener("input",()=>{store.name=nameEl.value.slice(0,60);save();const f=document.getElementById("final");if(f){const t2=tally(store.session);const nm=store.name.trim();f.textContent=(nm?nm+"، ":"")+`نتيجتك: ${t2.correct} من ${t2.total} (${pct(t2.correct,t2.total)})`;}});
  document.getElementById("filter").addEventListener("change",e=>startNew(e.target.value));
  document.getElementById("restart").onclick=()=>startNew(store.filter);
  document.getElementById("reset").onclick=resetProgress;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(Number(b.dataset.orig)));
  const bind=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn;};
  bind("next",next);bind("prev",prev);bind("retry",retryWrong);bind("restart2",()=>startNew(store.filter));bind("clearhist",clearHistory);
}
render();
</script>
</body>
</html>
